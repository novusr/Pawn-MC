# Project-wide Gradle settings.
# For more details on how to configure your build environment visit:
# http://gradle.org

# Specifies the JVM arguments used for the Gradle runner.
# Increased to 3GB to provide enough room for Android 36 SDK, NDK, and CMake without hitting GitHub's OOM limit.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Disables the Gradle Daemon to prevent background processes from leaking memory on CI runners.
org.gradle.daemon=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the Android OS.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Enables namespacing of each library's R class to reduce the final APK size.
android.nonTransitiveRClass=true