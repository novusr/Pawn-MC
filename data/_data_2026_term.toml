# PawnMC MC Developer Portal (terminal simulator) data - 2026 format
#
# Naming: _data_2026_term.toml  (terminal / simulation)
# One table per terminal key; the reader asks for a key plus the interface
# language, so a lookup uses the same dotted name the console already uses,
# for example
#   [terminal.docs]  ->  get("terminal.docs", language)
#
# The docs markdown keeps its literal \n sequences; the reader expands them
# into real line breaks. Leaves are id, en, es, ru, with en as the fallback.

[terminal.help]
id = "Perintah yang tersedia:\n  help                 Tampilkan daftar perintah\n  docs                 Buka dokumentasi pawncc\n  pawncc <file> [flag] Jalankan pawncc dengan file dan flag yang ditulis\n  switch [versi]       Ganti compiler 3.10.7 / 3.10.11\n  clear                Bersihkan riwayat console (alias: celar)\n\nContoh: pawncc gamemodes/mode.pwn -d=3\nKetik docs untuk dokumentasi lengkap."
en = "Available commands:\n  help                 Show the command list\n  docs                 Open pawncc documentation\n  pawncc <file> [flags] Run pawncc with the specified file and flags\n  switch [version]     Switch compiler 3.10.7 / 3.10.11\n  clear                Clear console history (alias: celar)\n\nExample: pawncc gamemodes/mode.pwn -d=3\nType docs for full documentation."
es = "Comandos disponibles:\n  help                 Muestra la lista de comandos\n  docs                 Abre la documentacion de pawncc\n  pawncc <archivo> [flags] Ejecuta pawncc con el archivo y los flags indicados\n  switch [version]     Cambia el compilador 3.10.7 / 3.10.11\n  clear                Borra el historial de la consola (alias: celar)\n\nEjemplo: pawncc gamemodes/mode.pwn -d=3\nEscribi docs para ver la documentacion completa."

[terminal.docs]
id = "# MC Developer Portal\n\nConsole ini menjalankan **pawncc native**. Input bukan shell Android: hanya perintah yang tercantum di sini yang dikenali.\n\n## Perintah\n\n- `help` menampilkan daftar perintah.\n- `docs` menampilkan dokumentasi ini.\n- `pawncc <file> [flag...]` mengompilasi file yang disebut secara eksplisit. Perintah `pawncc` tanpa argumen hanya menampilkan cara pakai.\n- `switch [3.10.7|3.10.11]` memilih versi compiler; tanpa argumen, versi console berganti.\n- `clear` menghapus riwayat console; ejaan `celar` juga diterima.\n\n## Contoh\n\n```text\npawncc gamemodes/mode.pwn -d=3\npawncc \"gamemodes/test mode.pwn\" -i=includes -o=mode.amx\nswitch 3.10.11\nclear\n```\n\nHanya flag yang ditulis pada perintah yang diteruskan ke pawncc. Konfigurasi flag, optimisasi, dan include path dari Settings PawnMC tidak ditambahkan. Sertakan sendiri opsi yang diperlukan, misalnya `-i=includes`. File sumber harus berekstensi `.pwn`, `.pawn`, `.p`, atau `.inc` dan berada di dalam workspace.\n\n## Batasan\n\nTidak ada `cd`, `ls`, pipe, redirect, ekspansi shell, atau pemanggilan program lain. Versi console dimulai dari **3.10.7**. Jika library compiler versi lain sudah dimuat aplikasi, mulai ulang aplikasi setelah `switch` agar pilihan berlaku."
en = "# MC Developer Portal\n\nThis console runs the bundled **native pawncc**. Input is not an Android shell: only the commands listed here are recognized.\n\n## Commands\n\n- `help` prints the command list.\n- `docs` displays this documentation.\n- `pawncc <file> [flags...]` compiles the explicitly named file. Bare `pawncc` only prints usage.\n- `switch [3.10.7|3.10.11]` selects the compiler version; without an argument, it toggles the console version.\n- `clear` removes console history; the spelling `celar` is also accepted.\n\n## Examples\n\n```text\npawncc gamemodes/mode.pwn -d=3\npawncc \"gamemodes/test mode.pwn\" -i=includes -o=mode.amx\nswitch 3.10.11\nclear\n```\n\nOnly flags written in the command are passed to pawncc. PawnMC Settings for flags, optimization, and include paths are not added. Specify needed options yourself, for example `-i=includes`. Source files must use `.pwn`, `.pawn`, `.p`, or `.inc` and stay inside the workspace.\n\n## Limits\n\nThere is no `cd`, `ls`, pipe, redirect, shell expansion, or launching other programs. The console starts with **3.10.7**. If another native compiler library is already loaded by the app, restart after `switch` for the selection to take effect."
es = "# MC Developer Portal\n\nEsta consola ejecuta el **pawncc nativo** incluido. La entrada no es una shell de Android: solo se reconocen los comandos listados aca.\n\n## Comandos\n\n- `help` muestra la lista de comandos.\n- `docs` muestra esta documentacion.\n- `pawncc <archivo> [flags...]` compila el archivo indicado explicitamente. `pawncc` sin argumentos solo muestra el modo de uso.\n- `switch [3.10.7|3.10.11]` elige la version del compilador; sin argumento, alterna la version de la consola.\n- `clear` borra el historial de la consola; tambien se acepta la grafia `celar`.\n\n## Ejemplos\n\n```text\npawncc gamemodes/mode.pwn -d=3\npawncc \"gamemodes/test mode.pwn\" -i=includes -o=mode.amx\nswitch 3.10.11\nclear\n```\n\nSolo se pasan a pawncc los flags escritos en el comando. No se agregan los flags, la optimizacion ni las rutas de include de la configuracion de PawnMC. Especifica vos mismo las opciones que necesites, por ejemplo `-i=includes`. Los archivos fuente deben usar `.pwn`, `.pawn`, `.p` o `.inc` y deben quedar dentro del workspace.\n\n## Limites\n\nNo hay `cd`, `ls`, pipes, redireccion, expansion de shell ni ejecucion de otros programas. La consola arranca con **3.10.7**. Si la app ya cargo otra libreria nativa del compilador, reiniciá despues de `switch` para que la eleccion surta efecto."

