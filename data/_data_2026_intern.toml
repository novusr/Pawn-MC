# PawnMC Pawn symbol data - 2026 format
#
# Naming: _data_2026_intern.toml  (internal)
# Keywords, directives, types, constants, callbacks, operators and the
# natives / forwards of every SA-MP include, all in one table set.
#
# Table names use the existing kind and include names, for example
# [item.KEYWORD] and [native."a_players.inc"]; the symbol itself is the
# key. Leaves are `en` and `id`.

# --- language items -------------------------------------------------

