es = "Cuando se elige un archivo, PawnMC selecciona una carpeta de include en este orden: 'pawno/include', 'qawno/include' y luego 'includes'. Si no existe ninguna, igual se agrega 'include/' como alternativa. 'gamemodes/' no se agrega automaticamente. Las extensiones .pawn, .pwn, .p y .inc se eliminan automaticamente de las rutas de include."

