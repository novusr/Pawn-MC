tl = "Mga flag na direktang ipinapasa sa pawncc kapag binubuo ang script. Nalalapat ang mga pagbabago dito sa susunod na kompilasyon."
ru = "Флаги, которые напрямую передаются pawncc при сборке скрипта. Изменения здесь вступают в силу при следующей компиляции."
