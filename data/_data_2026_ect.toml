[settings.include.paths.notice.desc]
id = "Saat file dipilih, PawnMC memilih satu folder include dengan urutan 'pawno/include', 'qawno/include', lalu 'includes'. Jika semuanya tidak tersedia, 'include/' tetap ditambahkan sebagai fallback. Folder 'gamemodes/' tidak ditambahkan otomatis. Ekstensi .pawn, .pwn, .p, dan .inc dihapus otomatis dari path include."
en = "When a file is selected, PawnMC chooses one include folder in this order: 'pawno/include', 'qawno/include', then 'includes'. If none exists, 'include/' is still added as a fallback. 'gamemodes/' is not added automatically. The .pawn, .pwn, .p, and .inc extensions are removed automatically from include paths."
