[settings.compiler.options]
id = "Opsi Compiler"
en = "Compiler Options"
ru = "Параметры компилятора"
es = "Opciones del compilador"

[settings.compiler.options.desc]
id = "Flag yang diteruskan langsung ke pawncc saat membangun skrip. Perubahan di sini berlaku pada kompilasi berikutnya."
en = "Flags passed straight through to pawncc when a script is built. Changes here take effect on the next compilation."
ru = "Флаги, которые напрямую передаются pawncc при сборке скрипта. Изменения здесь вступают в силу при следующей компиляции."
es = "Flags que se pasan directamente a pawncc al construir un script. Los cambios aqui se aplican en la proxima compilacion."

[settings.option.semicolons]
id = "Titik Koma Wajib"
en = "Mandatory Semicolons"
ru = "Обязательные точки с запятой"
es = "Punto y coma obligatorio"

[settings.option.semicolons.desc]
id = "Wajibkan titik koma di akhir setiap pernyataan"
en = "Require semicolons at the end of statements"
ru = "Требовать точку с запятой в конце операторов"
es = "Exigir punto y coma al final de las sentencias"

[settings.option.parentheses]
id = "Tanda Kurung Wajib"
en = "Mandatory Parentheses"
ru = "Обязательные скобки"
es = "Parentesis obligatorios"

[settings.option.parentheses.desc]
id = "Wajibkan tanda kurung pada pernyataan kontrol"
en = "Require parentheses in control statements"
ru = "Требовать скобки в управляющих операторах"
es = "Exigir parentesis en las sentencias de control"

[settings.option.debug]
id = "Tingkat Debug"
en = "Debug Level"
ru = "Уровень отладки"
es = "Nivel de depuracion"

[settings.option.debug.desc]
id = "Menentukan berapa banyak informasi debug dan pemeriksaan runtime yang dibangkitkan compiler. Level lebih tinggi menambah pemeriksaan tetapi memperlambat dan memperbesar hasil."
en = "Controls how much debug information and runtime checking the compiler generates. Higher levels add more checks at the cost of build time and a larger output file."
ru = "Определяет, сколько отладочной информации и проверок во время выполнения генерирует компилятор. Более высокие уровни добавляют проверки ценой времени сборки и размера выходного файла."
es = "Define cuanta informacion de depuracion y comprobacion en tiempo de ejecucion genera el compilador. Los niveles mas altos agregan comprobaciones a costa de tiempo de compilacion y un archivo de salida mas grande."

[settings.option.debug.level.0.label]
id = "Nonaktif (-d0)"
en = "Disabled (-d0)"
ru = "Отключено (-d0)"
es = "Desactivado (-d0)"

[settings.option.debug.level.0.desc]
id = "Tidak menyertakan simbol debug atau validasi runtime."
en = "No debug symbols or runtime validation."
ru = "Без символов отладки и проверок во время выполнения."
es = "Sin simbolos de depuracion ni validacion en tiempo de ejecucion."

[settings.option.debug.level.1.label]
id = "Validasi Runtime (-d1)"
en = "Runtime Validation (-d1)"
ru = "Проверки во время выполнения (-d1)"
es = "Validacion en tiempo de ejecucion (-d1)"

[settings.option.debug.level.1.desc]
id = "Memeriksa batas array tanpa menyertakan simbol debug."
en = "Checks array bounds without including debug symbols."
ru = "Проверяет границы массивов без включения символов отладки."
es = "Comprueba los limites de los arrays sin incluir simbolos de depuracion."

[settings.option.debug.level.2.label]
id = "Debug Lengkap (-d2)"
en = "Full Debugging (-d2)"
ru = "Полная отладка (-d2)"
es = "Depuracion completa (-d2)"

[settings.option.debug.level.2.desc]
id = "Menyertakan informasi debug lengkap dan pemeriksaan runtime."
en = "Includes full debug information and runtime checks."
ru = "Включает полную отладочную информацию и проверки во время выполнения."
es = "Incluye informacion de depuracion completa y comprobaciones en tiempo de ejecucion."

[settings.option.debug.level.3.label]
id = "Debug Maksimal (-d3)"
en = "Maximum Debug (-d3)"
ru = "Максимальная отладка (-d3)"
es = "Depuracion maxima (-d3)"

[settings.option.debug.level.3.desc]
id = "Debug paling terperinci; optimisasi otomatis dinonaktifkan."
en = "Most detailed debugging; optimization is disabled automatically."
ru = "Наиболее подробная отладка; оптимизация отключается автоматически."
es = "Depuracion mas detallada; la optimizacion se desactiva automaticamente."

[settings.option.optimization]
id = "Tingkat Optimasi"
en = "Optimization Level"
ru = "Уровень оптимизации"
es = "Nivel de optimizacion"

[settings.option.optimization.desc]
id = "Menentukan seberapa agresif compiler menyederhanakan bytecode. Optimasi lebih tinggi menghasilkan AMX yang lebih kecil dan lebih cepat, tetapi menyulitkan penelusuran debug."
en = "Determines how aggressively the compiler simplifies the bytecode. Higher levels yield a smaller and faster AMX, but make debugging traces harder to follow."
ru = "Определяет, насколько агрессивно компилятор упрощает байткод. Более высокие уровни дают меньший и быстрый AMX, но затрудняют разбор отладочных трасс."
es = "Define que tan agresivamente el compilador simplifica el bytecode. Los niveles mas altos producen un AMX mas chico y mas rapido, pero hacen mas dificil seguir una traza de depuracion."

[settings.option.optimization.level.0.label]
id = "Nonaktif (-O0)"
en = "Disabled (-O0)"
ru = "Отключено (-O0)"
es = "Desactivado (-O0)"

[settings.option.optimization.level.0.desc]
id = "Tidak melakukan optimisasi; paling aman tetapi ukuran hasil terbesar."
en = "No optimization; safest, but produces the largest output."
ru = "Без оптимизации; самый безопасный вариант, но даёт самый большой выход."
es = "Sin optimizacion; la opcion mas segura, pero genera la salida mas grande."

[settings.option.optimization.level.1.label]
id = "Seimbang (-O1)"
en = "Balanced (-O1)"
ru = "Сбалансированный (-O1)"
es = "Equilibrado (-O1)"

[settings.option.optimization.level.1.desc]
id = "Optimisasi standar yang menjaga stabilitas."
en = "Default optimization pass for stable builds."
ru = "Стандартный проход оптимизации для стабильных сборок."
es = "Pasada de optimizacion estandar para compilaciones estables."

[settings.option.optimization.level.2.label]
id = "Agresif (-O2)"
en = "Aggressive (-O2)"
ru = "Агрессивный (-O2)"
es = "Agresivo (-O2)"

[settings.option.optimization.level.2.desc]
id = "Optimisasi maksimum untuk kecepatan dan ukuran."
en = "Maximum optimization for speed and size."
ru = "Максимальная оптимизация скорости и размера."
es = "Optimizacion maxima para velocidad y tamano."

[settings.option.optimization.v3107.notice]
id = "Optimisasi agresif (-O2) hanya tersedia dengan Pawn 3.10.11."
en = "Aggressive optimization (-O2) is available with Pawn 3.10.11."
ru = "Агрессивная оптимизация (-O2) доступна только с Pawn 3.10.11."
es = "La optimizacion agresiva (-O2) esta disponible con Pawn 3.10.11."

[settings.option.ignorecase]
id = "Abaikan Huruf Besar/Kecil"
en = "Filesystem"
ru = "Файловая система"
es = "Sistema de archivos"

[settings.option.ignorecase.desc]
id = "Membuat salinan cadangan folder (\"nama-folder.backup\"), lalu mengubah semua nama file selain file yang dipilih dan seluruh referensi #include menjadi huruf kecil. Dijalankan sekali per folder, karena melewati Android yang peka huruf besar/kecil."
en = "Backs the folder up as \"folder.backup\", then lowercases every file name except the one you selected and rewrites every #include reference to lowercase. It runs once per folder because Android storage is case sensitive."
ru = "Создаёт резервную копию папки (\"folder.backup\"), затем переводит имена всех файлов в нижний регистр, кроме выбранного, и переписывает в нижний регистр все ссылки #include. Выполняется один раз для папки, потому что хранилище Android различает регистр символов."
es = "Crea una copia de seguridad de la carpeta (\"carpeta.backup\"), luego pasa a minusculas todos los nombres de archivo salvo el que seleccionaste y reescribe en minusculas cada referencia #include. Se ejecuta una vez por carpeta porque el almacenamiento de Android distingue mayusculas de minusculas."

[settings.option.explain]
id = "Jelaskan Output"
en = "Explain Output"
ru = "Объяснять вывод"
es = "Explicar la salida"

[settings.option.explain.desc]
id = "Tambahkan penjelasan yang mudah dipahami di samping peringatan, pesan error, dan pesan fatal."
en = "Add human-readable explanations next to warnings, errors, and fatal messages extracted from the compiler log."
ru = "Добавляет понятные пояснения рядом с предупреждениями, ошибками и фатальными сообщениями, извлечёнными из журнала компилятора."
es = "Agrega explicaciones legibles junto a las advertencias, errores y mensajes fatales extraidos del log del compilador."

[settings.option.customflags]
id = "Flag Kustom"
en = "Custom Flags"
ru = "Свои флаги"
es = "Flags personalizados"

[settings.option.customflags.desc]
id = "Parameter compiler tambahan, dipisahkan spasi"
en = "Extra compiler parameters, space separated"
ru = "Дополнительные параметры компилятора, разделённые пробелами"
es = "Parametros adicionales del compilador, separados por espacios"

[settings.include.paths]
id = "Path Include"
en = "Include Paths"
ru = "Пути include"
es = "Rutas de include"

[settings.include.paths.desc]
id = "Daftar folder yang ditelusuri compiler saat menyelesaikan #include. Path yang tidak ada lagi akan dibuang otomatis saat aplikasi dibuka."
en = "Folders the compiler searches when resolving #include. Paths that no longer exist are pruned automatically on app start."
ru = "Папки, которые компилятор просматривает при разрешении #include. Несуществующие пути автоматически удаляются при запуске приложения."
es = "Carpetas que el compilador revisa al resolver los #include. Las rutas que ya no existen se eliminan solas al iniciar la app."

[settings.updates]
id = "Pembaruan"
en = "Updates"
ru = "Обновления"
es = "Actualizaciones"

[settings.updates.desc]
id = "Memeriksa rilis baru di GitHub dan mengunduh APK bila tersedia. Pembaruan dipasang lewat dialog sistem Android."
en = "Checks GitHub for a newer release and downloads the APK when one is attached. Updates are installed through the standard Android system dialog."
ru = "Проверяет GitHub на наличие более нового выпуска и скачивает APK, если он прикреплён. Обновления устанавливаются через стандартный системный диалог Android."
es = "Busca una version mas nueva en GitHub y descarga el APK cuando hay uno adjunto. Las actualizaciones se instalan mediante el dialogo estandar de Android."

[settings.about]
id = "Tentang"
en = "About"
ru = "О приложении"
es = "Acerca de"

[settings.about.desc]
id = "Informasi versi aplikasi dan tautan ke repositori sumber."
en = "Application version information and a link to the source repository."
ru = "Сведения о версии приложения и ссылка на репозиторий исходного кода."
es = "Informacion de la version de la app y un enlace al repositorio del codigo fuente."

[settings.about.version]
id = "Versi Aplikasi"
en = "App Version"
ru = "Версия приложения"
es = "Version de la app"

[settings.about.version.desc]
id = "Versi rilis PawnMC yang sedang terpasang di perangkat ini."
en = "The PawnMC release currently installed on this device."
ru = "Выпуск PawnMC, установленный на этом устройстве."
es = "La version de PawnMC instalada actualmente en este dispositivo."

[settings.about.github]
id = "Lihat di GitHub"
en = "View on GitHub"
ru = "Открыть на GitHub"
es = "Ver en GitHub"

[settings.about.github.desc]
id = "Buka repositori sumber resmi untuk melihat riwayat rilis, melaporkan masalah, atau menyalin dan membangun sendiri."
en = "Opens the official source repository for release history, issue reports, and self-hosting instructions."
ru = "Открывает официальный репозиторий исходного кода с историей выпусков, отчётами об ошибках и инструкциями по самостоятельной сборке."
es = "Abre el repositorio oficial del codigo fuente para ver el historial de versiones, reportar problemas o compilarlo por tu cuenta."

[settings.about.restart]
id = "Mulai Ulang Aplikasi"
en = "Restart Application"
ru = "Перезапустить приложение"
es = "Reiniciar la aplicacion"

[settings.about.restart.desc]
id = "Menutup lalu membuka kembali PawnMC agar seluruh pengaturan diterapkan dari awal. Proses kompilasi yang sedang berjalan akan dibatalkan."
en = "Closes and reopens PawnMC so every setting is applied from scratch. A compilation that is currently running is cancelled."
ru = "Закрывает и снова открывает PawnMC, чтобы все настройки применились с самого начала. Идущая компиляция отменяется."
es = "Cierra y vuelve a abrir PawnMC para que todos los ajustes se apliquen desde cero. Se cancela la compilacion que este en ejecucion."

[settings.restart.confirm.title]
id = "Mulai Ulang Aplikasi"
en = "Restart Application"
ru = "Перезапустить приложение"
es = "Reiniciar la aplicacion"

[settings.restart.confirm.text]
id = "PawnMC akan segera ditutup lalu dibuka kembali. Simpan dulu berkas yang sedang dibuka di PawnMC Editor, karena proses kompilasi yang sedang berjalan akan dibatalkan. Apakah Anda ingin memulai ulang sekarang?"
en = "PawnMC will close and reopen immediately. Save any open file in the PawnMC Editor first, because a compilation that is currently running is cancelled. Would you like to restart now?"
ru = "PawnMC закроется и сразу откроется снова. Сначала сохраните открытые файлы в PawnMC Editor, поскольку идущая компиляция будет отменена. Перезапустить сейчас?"
es = "PawnMC se va a cerrar y abrir de inmediato. Guarda primero cualquier archivo abierto en el PawnMC Editor, porque se cancela la compilacion que este en ejecucion. Queres reiniciar ahora?"

[settings.restart.confirm.button]
id = "Mulai Ulang Sekarang"
en = "Restart Now"
ru = "Перезапустить сейчас"
es = "Reiniciar ahora"

[settings.editor]
id = "PawnMC Editor"
en = "PawnMC Editor"
