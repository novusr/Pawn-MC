[settings.theme.desc]
id = "Mengatur apakah aplikasi mengikuti tema sistem, selalu terang, atau selalu gelap. Pilihan ini juga menentukan latar editor PawnMC."
en = "Controls whether the app follows the system theme, or is pinned to light or dark. This choice also drives the editor background."
ru = "Определяет, следует ли приложение системной теме или всегда использует светлую либо тёмную. Этот выбор также задаёт фон редактора PawnMC."
