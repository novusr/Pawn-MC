ru = "Стабильный выпуск"
es = "Version estable"

[settings.compiler.version.31011.label]
id = "Pawn 3.10.11"
en = "Pawn 3.10.11"
tl = "Pawn 3.10.11"
ru = "Pawn 3.10.11"
es = "Pawn 3.10.11"

[settings.compiler.version.31011.desc]
id = "Rilis yang lebih baru"
en = "Newer release"
tl = "Mas bagong release"
ru = "Более новый выпуск"
es = "Version mas reciente"

[settings.compiler.forced.desc]
id = "Saat dipaksa, versi yang dipilih di atas selalu dipakai. Saat otomatis, compiler di dekat berkas yang sedang diedit lebih diprioritaskan bila versinya cocok."
en = "When forced, the version picked above is always used. When automatic, a compiler sitting next to the file you are editing is preferred whenever its version matches."
tl = "Kapag forced, laging ginagamit ang bersyong napili sa itaas. Kapag automatic, mas pinipili ang compiler na katabi ng file na ine-edit mo kung tugma ang bersyon nito."
ru = "При принудительном режиме всегда используется версия, выбранная выше. В автоматическом режиме предпочтение отдаётся компилятору рядом с редактируемым файлом, если его версия подходит."
es = "Cuando es forzado, siempre se usa la version elegida arriba. Cuando es automatico, se prefiere el compilador que esta junto al archivo que estas editando siempre que su version coincida."

