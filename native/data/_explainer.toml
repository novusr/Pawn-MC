# PawnMC compiler message explanations - 2026 format
#
# Naming: _explainer.toml
# One table per Pawn compiler message code, taken straight from the warning,
# error or fatal number in the compiler output.
#
#   [explain."013"]
#   en = "..."
#
# Language leaves are id, en, es, ru, tl; every explanation has all five.
#
# Coverage: every row of errmsg[], fatalmsg[] and warnmsg[] in the Pawn
# compiler (source/compiler/sc5.c). Codes 001-093 are errors, 100-111 are
# fatal errors that abort the build, 200-239 are warnings. Each explanation
# restates the compiler message and then names the cause read off the
# error(N) call site that raises it, so the text matches what the compiler
# actually checks. Explanations written for PawnMC mention its own options
# (-w217, include paths) where they change the behaviour of a message.

[explain."001"]
es = "Error 001: expected token: \"%s\", but found \"%s\". El parser esperaba un token concreto, como un corchete de cierre o un operador."
ru = "Error 001: expected token: \"%s\", but found \"%s\". Zdes parser ozhidal opredelyonnyj token, naprimer zakryvayushchuyu skobku ili operator."
tl = "Error 001: expected token: \"%s\", but found \"%s\". Dito, may partikular na token na inaasahan ang parser, gaya ng pangsarang bracket o operator."
en = "Error 001: expected token: \"%s\", but found \"%s\". The parser expected a specific token here, such as a closing bracket or an operator."
id = "Error 001: expected token: \"%s\", but found \"%s\". Parser mengharapkan token tertentu di sini, misalnya penutup kurung atau operator."

[explain."002"]
es = "Error 002: only a single statement (or expression) can follow each \"case\". Después de una etiqueta case solo puede haber una instrucción; encerrá en { } el bloque si necesitás varias."
ru = "Error 002: only a single statement (or expression) can follow each \"case\". Posle metki case dopustim lish odin operator; zaklyuchite neskolko operatorov v blok { }."
tl = "Error 002: only a single statement (or expression) can follow each \"case\". Iisang statement lang ang puwede pagkatapos ng case label, kaya ilagay sa { } ang block na may maraming statement."
en = "Error 002: only a single statement (or expression) can follow each \"case\". Only one statement may follow a case label, so wrap a multi-statement block in { }."
id = "Error 002: only a single statement (or expression) can follow each \"case\". Setelah label case hanya boleh ada satu pernyataan, jadi bungkus blok berisi banyak pernyataan dengan kurung kurawal."

[explain."003"]
es = "Error 003: declaration of a local variable must appear in a compound block. Las variables locales solo se pueden declarar dentro de un bloque compuesto."
ru = "Error 003: declaration of a local variable must appear in a compound block. Lokalnye peremennye mozhno obyavlyat tolko vnutri sostavnogo bloka."
tl = "Error 003: declaration of a local variable must appear in a compound block. Sa loob lang ng compound block puwedeng magdeklara ng mga local variable."
en = "Error 003: declaration of a local variable must appear in a compound block. Local variables may only be declared inside a compound block."
id = "Error 003: declaration of a local variable must appear in a compound block. Variabel lokal hanya boleh dideklarasikan di dalam blok bersarang."

[explain."004"]
es = "Error 004: function \"%s\" is not implemented. La función está declarada o adelantada, pero no tiene un cuerpo que la implemente."
ru = "Error 004: function \"%s\" is not implemented. Funktsiya obyavlena ili predvaritelno opisana, no eyo telo ne opredeleno."
tl = "Error 004: function \"%s\" is not implemented. Idineklara o ini-forward ang function, pero walang body na nagpapatupad dito."
en = "Error 004: function \"%s\" is not implemented. The function is declared or forwarded but no body implements it."
id = "Error 004: function \"%s\" is not implemented. Fungsi dideklarasikan atau di-forward tetapi gak ada badan yang mengimplementasikannya."

[explain."005"]
es = "Error 005: function may not have arguments. Una función que devuelve un array no puede llevar un tag; tampoco pueden declarar parámetros main()/entry()."
ru = "Error 005: function may not have arguments. Funktsiya, vozvrashchayushchaya massiv, ne mozhet imet teg; main()/entry() takzhe ne mogut obyavlyat parametry."
tl = "Error 005: function may not have arguments. Hindi puwedeng may tag ang function na nagbabalik ng array, at hindi rin puwedeng magdeklara ng parameter ang main()/entry()."
en = "Error 005: function may not have arguments. A function returning an array may not have a tag, or main()/entry() declare parameters."
id = "Error 005: function may not have arguments. Fungsi yang mengembalikan array gak boleh bertag, atau main()/entry() mendeklarasikan parameter."

[explain."006"]
es = "Error 006: must be assigned to an array. El valor tiene que guardarse en un array, pero el destino no lo es."
ru = "Error 006: must be assigned to an array. Znachenie nuzhno sokhranit v massiv, no tselevoj obekt im ne yavlyaetsya."
tl = "Error 006: must be assigned to an array. Kailangang i-store ang value sa array, pero hindi array ang target."
en = "Error 006: must be assigned to an array. The value has to be stored into an array, but the target is not one."
id = "Error 006: must be assigned to an array. Nilai harus disimpan ke array, padahal targetnya bukan array."

[explain."007"]
es = "Error 007: operator cannot be redefined. No se puede redefinir el nombre de un operador predefinido; solo se pueden declarar operadores nuevos."
ru = "Error 007: operator cannot be redefined. Imya predopredelyonnogo operatora pereopredelyat nelzya; obyavlyat mozhno tolko novye operatory."
tl = "Error 007: operator cannot be redefined. Hindi puwedeng i-redefine ang pangalan ng predefined operator; mga bagong operator lang ang puwedeng ideklara."
en = "Error 007: operator cannot be redefined. A predefined operator name cannot be redefined; only new operators may be declared."
id = "Error 007: operator cannot be redefined. Nama operator bawaan gak boleh didefinisikan ulang; hanya operator baru yang boleh dideklarasikan."

[explain."008"]
es = "Error 008: must be a constant expression; assumed zero. Acá hace falta una expresión constante."
ru = "Error 008: must be a constant expression; assumed zero. Zdes neobkhodimo konstantnoe vyrazhenie."
tl = "Error 008: must be a constant expression; assumed zero. Dito kailangan ng constant expression."
en = "Error 008: must be a constant expression; assumed zero. A constant expression is required here."
id = "Error 008: must be a constant expression; assumed zero. Di sini diperlukan ekspresi konstanta."

[explain."009"]
es = "Error 009: invalid array size (negative, zero or out of bounds). El tamaño del array da cero o un valor negativo."
ru = "Error 009: invalid array size (negative, zero or out of bounds). Razmer massiva raven nulyu ili otritsatelnomu znacheniyu."
tl = "Error 009: invalid array size (negative, zero or out of bounds). Zero o negative ang kinalabasang laki ng array."
en = "Error 009: invalid array size (negative, zero or out of bounds). The array size evaluates to zero or is negative."
id = "Error 009: invalid array size (negative, zero or out of bounds). Ukuran array bernilai nol atau negatif."

[explain."010"]
es = "Error 010: invalid function or declaration. El token en el ámbito del archivo no es una declaración ni el encabezado de una función."
ru = "Error 010: invalid function or declaration. Token na urovne fajla ne yavlyaetsya ni obyavleniem, ni zagolovkom funktsii."
tl = "Error 010: invalid function or declaration. Hindi deklarasyon o function header ang token sa file scope."
en = "Error 010: invalid function or declaration. The token at file scope is neither a declaration nor a function header."
id = "Error 010: invalid function or declaration. Token di tingkat berkas bukan deklarasi maupun header fungsi."

[explain."011"]
es = "Error 011: stack offset/data address must be a multiple of cell size. La dirección del assembler inline o el desplazamiento de pila no está alineado al tamaño de cell."
ru = "Error 011: stack offset/data address must be a multiple of cell size. Adres inline-assembler ili smeshchenie steka ne vyrovneny po razmeru cell."
tl = "Error 011: stack offset/data address must be a multiple of cell size. Hindi naka-align sa laki ng cell ang address ng inline assembler o ang stack offset."
en = "Error 011: stack offset/data address must be a multiple of cell size. An inline-assembly address or stack offset is not aligned to the cell size."
id = "Error 011: stack offset/data address must be a multiple of cell size. Alamat atau offset assembler inline gak selaras dengan ukuran cell."

[explain."012"]
es = "Error 012: invalid function call, not a valid address. La definición de un operador o una declaración forward está mal formada."
ru = "Error 012: invalid function call, not a valid address. Nekorrektno oformleno opredelenie operatora ili predvaritelnoe obyavlenie."
tl = "Error 012: invalid function call, not a valid address. Mali ang pagkakabuo ng operator definition o forward declaration."
en = "Error 012: invalid function call, not a valid address. An operator definition or a forward declaration is malformed."
id = "Error 012: invalid function call, not a valid address. Definisi operator atau forward declaration-nya gak valid."

[explain."013"]
en = "Error 013: no entry point (no public functions). The script has no main() and no public function for the runtime to start from."
id = "Error 013: no entry point (no public functions). Skrip gak punya main() maupun fungsi public sebagai titik mulai runtime."
tl = "Error 013: no entry point (no public functions). Walang nahanap na entry point. Tingnan kung tama ang na-compile na source file at kung may kinakailangang entry function ito. Para sa mabilisang standalone test, magdag ng 'main() {}'; ang gamemode ay maaaring may partikular na public callback."
es = "Error 013: no entry point (no public functions). No se encontro el punto de entrada. Verifica que hayas compilado el archivo fuente correcto y que contenga la funcion de entrada requerida. Para una prueba rapida independiente, agrega 'main() {}'; los modos de juego pueden requerir un callback publico especifico."
ru = "Error 013: no entry point (no public functions). Tochka vkhoda ne najdena. Proverte, chto skompilirovan nuzhnyj iskhodnyj fajl i chto v nyom est trebuemaya funktsiya vkhoda. Dlya bystroj avtonomnoj proverki dobavte 'main() {}'; igrovye rezhimy mogut trebovat opredelyonnyj public-callback."

[explain."014"]
es = "Error 014: invalid statement; not in switch. Aparece \"else\" o \"case\" cuando el parser no está dentro de un switch."
ru = "Error 014: invalid statement; not in switch. \"else\" ili \"case\" vstrechaetsya, kogda parser nakhoditsya ne vnutri switch."
tl = "Error 014: invalid statement; not in switch. Lumitaw ang \"else\" o \"case\" habang wala sa loob ng switch ang parser."
en = "Error 014: invalid statement; not in switch. \"else\" or \"case\" appears where the parser is not inside a switch."
id = "Error 014: invalid statement; not in switch. \"else\" atau \"case\" muncul ketika parser gak sedang berada di dalam switch."

[explain."015"]
en = "Error 015: \"default\" case must be the last case in switch statement. The \"default\" label is followed by another case; default has to close the switch."
id = "Error 015: \"default\" case must be the last case in switch statement. Label \"default\" diikuti case lain; default harus menutup switch."
tl = "Error 015: \"default\" case must be the last case in switch statement. Dapat huli ang default case. Ilagay ang default pagkatapos ng lahat ng explicit na case block."
es = "Error 015: \"default\" case must be the last case in switch statement. El case default debe ser el ultimo. Coloca default despues de todos los bloques case explicitos."
ru = "Error 015: \"default\" case must be the last case in switch statement. Vetka default dolzhna byt poslednej. Razmestite default posle vsekh yavnykh blokov case."

[explain."016"]
en = "Error 016: multiple defaults in \"switch\". A second \"default\" appears in the same switch statement."
id = "Error 016: multiple defaults in \"switch\". Label \"default\" kedua muncul pada pernyataan switch yang sama."
tl = "Error 016: multiple defaults in \"switch\". Hindi pinapayagan ang maraming default sa isang switch statement."
es = "Error 016: multiple defaults in \"switch\". No se permiten varios default en la misma sentencia switch."
ru = "Error 016: multiple defaults in \"switch\". V odnom operatore switch zapreshcheno neskolko vetok default."

[explain."017"]
en = "Error 017: undefined symbol \"%s\". The identifier is not declared in this file or in any included file."
id = "Error 017: undefined symbol \"%s\". Identifier gak dideklarasikan di berkas ini maupun di include yang dimuat."
tl = "Error 017: undefined symbol \"%s\". Hindi defined ang symbol na \"%s\". Tiyaking declared o naka-include ang identifier at eksaktong tugma ang baybay nito sa definition."
es = "Error 017: undefined symbol \"%s\". Símbolo no definido: \"%s\". Verificá que el identificador esté declarado o incluido, y que esté escrito exactamente igual que en su definición."
ru = "Error 017: undefined symbol \"%s\". Simvol \"%s\" ne opredelyon. Proverte, chto identifikator obyavlen ili podklyuchyon i napisan tochno tak zhe, kak v opredelenii."

[explain."018"]
es = "Error 018: initialization data exceeds declared size. La lista de inicialización entre llaves contiene más elementos de los que entran en el array."
ru = "Error 018: initialization data exceeds declared size. V spiske initsializatsii v figurnykh skobkakh bolshe elementov, chem vmeshchaet massiv."
tl = "Error 018: initialization data exceeds declared size. Mas maraming element ang nasa brace initializer kaysa sa kayang lamanin ng array."
en = "Error 018: initialization data exceeds declared size. The brace initialiser lists more elements than the array holds."
id = "Error 018: initialization data exceeds declared size. Daftar inisialisasi memuat elemen lebih banyak daripada kapasitas array."

[explain."019"]
es = "Error 019: not a label: \"%s\". El nombre después de \"goto\" o la etiqueta usada acá nunca se declaró."
ru = "Error 019: not a label: \"%s\". Imya posle \"goto\" ili ispolzuemaya zdes metka nigde ne obyavleny."
tl = "Error 019: not a label: \"%s\". Hindi naideklara ang pangalan pagkatapos ng \"goto\" o ang label na ginagamit dito."
en = "Error 019: not a label: \"%s\". The name after \"goto\", or the label used here, is never declared."
id = "Error 019: not a label: \"%s\". Nama setelah \"goto\", atau label yang dipakai di sini, gak pernah dideklarasikan."

[explain."020"]
es = "Error 020: invalid symbol name \"%s\". El identificador empieza con un número o contiene un carácter que Pawn no permite."
ru = "Error 020: invalid symbol name \"%s\". Identifikator nachinaetsya s tsifry ili soderzhit zapreshchyonnyj v Pawn simvol."
tl = "Error 020: invalid symbol name \"%s\". Nagsisimula sa digit ang identifier o may karakter itong hindi pinapayagan ng Pawn."
en = "Error 020: invalid symbol name \"%s\". The identifier starts with a digit or contains a character Pawn does not allow."
id = "Error 020: invalid symbol name \"%s\". Identifier diawali angka atau memuat karakter yang gak diizinkan Pawn."

[explain."021"]
en = "Error 021: symbol already defined: \"%s\". The same name is defined twice in one scope, usually a duplicated body or a twice-declared global."
id = "Error 021: symbol already defined: \"%s\". Nama yang sama didefinisikan dua kali dalam satu cakupan, biasanya badan ganda atau global yang dideklarasikan dua kali."
tl = "Error 021: symbol already defined: \"%s\". Nadeklara na ang symbol na \"%s\". May duplicate na declaration sa parehong scope."
es = "Error 021: symbol already defined: \"%s\". El símbolo \"%s\" ya está definido. Hay una declaración duplicada en el mismo ámbito."
ru = "Error 021: symbol already defined: \"%s\". Simvol \"%s\" uzhe opredelyon. V odnoj oblasti vidimosti est povtornoe obyavlenie."

[explain."022"]
es = "Error 022: must be lvalue (non-constant). No se puede escribir en el lado izquierdo de la asignación."
ru = "Error 022: must be lvalue (non-constant). V levuyu chast prisvaivaniya nelzya zapisat znachenie."
tl = "Error 022: must be lvalue (non-constant). Hindi puwedeng sulatan ang kaliwang bahagi ng assignment."
en = "Error 022: must be lvalue (non-constant). The left side of the assignment cannot be written to."
id = "Error 022: must be lvalue (non-constant). Sisi kiri penugasan gak bisa ditulis."

[explain."023"]
es = "Error 023: array assignment must be simple assignment. Para copiar un array entero, usá una asignación común, no un operador compuesto."
ru = "Error 023: array assignment must be simple assignment. Dlya kopirovaniya vsego massiva ispolzujte obychnoe prisvaivanie, a ne sostavnoj operator."
tl = "Error 023: array assignment must be simple assignment. Plain assignment, hindi compound operator, ang gamitin sa pagkopya ng buong array."
en = "Error 023: array assignment must be simple assignment. Copying a whole array only works with plain assignment, not compound operators."
id = "Error 023: array assignment must be simple assignment. Menyalin seluruh array hanya bisa dengan penugasan biasa, bukan operator majemuk."

[explain."024"]
en = "Error 024: \"break\" or \"continue\" is out of context. \"break\" or \"continue\" appears outside a loop or switch."
id = "Error 024: \"break\" or \"continue\" is out of context. \"break\" atau \"continue\" muncul di luar loop atau switch."
tl = "Error 024: \"break\" or \"continue\" is out of context. Nasa labas ng konteksto ang break o continue. Dapat ito nasa loob ng loop o switch block."
es = "Error 024: \"break\" or \"continue\" is out of context. break o continue esta fuera de contexto. Debe estar dentro de un bloque de bucle o de un switch."
ru = "Error 024: \"break\" or \"continue\" is out of context. break ili continue vne konteksta. Ikh neobkhodimo ispolzovat vnutri tsikla ili bloka switch."

[explain."025"]
es = "Error 025: function heading differs from prototype. El encabezado no coincide con la declaración forward anterior."
ru = "Error 025: function heading differs from prototype. Zagolovok ne sootvetstvuet ranee ukazannomu predvaritelnomu obyavleniyu."
tl = "Error 025: function heading differs from prototype. Hindi kapareho ng naunang forward declaration ang function header."
en = "Error 025: function heading differs from prototype. The function header does not match the forward declaration written earlier."
id = "Error 025: function heading differs from prototype. Header fungsi gak cocok dengan forward declaration yang ditulis sebelumnya."

[explain."026"]
es = "Error 026: no matching \"#if...\". ..\". ..\" correspondiente. Un \"#endif\" no tiene su \"#if\" correspondiente o el bloque se cerró con otra directiva."
ru = "Error 026: no matching \"#if...\". ..\". ..\". Dlya \"#endif\" net parnogo \"#if\" ili blok zakryt drugoj direktivoj."
tl = "Error 026: no matching \"#if...\". ..\". ..\". Walang katugmang \"#if\" ang \"#endif\", o maling directive ang nagsara sa block."
en = "Error 026: no matching \"#if...\". An \"#endif\" has no matching \"#if\", or the block is closed by the wrong directive."
id = "Error 026: no matching \"#if...\". ..\". ..\". \"#endif\" gak punya pasangan \"#if\", atau bloknya ditutup direktif yang salah."

[explain."027"]
es = "Error 027: invalid character constant. El literal de carácter está vacío, sin cerrar o contiene más de un carácter."
ru = "Error 027: invalid character constant. Simvolnyj literal pust, ne zakryt ili soderzhit bolshe odnogo simvola."
tl = "Error 027: invalid character constant. Walang laman, hindi naisara, o mahigit sa isang karakter ang character literal."
en = "Error 027: invalid character constant. A character literal is empty, unterminated, or holds more than one character."
id = "Error 027: invalid character constant. Literal karakter kosong, gak ditutup, atau memuat lebih dari satu karakter."

[explain."028"]
es = "Error 028: invalid subscript (not an array or too many subscripts): \"%s\". Se indexó más veces que las dimensiones disponibles, o el valor no es un array."
ru = "Error 028: invalid subscript (not an array or too many subscripts): \"%s\". Indeksov bolshe, chem izmerenij, libo znachenie ne yavlyaetsya massivom."
tl = "Error 028: invalid subscript (not an array or too many subscripts): \"%s\". Mas maraming beses itong ini-index kaysa sa mga dimension nito, o hindi ito array."
en = "Error 028: invalid subscript (not an array or too many subscripts): \"%s\". The value is indexed more times than it has dimensions, or it is not an array."
id = "Error 028: invalid subscript (not an array or too many subscripts): \"%s\". Nilai diindeks lebih banyak daripada jumlah dimensinya, atau bukan array."

[explain."029"]
es = "Error 029: invalid expression, assumed zero. El parser no pudo construir una expresión válida y usó cero para continuar."
ru = "Error 029: invalid expression, assumed zero. Parser ne smog postroit korrektnoe vyrazhenie i podstavil 0, chtoby prodolzhit."
tl = "Error 029: invalid expression, assumed zero. Hindi makabuo ng valid na expression ang parser kaya zero ang ipinalit para magpatuloy."
en = "Error 029: invalid expression, assumed zero. The parser could not build a valid expression and substituted zero to keep going."
id = "Error 029: invalid expression, assumed zero. Parser gagal menyusun ekspresi yang sah lalu memakai nol agar tetap berjalan."

[explain."030"]
es = "Error 030: compound statement not closed at the end of file (started at line %d). Falta cerrar una \"{\" y el archivo termina dentro de ese bloque."
ru = "Error 030: compound statement not closed at the end of file (started at line %d). Dlya \"{\" ne nashlas zakryvayushchaya skobka, poetomu fajl zakanchivaetsya vnutri bloka."
tl = "Error 030: compound statement not closed at the end of file (started at line %d). Walang katapat na pangsara ang \"{\", kaya nagtatapos ang file sa loob ng block na iyon."
en = "Error 030: compound statement not closed at the end of file (started at line %d). A \"{\" was never matched, so the file ends inside that block."
id = "Error 030: compound statement not closed at the end of file (started at line %d). Ada \"{\" yang gak ditutup sehingga berkas berakhir di dalam blok itu."

[explain."031"]
es = "Error 031: unknown directive. El nombre después de \"#\" no corresponde a ninguna directiva que reconozca el preprocesador."
ru = "Error 031: unknown directive. Preprotsessor ne raspoznayot direktivu, ukazannuyu v stroke s \"#\"."
tl = "Error 031: unknown directive. Hindi kinikilala ng preprocessor ang directive na nasa linyang \"#\"."
en = "Error 031: unknown directive. The \"#\" line names a directive the preprocessor does not recognise."
id = "Error 031: unknown directive. Baris \"#\" menyebut direktif yang gak dikenal preprocessor."

[explain."032"]
es = "Error 032: array index out of bounds (variable \"%s\"). Un índice constante queda fuera de los límites del array declarado."
ru = "Error 032: array index out of bounds (variable \"%s\"). Konstantnyj indeks vykhodit za predely obyavlennogo massiva."
tl = "Error 032: array index out of bounds (variable \"%s\"). Lumalampas sa hangganan ng idineklarang array ang constant index."
en = "Error 032: array index out of bounds (variable \"%s\"). A constant index lies outside the bounds of the declared array."
id = "Error 032: array index out of bounds (variable \"%s\"). Indeks konstanta berada di luar batas array yang dideklarasikan."

[explain."033"]
es = "Error 033: array must be indexed (variable \"%s\"). Se usó el nombre del array donde hace falta un valor individual, pero falta el índice."
ru = "Error 033: array must be indexed (variable \"%s\"). Vmesto otdelnogo znacheniya ispolzovano imya massiva bez indeksa."
tl = "Error 033: array must be indexed (variable \"%s\"). Ginamit ang pangalan ng array kung saan single value ang kailangan, kaya nawawala ang index."
en = "Error 033: array must be indexed (variable \"%s\"). An array name is used where a single value is required, so the index is missing."
id = "Error 033: array must be indexed (variable \"%s\"). Nama array dipakai di tempat yang butuh satu nilai sehingga indeksnya hilang."

[explain."034"]
es = "Error 034: argument does not have a default value (argument %d). Se omitió un argumento opcional, pero el valor que ocupa su lugar no es el predeterminado declarado."
ru = "Error 034: argument does not have a default value (argument %d). Neobyazatelnyj argument propushchen, no podstavlennoe vmesto nego znachenie ne sovpadaet s obyavlennym po umolchaniyu."
tl = "Error 034: argument does not have a default value (argument %d). Nilaktawan ang optional argument, pero hindi ang idineklarang default ang ipinalit na value."
en = "Error 034: argument does not have a default value (argument %d). An optional argument was skipped, but the value in its place is not the declared default."
id = "Error 034: argument does not have a default value (argument %d). Argumen opsional dilewati, tetapi nilai di posisinya bukan nilai bawaan."

[explain."035"]
es = "Error 035: argument type mismatch (argument %d). El tipo del argumento no coincide con el tipo declarado para el parámetro."
ru = "Error 035: argument type mismatch (argument %d). Tip argumenta ne sootvetstvuet obyavlennomu tipu parametra."
tl = "Error 035: argument type mismatch (argument %d). Hindi kapareho ng idineklarang uri ng parameter ang uri ng argumento."
en = "Error 035: argument type mismatch (argument %d). The argument type does not match the declared parameter type."
id = "Error 035: argument type mismatch (argument %d). Tipe argumen gak cocok dengan tipe parameter yang dideklarasikan."

[explain."036"]
es = "Error 036: empty statement. Un \";\" aislado forma una instrucción sin efecto donde se esperaba una expresión."
ru = "Error 036: empty statement. Otdelnaya \";\" obrazuet operator bez effekta tam, gde ozhidalos vyrazhenie."
tl = "Error 036: empty statement. Ang nag-iisang \";\" ay statement na walang epekto sa lugar na inaasahan ang expression."
en = "Error 036: empty statement. A lone \";\" forms a statement with no effect where an expression was expected."
id = "Error 036: empty statement. \";\" berdiri sendiri membentuk pernyataan tanpa efek di tempat yang butuh ekspresi."

[explain."037"]
es = "Error 037: invalid string (possibly non-terminated string). El literal de string no se cerró o contiene un escape no válido."
ru = "Error 037: invalid string (possibly non-terminated string). Strokovyj literal ne zakryt ili soderzhit nedopustimuyu escape-posledovatelnost."
tl = "Error 037: invalid string (possibly non-terminated string). Hindi naisara ang string literal o may invalid itong escape."
en = "Error 037: invalid string (possibly non-terminated string). A string literal is not terminated, or contains an invalid escape."
id = "Error 037: invalid string (possibly non-terminated string). String gak ditutup atau memuat escape yang gak valid."

[explain."038"]
es = "Error 038: extra characters on line. Hay caracteres inesperados después de una instrucción que ya estaba completa."
ru = "Error 038: extra characters on line. Posle uzhe zavershyonnogo operatora stoyat neozhidannye simvoly."
tl = "Error 038: extra characters on line. May hindi inaasahang karakter pagkatapos ng kumpletong statement."
en = "Error 038: extra characters on line. Unexpected characters follow a statement that was already complete."
id = "Error 038: extra characters on line. Ada karakter tak terduga setelah pernyataan yang sudah lengkap."

[explain."039"]
es = "Error 039: constant symbol has no size. Se aplicó \"sizeof\" a una constante, que no tiene almacenamiento ni tamaño."
ru = "Error 039: constant symbol has no size. Operator \"sizeof\" primenyon k konstante, u kotoroj net khranilishcha i razmera."
tl = "Error 039: constant symbol has no size. Inilapat ang \"sizeof\" sa constant na walang storage o laki."
en = "Error 039: constant symbol has no size. \"sizeof\" was applied to a constant, which has no storage and no size."
id = "Error 039: constant symbol has no size. \"sizeof\" dikenakan pada konstanta yang gak punya penyimpanan."

[explain."040"]
en = "Error 040: duplicate \"case\" label (value %d). Two case labels in one switch hold the same value."
id = "Error 040: duplicate \"case\" label (value %d). Dua label case dalam satu switch bernilai sama."
tl = "Error 040: duplicate \"case\" label (value %d). Duplicate ang \"case\" label (value %d). Dapat unique ang bawat case value sa loob ng iisang switch."
es = "Error 040: duplicate \"case\" label (value %d). Etiqueta \"case\" duplicada (valor %d). Los valores de las etiquetas case deben ser únicos dentro del mismo switch."
ru = "Error 040: duplicate \"case\" label (value %d). Povtoryayushchayasya metka \"case\" (znachenie %d). Znacheniya case dolzhny byt unikalnymi v predelakh odnogo switch."

[explain."041"]
es = "Error 041: invalid ellipsis, array size is not known. Un argumento variádico necesita un array cuyo tamaño se conozca al compilar."
ru = "Error 041: invalid ellipsis, array size is not known. Dlya variativnogo argumenta nuzhen massiv s razmerom, izvestnym vo vremya kompilyatsii."
tl = "Error 041: invalid ellipsis, array size is not known. Kailangan ng variadic argument ang array na alam ang laki sa oras ng compilation."
en = "Error 041: invalid ellipsis, array size is not known. A variadic argument needs an array whose size is known at compile time."
id = "Error 041: invalid ellipsis, array size is not known. Argumen variadik butuh array yang ukurannya diketahui saat kompilasi."

[explain."042"]
es = "Error 042: invalid combination of class specifiers. Se combinaron especificadores de almacenamiento o ámbito que entran en conflicto en una declaración."
ru = "Error 042: invalid combination of class specifiers. V odnom obyavlenii obedineny konfliktuyushchie spetsifikatory khraneniya ili oblasti vidimosti."
tl = "Error 042: invalid combination of class specifiers. Pinagsama sa isang deklarasyon ang magkasalungat na storage o scope specifier."
en = "Error 042: invalid combination of class specifiers. Conflicting storage or scope specifiers were combined on one declaration."
id = "Error 042: invalid combination of class specifiers. Penentu penyimpanan atau cakupan yang bertentangan digabung dalam satu deklarasi."

[explain."043"]
es = "Error 043: character constant exceeds range for packed string. Un carácter de la string empaquetada no cabe en el rango del cell de destino."
ru = "Error 043: character constant exceeds range for packed string. Simvol v upakovannoj stroke ne pomeshchaetsya v diapazon tselevoj yachejki cell."
tl = "Error 043: character constant exceeds range for packed string. Hindi kasya sa range ng target cell ang karakter sa packed string."
en = "Error 043: character constant exceeds range for packed string. A character in a packed string does not fit the range of the target cell."
id = "Error 043: character constant exceeds range for packed string. Karakter pada packed string gak muat dalam rentang cell tujuan."

[explain."044"]
es = "Error 044: positional parameters must precede all named parameters. Los argumentos con nombre tienen que aparecer después de los posicionales."
ru = "Error 044: positional parameters must precede all named parameters. Imenovannye argumenty dolzhny ukazyvatsya posle pozitsionnykh."
tl = "Error 044: positional parameters must precede all named parameters. Kailangang sumunod ang named argument sa lahat ng positional argument."
en = "Error 044: positional parameters must precede all named parameters. Named arguments have to come after all positional arguments."
id = "Error 044: positional parameters must precede all named parameters. Argumen bernama harus ditulis setelah semua argumen posisional."

[explain."045"]
es = "Error 045: too many function arguments. La llamada pasa más argumentos de los que permite el límite de implementación."
ru = "Error 045: too many function arguments. Vyzov peredayot bolshe argumentov, chem dopuskaet ogranichenie realizatsii."
tl = "Error 045: too many function arguments. Mas maraming argumento ang ipinasa ng tawag kaysa sa pinapayagang limitasyon ng implementation."
en = "Error 045: too many function arguments. The call passes more arguments than the implementation limit allows."
id = "Error 045: too many function arguments. Pemanggilan mengirim argumen lebih banyak daripada batas implementasi."

[explain."046"]
es = "Error 046: unknown array size (variable \"%s\"). No se puede determinar el tamaño del array a partir de la declaración."
ru = "Error 046: unknown array size (variable \"%s\"). Razmer massiva nevozmozhno opredelit po obyavleniyu."
tl = "Error 046: unknown array size (variable \"%s\"). Hindi matukoy ang laki ng array mula sa deklarasyon."
en = "Error 046: unknown array size (variable \"%s\"). The array size cannot be determined from the declaration."
id = "Error 046: unknown array size (variable \"%s\"). Ukuran array gak bisa ditentukan dari deklarasinya."

[explain."047"]
es = "Error 047: array sizes do not match, or destination array is too small. Se copia un array en otro de distinto tamaño o el destino no alcanza."
ru = "Error 047: array sizes do not match, or destination array is too small. Massiv kopiruetsya v massiv drugogo razmera libo tselevoj massiv nedostatochno velik."
tl = "Error 047: array sizes do not match, or destination array is too small. Kinokopya ang array sa ibang laki o kulang ang laki ng destination."
en = "Error 047: array sizes do not match, or destination array is too small. An array is copied onto one with a different size, or the destination is too small."
id = "Error 047: array sizes do not match, or destination array is too small. Array disalin ke array berukuran berbeda, atau tujuannya terlalu kecil."

[explain."048"]
es = "Error 048: array dimensions do not match. Los dos arrays no tienen la misma cantidad de dimensiones."
ru = "Error 048: array dimensions do not match. U dvukh massivov raznoe chislo izmerenij."
tl = "Error 048: array dimensions do not match. Hindi pareho ang bilang ng dimension ng dalawang array."
en = "Error 048: array dimensions do not match. The two arrays do not have the same number of dimensions."
id = "Error 048: array dimensions do not match. Kedua array gak punya jumlah dimensi yang sama."

[explain."049"]
es = "Error 049: invalid line continuation. Después de la barra invertida de continuación aparece algo que no es un salto de línea."
ru = "Error 049: invalid line continuation. Posle obratnoj kosoj cherty prodolzheniya stoit ne simvol novoj stroki."
tl = "Error 049: invalid line continuation. May ibang bagay, hindi newline, pagkatapos ng backslash para sa continuation."
en = "Error 049: invalid line continuation. A backslash line continuation is followed by something other than a newline."
id = "Error 049: invalid line continuation. Tanda sambung baris diikuti sesuatu selain baris baru."

[explain."050"]
es = "Error 050: invalid range. El rango de una etiqueta case está escrito incorrectamente."
ru = "Error 050: invalid range. Diapazon v metke case zapisan nekorrektno."
tl = "Error 050: invalid range. Mali ang pagkakasulat ng range sa case label."
en = "Error 050: invalid range. A range in a case label is written incorrectly; check that both endpoints are valid constants and appear in ascending order."
id = "Error 050: invalid range. Rentang pada label case ditulis keliru."

[explain."051"]
es = "Error 051: invalid subscript, use \"[ ]\" operators on major dimensions. Acá solo se puede indexar la dimensión más externa; usá un único nivel [ ]."
ru = "Error 051: invalid subscript, use \"[ ]\" operators on major dimensions. Zdes mozhno indeksirovat tolko vneshnee izmerenie; ukazhite odin uroven [ ]."
tl = "Error 051: invalid subscript, use \"[ ]\" operators on major dimensions. Ang pinakalabas na dimension lang ang puwedeng i-index dito; gumamit ng iisang [ ] level."
en = "Error 051: invalid subscript, use \"[ ]\" operators on major dimensions. Only the outermost dimension may be indexed here; provide a single [ ] level."
id = "Error 051: invalid subscript, use \"[ ]\" operators on major dimensions. Di sini hanya dimensi terluar yang boleh diindeks; gunakan satu tingkat kurung siku."

[explain."052"]
es = "Error 052: multi-dimensional arrays must be fully initialized. Hay que proporcionar inicializadores para todas las dimensiones."
ru = "Error 052: multi-dimensional arrays must be fully initialized. Trebuyutsya znacheniya initsializatsii dlya kazhdogo izmereniya."
tl = "Error 052: multi-dimensional arrays must be fully initialized. Dapat magbigay ng initializer para sa bawat dimension."
en = "Error 052: multi-dimensional arrays must be fully initialized. A multi-dimensional array must provide initialisers for every dimension."
id = "Error 052: multi-dimensional arrays must be fully initialized. Array multi-dimensi harus menyediakan inisialisasi untuk setiap dimensinya."

[explain."053"]
es = "Error 053: exceeding maximum number of dimensions. La declaración usa más dimensiones de array de las que admite el compilador."
ru = "Error 053: exceeding maximum number of dimensions. V obyavlenii ispolzuetsya bolshe izmerenij massiva, chem podderzhivaet kompilyator."
tl = "Error 053: exceeding maximum number of dimensions. Mas maraming dimension ng array ang deklarasyon kaysa sa sinusuportahan ng compiler."
en = "Error 053: exceeding maximum number of dimensions. The declaration uses more array dimensions than the compiler supports."
id = "Error 053: exceeding maximum number of dimensions. Deklarasi memakai dimensi array lebih banyak daripada yang didukung compiler."

[explain."054"]
es = "Error 054: unmatched closing brace (\"}\"). Una \"}\" cierra un bloque que nunca se abrió; suele ser una llave de más."
ru = "Error 054: unmatched closing brace (\"}\"). Ona zakryvaet blok, kotoryj ne otkryvali; obychno eto lishnyaya skobka."
tl = "Error 054: unmatched closing brace (\"}\"). Isinasara nito ang block na hindi naman binuksan; kadalasan sobra itong brace."
en = "Error 054: unmatched closing brace (\"}\"). A \"}\" closes a block that was never opened, usually an extra brace."
id = "Error 054: unmatched closing brace (\"}\"). \"}\" menutup blok yang gak pernah dibuka, biasanya kurung berlebih."

[explain."055"]
es = "Error 055: start of function body without function header. La llave que abre el cuerpo aparece sin el encabezado de la función."
ru = "Error 055: start of function body without function header. Otkryvayushchaya skobka tela funktsii vstrechaetsya bez eyo zagolovka."
tl = "Error 055: start of function body without function header. Lumitaw ang pambukas na brace ng function body nang walang header nito."
en = "Error 055: start of function body without function header. The opening brace of a function body appears without its header."
id = "Error 055: start of function body without function header. Kurung buka badan fungsi muncul tanpa header fungsinya."

[explain."056"]
es = "Error 056: arrays, local variables and function arguments cannot be public (variable \"%s\"). No se pueden declarar como public."
ru = "Error 056: arrays, local variables and function arguments cannot be public (variable \"%s\"). Ikh nelzya obyavlyat kak public."
tl = "Error 056: arrays, local variables and function arguments cannot be public (variable \"%s\"). Hindi sila puwedeng ideklarang public."
en = "Error 056: arrays, local variables and function arguments cannot be public (variable \"%s\"). Arrays, local variables and function arguments cannot be declared public."
id = "Error 056: arrays, local variables and function arguments cannot be public (variable \"%s\"). Array, variabel lokal, dan argumen fungsi gak boleh dideklarasikan public."

[explain."057"]
es = "Error 057: unfinished expression before compiler directive. Una directiva interrumpió una expresión que seguía abierta."
ru = "Error 057: unfinished expression before compiler directive. Direktiva prervala eshchyo ne zavershyonnoe vyrazhenie."
tl = "Error 057: unfinished expression before compiler directive. Naantala ng directive ang expression na hindi pa naisara."
en = "Error 057: unfinished expression before compiler directive. A compiler directive interrupts an expression that is still open."
id = "Error 057: unfinished expression before compiler directive. Direktif compiler memotong ekspresi yang masih terbuka."

[explain."058"]
es = "Error 058: duplicate argument; same argument is passed twice. El mismo argumento se pasó dos veces en una llamada."
ru = "Error 058: duplicate argument; same argument is passed twice. Odin i tot zhe argument peredan dvazhdy v odnom vyzove."
tl = "Error 058: duplicate argument; same argument is passed twice. Dalawang beses naipasa ang parehong argumento sa iisang tawag."
en = "Error 058: duplicate argument; same argument is passed twice. The same argument is passed twice in one call."
id = "Error 058: duplicate argument; same argument is passed twice. Argumen yang sama dikirim dua kali dalam satu pemanggilan."

[explain."059"]
es = "Error 059: function argument may not have a default value (variable \"%s\"). Los argumentos de un operador o una función public no pueden declarar un valor predeterminado."
ru = "Error 059: function argument may not have a default value (variable \"%s\"). Argumenty operatora ili funktsii public ne mogut obyavlyat znachenie po umolchaniyu."
tl = "Error 059: function argument may not have a default value (variable \"%s\"). Hindi puwedeng magdeklara ng default value ang argumento ng operator o public function."
en = "Error 059: function argument may not have a default value (variable \"%s\"). Arguments of an operator or public function cannot declare a default value."
id = "Error 059: function argument may not have a default value (variable \"%s\"). Argumen operator atau fungsi public gak boleh mendeklarasikan nilai bawaan."

[explain."060"]
es = "Error 060: multiple \"#else\" directives between \"#if ... .. .. #endif\". Aparecieron dos directivas \"#else\" dentro del mismo bloque."
ru = "Error 060: multiple \"#else\" directives between \"#if ... .. .. #endif\" ukazano neskolko direktiv \"#else\". Vnutri odnogo bloka \"#if ... #endif\" vstretilis dve direktivy \"#else\"."
tl = "Error 060: multiple \"#else\" directives between \"#if ... .. .. #endif\". Dalawang \"#else\" directive ang lumitaw sa iisang block."
en = "Error 060: multiple \"#else\" directives between \"#if ... #endif\". Two \"#else\" directives appear inside one \"#if ... #endif\"."
id = "Error 060: multiple \"#else\" directives between \"#if ... .. .. #endif\". Ada dua \"#else\" di dalam satu blok \"#if ... #endif\"."

[explain."061"]
es = "Error 061: \"#elseif\" directive follows an \"#else\" directive. \"#elseif\" aparece después del \"#else\" que ya cierra la cadena; solo puede seguir \"#endif\"."
ru = "Error 061: \"#elseif\" directive follows an \"#else\" directive. Posle \"#else\", zavershayushchego tsepochku, mozhet idti tolko \"#endif\"."
tl = "Error 061: \"#elseif\" directive follows an \"#else\" directive. Pagkatapos ng \"#else\" na nagtatapos sa chain, \"#endif\" na lang ang puwedeng sumunod."
en = "Error 061: \"#elseif\" directive follows an \"#else\" directive. \"#elseif\" appears after the \"#else\" that already ends the chain; only \"#endif\" may follow."
id = "Error 061: \"#elseif\" directive follows an \"#else\" directive. \"#elseif\" muncul setelah \"#else\" yang sudah menutup rantai; setelahnya hanya \"#endif\"."

[explain."062"]
es = "Error 062: number of operands does not fit the operator. La cantidad o la posición de los operandos no es válida para ese operador."
ru = "Error 062: number of operands does not fit the operator. Kolichestvo ili raspolozhenie operandov nedopustimo dlya etogo operatora."
tl = "Error 062: number of operands does not fit the operator. Hindi akma sa operator ang dami o puwesto ng mga operand."
en = "Error 062: number of operands does not fit the operator. The number or placement of the operands does not fit the operator."
id = "Error 062: number of operands does not fit the operator. Jumlah atau penempatan operand gak cocok dengan operator."

[explain."063"]
es = "Error 063: function result tag of operator \"%s\" must be \"%s\". El tag del resultado del operador no coincide con el tag declarado."
ru = "Error 063: function result tag of operator \"%s\" must be \"%s\". Teg rezultata operatora ne sovpadaet s obyavlennym."
tl = "Error 063: function result tag of operator \"%s\" must be \"%s\". Hindi tugma ang result tag ng operator sa idineklarang tag."
en = "Error 063: function result tag of operator \"%s\" must be \"%s\". The tag of the operator result differs from the declared result tag."
id = "Error 063: function result tag of operator \"%s\" must be \"%s\". Tag hasil operator berbeda dengan tag hasil yang dideklarasikan."

[explain."064"]
es = "Error 064: cannot change predefined operators. El script no puede redefinir un operador predefinido."
ru = "Error 064: cannot change predefined operators. Skript ne mozhet pereopredelit predopredelyonnyj operator."
tl = "Error 064: cannot change predefined operators. Hindi puwedeng i-redefine ng script ang predefined operator."
en = "Error 064: cannot change predefined operators. A predefined operator cannot be redefined by the script."
id = "Error 064: cannot change predefined operators. Operator bawaan gak boleh didefinisikan ulang oleh skrip."

[explain."065"]
es = "Error 065: function argument may only have a single tag (argument %d). Un argumento de función puede llevar un solo tag."
ru = "Error 065: function argument may only have a single tag (argument %d). Argument funktsii mozhet imet tolko odin teg."
tl = "Error 065: function argument may only have a single tag (argument %d). Iisa lang ang puwedeng tag ng function argument."
en = "Error 065: function argument may only have a single tag (argument %d). A function argument may carry only one tag."
id = "Error 065: function argument may only have a single tag (argument %d). Argumen fungsi hanya boleh membawa satu tag."

[explain."066"]
es = "Error 066: function argument may not be a reference argument or an array (argument \"%s\"). En esta posición se requiere un argumento que no sea por referencia."
ru = "Error 066: function argument may not be a reference argument or an array (argument \"%s\"). V etoj pozitsii trebuetsya argument ne po ssylke."
tl = "Error 066: function argument may not be a reference argument or an array (argument \"%s\"). Kailangan dito ng argumentong hindi ipinapasa bilang reference."
en = "Error 066: function argument may not be a reference argument or an array (argument \"%s\"). This position requires a non-reference argument."
id = "Error 066: function argument may not be a reference argument or an array (argument \"%s\"). Posisi ini membutuhkan argumen non-referensi."

[explain."067"]
es = "Error 067: variable cannot be both a reference and an array (variable \"%s\"). La declaración \"&name[]\" no se admite acá."
ru = "Error 067: variable cannot be both a reference and an array (variable \"%s\"). Obyavlenie \"&name[]\" zdes ne podderzhivaetsya."
tl = "Error 067: variable cannot be both a reference and an array (variable \"%s\"). Hindi suportado rito ang deklarasyong \"&name[]\"."
en = "Error 067: variable cannot be both a reference and an array (variable \"%s\"). The declaration \"&name[]\" is not supported here."
id = "Error 067: variable cannot be both a reference and an array (variable \"%s\"). Deklarasi \"&nama[]\" gak didukung di sini."

[explain."068"]
es = "Error 068: invalid rational number precision in #pragma. La precisión indicada para la directiva de números racionales queda fuera del rango admitido."
ru = "Error 068: invalid rational number precision in #pragma. Tochnost, ukazannaya dlya direktivy ratsionalnykh chisel, vne podderzhivaemogo diapazona."
tl = "Error 068: invalid rational number precision in #pragma. Wala sa suportadong range ang precision na itinakda para sa rational-number pragma."
en = "Error 068: invalid rational number precision in #pragma. The precision given to the rational-number pragma is outside the supported range."
id = "Error 068: invalid rational number precision in #pragma. Presisi untuk pragma bilangan rasional di luar rentang yang didukung."

[explain."069"]
es = "Error 069: rational number format already defined. El formato ya se definió en esta unidad de traducción."
ru = "Error 069: rational number format already defined. Etot format uzhe opredelyon v dannoj edinitse translyatsii."
tl = "Error 069: rational number format already defined. Naideklara na ang format na ito sa translation unit na ito."
en = "Error 069: rational number format already defined. The rational-number format was already defined in this translation unit."
id = "Error 069: rational number format already defined. Format bilangan rasional sudah didefinisikan dalam unit kompilasi ini."

[explain."070"]
es = "Error 070: rational number support was not enabled. Por eso se rechaza la directiva."
ru = "Error 070: rational number support was not enabled. Poetomu direktiva otklonena."
tl = "Error 070: rational number support was not enabled. Hindi pinagana ang suporta sa rational number, kaya tinanggihan ang pragma."
en = "Error 070: rational number support was not enabled. Rational-number support is not enabled, so the pragma is rejected."
id = "Error 070: rational number support was not enabled. Dukungan bilangan rasional gak diaktifkan sehingga pragmanya ditolak."

[explain."071"]
es = "Error 071: user-defined operator must be declared before use (function \"%s\"). Se usa el operador antes de declarar su función."
ru = "Error 071: user-defined operator must be declared before use (function \"%s\"). Operator ispolzuetsya do obyavleniya ego funktsii."
tl = "Error 071: user-defined operator must be declared before use (function \"%s\"). Ginamit ang operator bago naideklara ang function nito."
en = "Error 071: user-defined operator must be declared before use (function \"%s\"). The user-defined operator is used before its function was declared."
id = "Error 071: user-defined operator must be declared before use (function \"%s\"). Operator buatan sendiri dipakai sebelum fungsinya dideklarasikan."

[explain."072"]
es = "Error 072: \"sizeof\" operator is invalid on \"function\" symbols. No se puede usar \"sizeof\" con un símbolo de función."
ru = "Error 072: \"sizeof\" operator is invalid on \"function\" symbols. K simvolu funktsii nelzya primenyat \"sizeof\"."
tl = "Error 072: \"sizeof\" operator is invalid on \"function\" symbols. Hindi puwedeng ilapat ang \"sizeof\" sa function symbol."
en = "Error 072: \"sizeof\" operator is invalid on \"function\" symbols. \"sizeof\" cannot be applied to a function symbol."
id = "Error 072: \"sizeof\" operator is invalid on \"function\" symbols. \"sizeof\" gak bisa dikenakan pada simbol fungsi."

[explain."073"]
es = "Error 073: function argument must be an array (argument \"%s\"). El parámetro requiere un array, pero la llamada pasa un escalar."
ru = "Error 073: function argument must be an array (argument \"%s\"). Parametr prinimaet massiv, no vyzov peredayot skalyar."
tl = "Error 073: function argument must be an array (argument \"%s\"). Array ang kailangan ng parameter pero scalar ang ipinasa ng tawag."
en = "Error 073: function argument must be an array (argument \"%s\"). The parameter takes an array, but the call passes a scalar."
id = "Error 073: function argument must be an array (argument \"%s\"). Parameter menerima array, tetapi pemanggilan mengirim skalar."

[explain."074"]
es = "Error 074: #define pattern must start with an alphabetic character. El nombre de \"#define\" tiene que comenzar con un carácter alfabético."
ru = "Error 074: #define pattern must start with an alphabetic character. Imya v \"#define\" dolzhno nachinatsya s alfavitnogo simvola."
tl = "Error 074: #define pattern must start with an alphabetic character. Kailangang magsimula sa alphabetic character ang pangalan sa \"#define\"."
en = "Error 074: #define pattern must start with an alphabetic character. A name in \"#define\" has to begin with a letter."
id = "Error 074: #define pattern must start with an alphabetic character. Nama pada \"#define\" harus diawali huruf."

[explain."075"]
es = "Error 075: input line too long (after substitutions). La expansión de macros superó el límite del búfer del preprocesador."
ru = "Error 075: input line too long (after substitutions). Raskrytie makrosa prevysilo razmer bufera preprotsessora."
tl = "Error 075: input line too long (after substitutions). Lumampas sa laki ng preprocessor buffer ang pagpapalawak ng macro."
en = "Error 075: input line too long (after substitutions). Macro expansion made the line longer than the preprocessor buffer allows."
id = "Error 075: input line too long (after substitutions). Ekspansi makro membuat baris melebihi buffer preprocessor."

[explain."076"]
es = "Error 076: syntax error in the expression, or invalid function call. No se puede analizar la expresión o la llamada no coincide con ninguna función conocida."
ru = "Error 076: syntax error in the expression, or invalid function call. Vyrazhenie ne udalos razobrat libo vyzov ne sootvetstvuet ni odnoj izvestnoj funktsii."
tl = "Error 076: syntax error in the expression, or invalid function call. Hindi ma-parse ang expression o walang kilalang function na tugma sa tawag."
en = "Error 076: syntax error in the expression, or invalid function call. The expression cannot be parsed, or the call matches no known function."
id = "Error 076: syntax error in the expression, or invalid function call. Ekspresi gak bisa diurai, atau pemanggilan gak cocok dengan fungsi mana pun."

[explain."077"]
es = "Error 077: malformed UTF-8 encoding, or corrupted file: %s. El código fuente contiene UTF-8 mal formado o está truncado."
ru = "Error 077: malformed UTF-8 encoding, or corrupted file: %s. Iskhodnyj kod soderzhit nekorrektnyj UTF-8 ili obrezan."
tl = "Error 077: malformed UTF-8 encoding, or corrupted file: %s. Mali ang UTF-8 sa source o naputol ang file."
en = "Error 077: malformed UTF-8 encoding, or corrupted file: %s. The source contains malformed UTF-8 or is truncated."
id = "Error 077: malformed UTF-8 encoding, or corrupted file: %s. Berkas sumber berisi UTF-8 rusak atau terpotong."

[explain."078"]
es = "Error 078: function uses both \"return\" and \"return <value>\". En la misma función se mezclan \"return;\" y \"return value;\", o hay una ruta que llega al final."
ru = "Error 078: function uses both \"return\" and \"return <value>\". V odnoj funktsii smeshany \"return;\" i \"return value;\" libo odin iz putej dokhodit do kontsa."
tl = "Error 078: function uses both \"return\" and \"return <value>\". Pinaghalo ang \"return;\" at \"return value;\" sa isang function, o may path na umaabot sa dulo."
en = "Error 078: function uses both \"return\" and \"return <value>\". One function mixes \"return;\" with \"return value;\" or falls off the end."
id = "Error 078: function uses both \"return\" and \"return <value>\". Satu fungsi mencampur \"return;\" dengan \"return nilai;\" atau berakhir tanpa nilai."

[explain."079"]
es = "Error 079: inconsistent return types (array & non-array). En algunas rutas la función devuelve un array y en otras un valor simple."
ru = "Error 079: inconsistent return types (array & non-array). V odnikh vetkakh funktsiya vozvrashchaet massiv, a v drugikh — obychnoe znachenie."
tl = "Error 079: inconsistent return types (array & non-array). Array ang ibinabalik ng function sa ilang path at ordinaryong value naman sa iba."
en = "Error 079: inconsistent return types (array & non-array). One function returns an array on some paths and a plain value on others."
id = "Error 079: inconsistent return types (array & non-array). Satu fungsi mengembalikan array di sebagian jalur dan nilai biasa di jalur lain."

[explain."080"]
es = "Error 080: unknown symbol, or not a constant symbol (symbol \"%s\"). El símbolo es desconocido o no es constante en un lugar que exige una constante."
ru = "Error 080: unknown symbol, or not a constant symbol (symbol \"%s\"). Simvol ne najden ili ne yavlyaetsya konstantoj v meste, gde ona trebuetsya."
tl = "Error 080: unknown symbol, or not a constant symbol (symbol \"%s\"). Hindi kilala ang symbol o hindi ito constant sa lugar na kailangan iyon."
en = "Error 080: unknown symbol, or not a constant symbol (symbol \"%s\"). The symbol is unknown, or it is not a constant where one is required."
id = "Error 080: unknown symbol, or not a constant symbol (symbol \"%s\"). Simbol gak dikenal, atau bukan konstanta padahal konstanta diperlukan."

[explain."081"]
es = "Error 081: cannot take a tag as a default value for an indexed array parameter (symbol \"%s\"). \"tagof\" no se puede aplicar a un array indexado."
ru = "Error 081: cannot take a tag as a default value for an indexed array parameter (symbol \"%s\"). K indeksirovannomu massivu nelzya primenyat \"tagof\"."
tl = "Error 081: cannot take a tag as a default value for an indexed array parameter (symbol \"%s\"). Hindi puwedeng ilapat ang \"tagof\" sa naka-index na array."
en = "Error 081: cannot take a tag as a default value for an indexed array parameter (symbol \"%s\"). \"tagof\" cannot be applied to an indexed array."
id = "Error 081: cannot take a tag as a default value for an indexed array parameter (symbol \"%s\"). \"tagof\" gak bisa dikenakan pada array yang berindeks."

[explain."082"]
es = "Error 082: user-defined operators and native functions may not have states. Las funciones nativas, los operadores y main() no pueden llevar estados."
ru = "Error 082: user-defined operators and native functions may not have states. Nativnye funktsii, operatory i main() ne mogut imet sostoyaniya."
tl = "Error 082: user-defined operators and native functions may not have states. Hindi puwedeng magdala ng state ang native function, operator, at main()."
en = "Error 082: user-defined operators and native functions may not have states. Native functions, operators and main() cannot carry states."
id = "Error 082: user-defined operators and native functions may not have states. Fungsi native, operator, dan main() gak boleh membawa state."

[explain."083"]
es = "Error 083: a function or variable may only belong to a single automaton (symbol \"%s\"). Esta función ya pertenece a otro; un símbolo solo puede estar en una máquina de estados."
ru = "Error 083: a function or variable may only belong to a single automaton (symbol \"%s\"). Eta funktsiya uzhe prinadlezhit drugomu; odin simvol mozhet byt tolko v odnoj mashine sostoyanij."
tl = "Error 083: a function or variable may only belong to a single automaton (symbol \"%s\"). May iba nang automaton ang function na ito; iisang state machine lang ang puwede sa bawat symbol."
en = "Error 083: a function or variable may only belong to a single automaton (symbol \"%s\"). This function already belongs to another automaton; one symbol may have only one state machine."
id = "Error 083: a function or variable may only belong to a single automaton (symbol \"%s\"). Fungsi ini sudah bagian dari automaton lain; satu simbol hanya boleh punya satu state machine."

[explain."084"]
es = "Error 084: state conflict: one of the states is already assigned to another implementation (symbol \"%s\"). Uno de los estados ya está vinculado a otra implementación de este símbolo."
ru = "Error 084: state conflict: one of the states is already assigned to another implementation (symbol \"%s\"). Odno iz sostoyanij uzhe svyazano s drugoj realizatsiej etogo simvola."
tl = "Error 084: state conflict: one of the states is already assigned to another implementation (symbol \"%s\"). Nakatali na ang isa sa mga state sa ibang implementation ng symbol na ito."
en = "Error 084: state conflict: one of the states is already assigned to another implementation (symbol \"%s\"). One of the states is already bound to a different implementation of this symbol."
id = "Error 084: state conflict: one of the states is already assigned to another implementation (symbol \"%s\"). Salah satu state sudah terikat ke implementasi simbol yang berbeda."

[explain."085"]
es = "Error 085: no states are defined for symbol \"%s\". La función se declaró como función de estado, pero no se indicó ningún estado."
ru = "Error 085: no states are defined for symbol \"%s\". Funktsiya obyavlena kak funktsiya sostoyanij, no spisok sostoyanij otsutstvuet."
tl = "Error 085: no states are defined for symbol \"%s\". Idineklara ang function bilang state function pero walang nakalistang state."
en = "Error 085: no states are defined for symbol \"%s\". The function is declared as a state function, but no states were listed."
id = "Error 085: no states are defined for symbol \"%s\". Fungsi dideklarasikan sebagai fungsi state, tetapi gak ada state yang dicantumkan."

[explain."086"]
es = "Error 086: unknown automaton \"%s\". Nunca se declaró el autómata indicado después de \"state\"."
ru = "Error 086: unknown automaton \"%s\". Avtomat, ukazannyj posle \"state\", nigde ne obyavlen."
tl = "Error 086: unknown automaton \"%s\". Hindi naideklara ang automaton na kasunod ng \"state\"."
en = "Error 086: unknown automaton \"%s\". The automaton named after \"state\" was never declared."
id = "Error 086: unknown automaton \"%s\". Automaton yang disebut setelah \"state\" gak pernah dideklarasikan."

[explain."087"]
es = "Error 087: unknown state \"%s\" for automaton \"%s\". El autómata existe, pero no tiene un estado con ese nombre."
ru = "Error 087: unknown state \"%s\" for automaton \"%s\". Avtomat sushchestvuet, no sostoyanie s takim imenem ne obyavleno."
tl = "Error 087: unknown state \"%s\" for automaton \"%s\". Umiiral ang automaton pero wala itong state na ganoon ang pangalan."
en = "Error 087: unknown state \"%s\" for automaton \"%s\". The automaton exists, but it has no state with that name."
id = "Error 087: unknown state \"%s\" for automaton \"%s\". Automaton itu ada, tetapi gak punya state dengan nama tersebut."

[explain."088"]
es = "Error 088: public variables and local variables may not have states (symbol \"%s\"). No se pueden asignar estados a variables public ni locales."
ru = "Error 088: public variables and local variables may not have states (symbol \"%s\"). Sostoyaniya nelzya naznachat peremennym public i lokalnym."
tl = "Error 088: public variables and local variables may not have states (symbol \"%s\"). Hindi puwedeng lagyan ng state ang mga public at local variable."
en = "Error 088: public variables and local variables may not have states (symbol \"%s\"). Public and local variables cannot be given states."
id = "Error 088: public variables and local variables may not have states (symbol \"%s\"). Variabel public dan lokal gak boleh diberi state."

[explain."089"]
es = "Error 089: state variables may not be initialized (symbol \"%s\"). Una variable dentro de un bloque de estado no puede tener inicializador."
ru = "Error 089: state variables may not be initialized (symbol \"%s\"). U peremennoj vnutri bloka sostoyaniya ne mozhet byt initsializatora."
tl = "Error 089: state variables may not be initialized (symbol \"%s\"). Hindi puwedeng magkaroon ng initializer ang variable sa loob ng state block."
en = "Error 089: state variables may not be initialized (symbol \"%s\"). A variable inside a state block cannot have an initialiser."
id = "Error 089: state variables may not be initialized (symbol \"%s\"). Variabel di dalam blok state gak boleh punya nilai awal."

[explain."090"]
es = "Error 090: public functions may not return arrays (symbol \"%s\"). Una función public no puede devolver un array."
ru = "Error 090: public functions may not return arrays (symbol \"%s\"). Funktsiya public ne mozhet vozvrashchat massiv."
tl = "Error 090: public functions may not return arrays (symbol \"%s\"). Hindi puwedeng magbalik ng array ang public function."
en = "Error 090: public functions may not return arrays (symbol \"%s\"). A public function cannot return an array."
id = "Error 090: public functions may not return arrays (symbol \"%s\"). Fungsi public gak boleh mengembalikan array."

[explain."091"]
es = "Error 091: ambiguous constant; tag override is required (symbol \"%s\"). La constante coincide con más de un tag, así que hay que indicar cuál corresponde."
ru = "Error 091: ambiguous constant; tag override is required (symbol \"%s\"). Konstanta podkhodit neskolkim tegam, poetomu teg nuzhno zadat yavno."
tl = "Error 091: ambiguous constant; tag override is required (symbol \"%s\"). Mahigit sa isang tag ang tugma sa constant, kaya tahasang isulat ang tag."
en = "Error 091: ambiguous constant; tag override is required (symbol \"%s\"). The constant matches more than one tag, so the tag must be written explicitly."
id = "Error 091: ambiguous constant; tag override is required (symbol \"%s\"). Konstanta cocok dengan lebih dari satu tag sehingga tag harus ditulis eksplisit."

[explain."092"]
es = "Error 092: functions may not return arrays of unknown size (symbol \"%s\"). El tamaño del array que devuelve la función debe conocerse al compilar."
ru = "Error 092: functions may not return arrays of unknown size (symbol \"%s\"). Razmer vozvrashchaemogo funktsiej massiva dolzhen byt izvesten vo vremya kompilyatsii."
tl = "Error 092: functions may not return arrays of unknown size (symbol \"%s\"). Dapat alam sa oras ng compilation ang laki ng array na ibinabalik ng function."
en = "Error 092: functions may not return arrays of unknown size (symbol \"%s\"). An array returned by a function needs a size known at compile time."
id = "Error 092: functions may not return arrays of unknown size (symbol \"%s\"). Array hasil fungsi memerlukan ukuran yang diketahui saat kompilasi."

[explain."093"]
es = "Error 093: \"__addressof\" operator is invalid in preprocessor expressions. No se puede usar \"__addressof\" dentro de directivas del preprocesador."
ru = "Error 093: \"__addressof\" operator is invalid in preprocessor expressions. \"__addressof\" nelzya ispolzovat vnutri direktiv preprotsessora."
tl = "Error 093: \"__addressof\" operator is invalid in preprocessor expressions. Hindi puwedeng gamitin ang \"__addressof\" sa loob ng preprocessor directive."
en = "Error 093: \"__addressof\" operator is invalid in preprocessor expressions. \"__addressof\" cannot be used inside preprocessor directives."
id = "Error 093: \"__addressof\" operator is invalid in preprocessor expressions. \"__addressof\" gak bisa dipakai di dalam direktif preprocessor."

[explain."100"]
en = "Fatal error 100: cannot read from file: \"%s\". The source or an include could not be opened; check the path spelling, permissions and that the file exists. Compilation stops here, so fix the messages above first."
id = "Fatal error 100: cannot read from file: \"%s\". Sumber atau include gagal dibuka; periksa ejaan path, izin, dan keberadaan berkas. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."
tl = "Fatal error 100: cannot read from file: \"%s\". Hindi ito mabuksan ng compiler. Tingnan kung tama ang path, may pahintulot, at umiiral ang file."
es = "Fatal error 100: cannot read from file: \"%s\". El compilador no pudo abrir el archivo fuente o include indicado. Revisá la ruta, los permisos y que el archivo exista."
ru = "Fatal error 100: cannot read from file: \"%s\". Kompilyator ne smog otkryt ukazannyj iskhodnyj ili include-fajl. Proverte put, prava dostupa i sushchestvovanie fajla."

[explain."101"]
en = "Fatal error 101: cannot write to file: \"%s\". The output file could not be created or written; check free space and write permission. Compilation stops here, so fix the messages above first."
id = "Fatal error 101: cannot write to file: \"%s\". Berkas keluaran gagal dibuat atau ditulis; periksa ruang disk dan izin tulis. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."
tl = "Fatal error 101: cannot write to file: \"%s\". Hindi ito malikha o masulatan. Tingnan ang pahintulot at destination folder."
es = "Fatal error 101: cannot write to file: \"%s\". No se pudo crear ni escribir el destino de salida. Revisá los permisos y la carpeta de destino."
ru = "Fatal error 101: cannot write to file: \"%s\". Ne poluchilos sozdat ili zapisat tselevoj fajl vyvoda. Proverte prava dostupa i papku naznacheniya."

[explain."102"]
es = "Fatal error 102: table overflow: \"%s\". Una tabla interna alcanzó su capacidad fija, algo que suele requerir un script muy grande. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 102: table overflow: \"%s\". Vnutrennyaya tablitsa dostigla fiksirovannoj yomkosti, chto obychno proiskhodit v ochen bolshom skripte. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 102: table overflow: \"%s\". Naabot ng internal table ang nakapirming kapasidad nito, karaniwan dahil napakalaki ng script. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 102: table overflow: \"%s\". An internal table reached its fixed capacity, which usually takes a very large script. Compilation stops here, so fix the messages above first."
id = "Fatal error 102: table overflow: \"%s\". Tabel internal mencapai kapasitas tetapnya, biasanya pada skrip sangat besar. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."103"]
es = "Fatal error 103: insufficient memory. El compilador no pudo reservar la memoria de trabajo que necesita esta unidad de traducción. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 103: insufficient memory. Kompilyator ne smog vydelit rabochuyu pamyat, neobkhodimuyu etoj edinitse translyatsii. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 103: insufficient memory. Hindi makapaglaan ang compiler ng working memory na kailangan ng translation unit na ito. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 103: insufficient memory. The compiler could not allocate the working memory this translation unit needs. Compilation stops here, so fix the messages above first."
id = "Fatal error 103: insufficient memory. Compiler gagal mengalokasikan memori kerja yang dibutuhkan unit kompilasi ini. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."104"]
es = "Fatal error 104: invalid assembler instruction \"%s\". El generador de código emitió una instrucción que no puede codificar. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 104: invalid assembler instruction \"%s\". Generator koda vydal instruktsiyu, kotoruyu nevozmozhno zakodirovat. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 104: invalid assembler instruction \"%s\". Naglabas ang code generator ng instruction na hindi nito ma-encode. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 104: invalid assembler instruction \"%s\". The code generator emitted an instruction it cannot encode. Compilation stops here, so fix the messages above first."
id = "Fatal error 104: invalid assembler instruction \"%s\". Code generator menghasilkan instruksi yang gak bisa dienkode. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."105"]
es = "Fatal error 105: numeric overflow, exceeding capacity. Esta línea produjo más diagnósticos de los que el compilador informa por línea. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 105: numeric overflow, exceeding capacity. Eta stroka vyzvala bolshe diagnostik, chem kompilyator vyvodit dlya odnoj stroki. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 105: numeric overflow, exceeding capacity. Mas maraming diagnostic ang inilabas ng linyang ito kaysa sa iniuulat ng compiler bawat linya. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 105: numeric overflow, exceeding capacity. This line produced more diagnostics than the compiler reports per line. Compilation stops here, so fix the messages above first."
id = "Fatal error 105: numeric overflow, exceeding capacity. Baris ini menghasilkan diagnostik lebih banyak daripada batas per baris. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."106"]
es = "Fatal error 106: compiled script exceeds the maximum memory size (%ld bytes). No se pudo detectar la codificación del código fuente; guardalo como UTF-8 o ASCII simple. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 106: compiled script exceeds the maximum memory size (%ld bytes). Ne udalos opredelit kodirovku iskhodnogo fajla; sokhranite ego v UTF-8 ili obychnom ASCII. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 106: compiled script exceeds the maximum memory size (%ld bytes). Hindi matukoy ang encoding ng source; i-save ito bilang UTF-8 o plain ASCII. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 106: compiled script exceeds the maximum memory size (%ld bytes). The source encoding could not be detected; save the file as UTF-8 or plain ASCII. Compilation stops here, so fix the messages above first."
id = "Fatal error 106: compiled script exceeds the maximum memory size (%ld bytes). Encoding sumber gak bisa dideteksi; simpan berkas sebagai UTF-8 atau ASCII biasa. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."107"]
es = "Fatal error 107: too many error messages on one line. Una instrucción de assembler inline está mal formada o no tiene su operando. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 107: too many error messages on one line. Instruktsiya inline-assembler nekorrektna ili v nej otsutstvuet operand. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 107: too many error messages on one line. Mali ang pagkakabuo ng inline-assembly instruction o wala itong operand. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 107: too many error messages on one line. An inline-assembly instruction is malformed or is missing its operand. Compilation stops here, so fix the messages above first."
id = "Fatal error 107: too many error messages on one line. Instruksi assembler inline rusak atau operandnya hilang. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."108"]
es = "Fatal error 108: codepage mapping file not found. Se produjeron varios errores fatales a la vez y el estado del compilador es incoherente. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 108: codepage mapping file not found. Odnovremenno vozniklo neskolko kriticheskikh oshibok, poetomu sostoyanie kompilyatora nesoglasovanno. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 108: codepage mapping file not found. Sabay-sabay na naganap ang ilang fatal error kaya hindi tugma ang estado ng compiler. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 108: codepage mapping file not found. Several fatal errors were raised at once, so the compiler state is inconsistent. Compilation stops here, so fix the messages above first."
id = "Fatal error 108: codepage mapping file not found. Beberapa fatal error muncul sekaligus sehingga status compiler gak konsisten. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."109"]
es = "Fatal error 109: invalid path: \"%s\". El runtime no pudo vincular la función durante el inicio. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 109: invalid path: \"%s\". Sreda vypolneniya ne smogla svyazat funktsiyu pri zapuske. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 109: invalid path: \"%s\". Hindi ma-bind ng runtime ang function sa pagsisimula. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 109: invalid path: \"%s\". The runtime could not bind the function during startup. Compilation stops here, so fix the messages above first."
id = "Fatal error 109: invalid path: \"%s\". Runtime gagal menautkan fungsi saat start. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."110"]
es = "Fatal error 110: assertion failed: %s. La instrucción no es válida o se desactivó el generador de código aunque todavía se necesitaba. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 110: assertion failed: %s. Instruktsiya nedopustima libo generator koda otklyuchyon, khotya on vsyo eshchyo nuzhen. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 110: assertion failed: %s. Hindi valid ang instruction o hindi pinagana ang code generator kahit kailangan pa ito. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 110: assertion failed: %s. The instruction is invalid, or the code generator was disabled while still needed. Compilation stops here, so fix the messages above first."
id = "Fatal error 110: assertion failed: %s. Instruksi gak valid, atau code generator dinonaktifkan padahal masih dibutuhkan. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."111"]
es = "Fatal error 111: user error: %s. El compilador accedió a memoria fuera de la imagen del script, generalmente después de un error interno. La compilación se detiene; corregí primero los mensajes anteriores."
ru = "Fatal error 111: user error: %s. Kompilyator obratilsya k pamyati za predelami obraza skripta, obychno posle vnutrennej oshibki. Kompilyatsiya ostanovlena; snachala ispravte soobshcheniya vyshe."
tl = "Fatal error 111: user error: %s. Na-access ng compiler ang memory sa labas ng script image, kadalasan pagkatapos ng internal error. Ihihinto ang compilation; ayusin muna ang mga mensahe sa itaas."
en = "Fatal error 111: user error: %s. The compiler accessed memory outside the script image, usually after an internal error. Compilation stops here, so fix the messages above first."
id = "Fatal error 111: user error: %s. Compiler mengakses memori di luar image skrip, biasanya setelah error internal. Kompilasi berhenti di sini, jadi perbaiki pesan di atasnya lebih dulu."

[explain."200"]
en = "Warning 200: symbol \"%s\" is truncated to %d characters. The identifier is longer than the supported limit, so the tail was dropped; use shorter, unique names."
id = "Warning 200: symbol \"%s\" is truncated to %d characters. Identifier melebihi batas panjang sehingga ekornya dibuang; pakai nama lebih pendek dan unik."
tl = "Warning 200: symbol \"%s\" is truncated to %d characters. Lampas ito sa limit; gumamit ng mas maikli at natatanging pangalan."
es = "Warning 200: symbol \"%s\" is truncated to %d characters. Supera el límite admitido; usá nombres más cortos y únicos para evitar colisiones."
ru = "Warning 200: symbol \"%s\" is truncated to %d characters. Ego dlina prevyshaet dopustimyj predel; ispolzujte bolee korotkie unikalnye imena."

[explain."201"]
es = "Warning 201: redefinition of constant/macro (symbol \"%s\"). Se redefinió una constante o macro con otro valor o cuerpo."
ru = "Warning 201: redefinition of constant/macro (symbol \"%s\"). Konstanta ili makros pereopredeleny s drugim znacheniem ili telom."
tl = "Warning 201: redefinition of constant/macro (symbol \"%s\"). Muling idineklara ang constant o macro na may ibang value o body."
en = "Warning 201: redefinition of constant/macro (symbol \"%s\"). A constant or macro is redefined with a different value or body."
id = "Warning 201: redefinition of constant/macro (symbol \"%s\"). Konstanta atau makro didefinisikan ulang dengan nilai atau isi berbeda."

[explain."202"]
es = "Warning 202: number of arguments does not match definition. La llamada pasa una cantidad de argumentos distinta de la declarada por la función."
ru = "Warning 202: number of arguments does not match definition. Vyzov peredayot ne to kolichestvo argumentov, kotoroe zadano v obyavlenii funktsii."
tl = "Warning 202: number of arguments does not match definition. Iba ang bilang ng argumentong ipinasa sa tawag kaysa sa idineklara ng function."
en = "Warning 202: number of arguments does not match definition. The call passes a different number of arguments than the function declares."
id = "Warning 202: number of arguments does not match definition. Pemanggilan mengirim jumlah argumen berbeda dari deklarasi fungsi."

[explain."203"]
en = "Warning 203: symbol is never used: \"%s\". Nothing in this file reads the symbol, and it is not stock, public or native."
id = "Warning 203: symbol is never used: \"%s\". Engga ada bagian di berkas ini yang membaca simbol, dan simbol bukan stock, public, atau native."
tl = "Warning 203: symbol is never used: \"%s\". Maaaring dead code ito o hindi pa tapos na implementation."
es = "Warning 203: symbol is never used: \"%s\". Puede ser código muerto o una implementación sin terminar."
ru = "Warning 203: symbol is never used: \"%s\". Vozmozhno, eto myortvyj kod ili nezavershyonnaya realizatsiya."

[explain."204"]
en = "Warning 204: symbol is assigned a value that is never used: \"%s\". The assigned value is never read."
id = "Warning 204: symbol is assigned a value that is never used: \"%s\". Nilai yang diberikan gak pernah dibaca."
tl = "Warning 204: symbol is assigned a value that is never used: \"%s\". Kadalasan, redundant na initialization ito o logic bug."
es = "Warning 204: symbol is assigned a value that is never used: \"%s\". Suele indicar una inicialización redundante o un error de lógica."
ru = "Warning 204: symbol is assigned a value that is never used: \"%s\". Chasto eto ukazyvaet na izbytochnuyu initsializatsiyu ili oshibku v logike."

[explain."205"]
en = "Warning 205: redundant code: constant expression is zero. The code after this point can never run."
id = "Warning 205: redundant code: constant expression is zero. Kode setelah titik ini gak pernah dijalankan."
tl = "Warning 205: redundant code: constant expression is zero. Laging false ang kondisyon, kaya hindi naaabot ang block."
es = "Warning 205: redundant code: constant expression is zero. Esta condicion siempre es falsa y vuelve inalcanzable el bloque."
ru = "Warning 205: redundant code: constant expression is zero. Eto uslovie vsegda lozhno, iz-za chego blok nedostizhim."

[explain."206"]
es = "Warning 206: redundant test: constant expression is non-zero. La condición siempre es distinta de cero, así que la prueba sobra."
ru = "Warning 206: redundant test: constant expression is non-zero. Uslovie vsegda nenulevoe, poetomu proverka izbytochna."
tl = "Warning 206: redundant test: constant expression is non-zero. Laging non-zero ang kondisyon kaya hindi na kailangan ang test."
en = "Warning 206: redundant test: constant expression is non-zero. The condition is always non-zero, so the test is redundant."
id = "Warning 206: redundant test: constant expression is non-zero. Kondisi selalu bukan nol sehingga ujinya berlebih."

[explain."207"]
es = "Warning 207: unknown #pragma. El \"#pragma\" indica una opción que el compilador no reconoce."
ru = "Warning 207: unknown #pragma. V \"#pragma\" ukazana optsiya, neizvestnaya kompilyatoru."
tl = "Warning 207: unknown #pragma. Hindi alam ng compiler ang opsyong tinukoy ng \"#pragma\"."
en = "Warning 207: unknown #pragma. The \"#pragma\" names an option the compiler does not know."
id = "Warning 207: unknown #pragma. \"#pragma\" menyebut opsi yang gak dikenal compiler."

[explain."208"]
es = "Warning 208: function with tag result used before definition, forcing reparse. Esta expresión tiene un efecto que se descarta o la instrucción no se puede evaluar."
ru = "Warning 208: function with tag result used before definition, forcing reparse. Effekt etogo vyrazheniya otbrasyvaetsya libo operator nevozmozhno vychislit."
tl = "Warning 208: function with tag result used before definition, forcing reparse. Itinatapon ang epekto ng expression na ito o hindi masusuri ang statement."
en = "Warning 208: function with tag result used before definition, forcing reparse. This expression has an effect that is discarded, or a statement cannot be evaluated."
id = "Warning 208: function with tag result used before definition, forcing reparse. Ekspresi punya efek yang dibuang, atau pernyataannya gak bisa dievaluasi."

[explain."209"]
es = "Warning 209: function \"%s\" should return a value. Está declarada para devolver un valor, pero alguna ruta termina sin devolverlo."
ru = "Warning 209: function \"%s\" should return a value. Ona obyavlena kak vozvrashchayushchaya znachenie, no odin iz putej zavershaetsya bez nego."
tl = "Warning 209: function \"%s\" should return a value. Idineklarang nagbabalik ito ng value, pero may path na nagtatapos nang walang ibinabalik."
en = "Warning 209: function \"%s\" should return a value. The function is declared to return a value but a path leaves without one."
id = "Warning 209: function \"%s\" should return a value. Fungsi dideklarasikan mengembalikan nilai tetapi ada jalur yang keluar tanpa nilai."

[explain."210"]
es = "Warning 210: possible use of symbol before initialization: \"%s\". La asignación no tiene quien la lea o no se puede evaluar un operando."
ru = "Warning 210: possible use of symbol before initialization: \"%s\". Rezultat prisvaivaniya nigde ne chitaetsya libo operand nevozmozhno vychislit."
tl = "Warning 210: possible use of symbol before initialization: \"%s\". Walang bumabasa sa assignment o hindi masusuri ang isang operand."
en = "Warning 210: possible use of symbol before initialization: \"%s\". The assignment has no reader or an operand cannot be evaluated."
id = "Warning 210: possible use of symbol before initialization: \"%s\". Penugasan tanpa pembaca, atau operand gak bisa dievaluasi."

[explain."211"]
en = "Warning 211: possibly unintended assignment. An assignment sits inside a condition where a comparison was probably intended."
id = "Warning 211: possibly unintended assignment. Penugasan berada di dalam kondisi padahal kemungkinan maksudnya perbandingan."
tl = "Warning 211: possibly unintended assignment. May assignment sa kondisyon; gamitin ang == para sa paghahambing."
es = "Warning 211: possibly unintended assignment. Hay una asignacion dentro de una condicion; usa == si lo que querias era comparar."
ru = "Warning 211: possibly unintended assignment. V uslovii ispolzuetsya prisvaivanie; dlya sravneniya ukazhite ==."

[explain."212"]
es = "Warning 212: possibly unintended bitwise operation. El argumento no es válido en esta posición."
ru = "Warning 212: possibly unintended bitwise operation. Argument nedopustim v etoj pozitsii."
tl = "Warning 212: possibly unintended bitwise operation. Hindi valid ang argumento sa posisyong ito."
en = "Warning 212: possibly unintended bitwise operation. The argument is invalid at this position."
id = "Warning 212: possibly unintended bitwise operation. Argumen gak valid pada posisi ini."

[explain."213"]
es = "Warning 213: tag mismatch: expected %s %s but found %s. Se asignó a una variable un valor con otro tag."
ru = "Warning 213: tag mismatch: expected %s %s but found %s. Peremennoj prisvoeno znachenie s drugim tegom."
tl = "Warning 213: tag mismatch: expected %s %s but found %s. Itinalaga sa variable ang value na may ibang tag."
en = "Warning 213: tag mismatch: expected %s %s but found %s. A value with one tag is stored into a variable with another tag."
id = "Warning 213: tag mismatch: expected %s %s but found %s. Nilai bertag tertentu disimpan ke variabel bertag lain."

[explain."214"]
en = "Warning 214: possibly a \"const\" array argument was intended: \"%s\". The literal is copied into a temporary buffer; mark the parameter \"const\" when the function does not write to it."
id = "Warning 214: possibly a \"const\" array argument was intended: \"%s\". Literal disalin ke buffer sementara; tandai parameter \"const\" bila fungsi gak menulis ke sana."
tl = "Warning 214: possibly a \"const\" array argument was intended: \"%s\". Kinokopya ang literal sa temporary buffer; gamitin ang \"const\" kung hindi binabago ng function ang parameter."
es = "Warning 214: possibly a \"const\" array argument was intended: \"%s\". El literal se copia a un buffer temporal; usá \"const\" si la función no modifica el parámetro."
ru = "Warning 214: possibly a \"const\" array argument was intended: \"%s\". Literal kopiruetsya vo vremennyj bufer; ukazhite \"const\", esli funktsiya ne izmenyaet parametr."

[explain."215"]
es = "Warning 215: expression has no effect. Se evalúa la expresión y se descarta su resultado."
ru = "Warning 215: expression has no effect. Vyrazhenie vychislyaetsya, no ego rezultat otbrasyvaetsya."
tl = "Warning 215: expression has no effect. Sinusuri ang expression pero itinatapon ang resulta nito."
en = "Warning 215: expression has no effect. The expression is evaluated and its result discarded."
id = "Warning 215: expression has no effect. Ekspresi dihitung lalu hasilnya dibuang."

[explain."216"]
es = "Warning 216: nested comment. Se abrió un comentario dentro de otro."
ru = "Warning 216: nested comment. Kommentarij otkryt vnutri drugogo kommentariya."
tl = "Warning 216: nested comment. Binuksan ang isang comment sa loob ng isa pang comment."
en = "Warning 216: nested comment. A comment is opened before the previous comment has been closed, so the comment delimiters are nested."
id = "Warning 216: nested comment. Komentar dibuka di dalam komentar lain."

[explain."217"]
en = "Warning 217: loose indentation. The indentation is loose; PawnMC passes -w217 on every compile, so this only appears if you re-enable it."
id = "Warning 217: loose indentation. Indentasi gak rapi; PawnMC selalu memakai -w217 sehingga ini hanya muncul bila diaktifkan kembali."
tl = "Warning 217: loose indentation. Kosmetik lang ang warning na ito pero natatakpan nito ang maling estruktura at mas mahirap basahin ang code."
es = "Warning 217: loose indentation. Esta advertencia es estetica, pero puede esconder errores estructurales y dificulta la lectura del codigo."
ru = "Warning 217: loose indentation. Eto preduprezhdenie kosmeticheskoe, no ono mozhet skryvat strukturnye oshibki i zatrudnyat chtenie koda."

[explain."218"]
es = "Warning 218: old style prototypes used with optional semicolumns. Se usó un prototipo de estilo antiguo junto con punto y coma opcional."
ru = "Warning 218: old style prototypes used with optional semicolumns. Primenyon prototip starogo stilya s neobyazatelnymi tochkami s zapyatoj."
tl = "Warning 218: old style prototypes used with optional semicolumns. Ginamit ang lumang istilong prototype kasama ng optional semicolon."
en = "Warning 218: old style prototypes used with optional semicolumns. An old-style prototype is used with optional semicolons."
id = "Warning 218: old style prototypes used with optional semicolumns. Prototipe gaya lama dipakai bersama titik koma opsional."

[explain."219"]
es = "Warning 219: local variable \"%s\" shadows a variable at a preceding level. La variable oculta otro símbolo de un ámbito contenedor."
ru = "Warning 219: local variable \"%s\" shadows a variable at a preceding level. Ona skryvaet drugoj simvol iz okhvatyvayushchej oblasti."
tl = "Warning 219: local variable \"%s\" shadows a variable at a preceding level. Itinatago nito ang ibang symbol sa nakapalibot na scope."
en = "Warning 219: local variable \"%s\" shadows a variable at a preceding level. The variable hides another symbol from an enclosing scope."
id = "Warning 219: local variable \"%s\" shadows a variable at a preceding level. Variabel menyembunyikan simbol lain dari cakupan luar."

[explain."220"]
es = "Warning 220: expression with tag override must appear between parentheses. No se puede evaluar el operando."
ru = "Warning 220: expression with tag override must appear between parentheses. Operand nevozmozhno vychislit."
tl = "Warning 220: expression with tag override must appear between parentheses. Hindi masusuri ang operand."
en = "Warning 220: expression with tag override must appear between parentheses. The operand cannot be evaluated."
id = "Warning 220: expression with tag override must appear between parentheses. Operand gak bisa dievaluasi."

[explain."221"]
es = "Warning 221: label name \"%s\" shadows tag name. La etiqueta y el tag tienen el mismo nombre."
ru = "Warning 221: label name \"%s\" shadows tag name. Imya metki dubliruet imya tega."
tl = "Warning 221: label name \"%s\" shadows tag name. Doble ang pangalan ng label at tag."
en = "Warning 221: label name \"%s\" shadows tag name. A label name duplicates a tag name."
id = "Warning 221: label name \"%s\" shadows tag name. Nama label menduplikasi nama tag."

[explain."222"]
es = "Warning 222: number of digits exceeds rational number precision. El número contiene más dígitos de los que permite esa precisión."
ru = "Warning 222: number of digits exceeds rational number precision. V chisle bolshe tsifr, chem dopuskaet zadannaya tochnost."
tl = "Warning 222: number of digits exceeds rational number precision. Lumampas sa itinakdang precision ang bilang ng digit."
en = "Warning 222: number of digits exceeds rational number precision. The number of digits exceeds the rational-number precision."
id = "Warning 222: number of digits exceeds rational number precision. Jumlah digit melebihi presisi bilangan rasional."

[explain."223"]
es = "Warning 223: redundant \"sizeof\": argument size is always 1 (symbol \"%s\"). Acá no hace falta usar \"sizeof\"."
ru = "Warning 223: redundant \"sizeof\": argument size is always 1 (symbol \"%s\"). Zdes \"sizeof\" ne nuzhen."
tl = "Warning 223: redundant \"sizeof\": argument size is always 1 (symbol \"%s\"). Hindi kailangan ang \"sizeof\" dito."
en = "Warning 223: redundant \"sizeof\": argument size is always 1 (symbol \"%s\"). \"sizeof\" is redundant here."
id = "Warning 223: redundant \"sizeof\": argument size is always 1 (symbol \"%s\"). \"sizeof\" berlebih di sini."

[explain."224"]
es = "Warning 224: indeterminate array size in \"sizeof\" expression (symbol \"%s\"). Se usó \"sizeof\" con un array cuyo tamaño se desconoce."
ru = "Warning 224: indeterminate array size in \"sizeof\" expression (symbol \"%s\"). \"sizeof\" primenyon k massivu neizvestnogo razmera."
tl = "Warning 224: indeterminate array size in \"sizeof\" expression (symbol \"%s\"). Ginamit ang \"sizeof\" sa array na hindi alam ang laki."
en = "Warning 224: indeterminate array size in \"sizeof\" expression (symbol \"%s\"). \"sizeof\" is used on an array whose size is not known."
id = "Warning 224: indeterminate array size in \"sizeof\" expression (symbol \"%s\"). \"sizeof\" dipakai pada array yang ukurannya gak diketahui."

[explain."225"]
es = "Warning 225: unreachable code. No se puede ejecutar el código que sigue a este punto."
ru = "Warning 225: unreachable code. Kod posle etoj tochki ne mozhet byt vypolnen."
tl = "Warning 225: unreachable code. Hindi tatakbo ang code pagkatapos ng puntong ito."
en = "Warning 225: unreachable code. Control flow cannot reach the statements after this point, often because an earlier return, break, or exit always transfers control away."
id = "Warning 225: unreachable code. Kode setelah titik ini gak terjangkau."

[explain."226"]
es = "Warning 226: a variable is assigned to itself (symbol \"%s\"). La variable recibe su propio valor."
ru = "Warning 226: a variable is assigned to itself (symbol \"%s\"). Znachenie peremennoj prisvaivaetsya ej zhe."
tl = "Warning 226: a variable is assigned to itself (symbol \"%s\"). Sarili nitong value ang itinalaga sa variable."
en = "Warning 226: a variable is assigned to itself (symbol \"%s\"). The variable is assigned to itself."
id = "Warning 226: a variable is assigned to itself (symbol \"%s\"). Variabel ditugasi ke dirinya sendiri."

[explain."227"]
es = "Warning 227: more initiallers than enum fields. La lista de inicialización tiene más elementos que campos en el enum."
ru = "Warning 227: more initiallers than enum fields. V spiske initsializatsii bolshe elementov, chem polej v enum."
tl = "Warning 227: more initiallers than enum fields. Mas maraming item sa listahan ng initialization kaysa sa field ng enum."
en = "Warning 227: more initiallers than enum fields. The initialiser lists more items than the enum has fields."
id = "Warning 227: more initiallers than enum fields. Inisialisasi memuat lebih banyak item daripada field enum."

[explain."228"]
es = "Warning 228: length of initialler exceeds size of the enum field. El inicializador es más largo de lo que admite ese campo."
ru = "Warning 228: length of initialler exceeds size of the enum field. Initsializator dlinnee, chem mozhet vmestit eto pole."
tl = "Warning 228: length of initialler exceeds size of the enum field. Mas mahaba ang initializer kaysa sa kayang lamanin ng field."
en = "Warning 228: length of initialler exceeds size of the enum field. The initialiser is longer than the enum field can hold."
id = "Warning 228: length of initialler exceeds size of the enum field. Inisialisasi lebih panjang daripada kapasitas field enum."

[explain."229"]
es = "Warning 229: index tag mismatch (symbol \"%s\"): expected tag %s but found %s. El índice usa un tag distinto del array."
ru = "Warning 229: index tag mismatch (symbol \"%s\"): expected tag %s but found %s. U indeksa drugoj teg, chem u massiva."
tl = "Warning 229: index tag mismatch (symbol \"%s\"): expected tag %s but found %s. Iba ang tag ng index sa tag ng array."
en = "Warning 229: index tag mismatch (symbol \"%s\"): expected tag %s but found %s. The index uses a different tag than the array."
id = "Warning 229: index tag mismatch (symbol \"%s\"): expected tag %s but found %s. Indeks memakai tag berbeda dari arraynya."

[explain."230"]
es = "Warning 230: no implementation for state \"%s\" in function \"%s\", no fall-back. El estado no tiene implementación ni fallback."
ru = "Warning 230: no implementation for state \"%s\" in function \"%s\", no fall-back. Sostoyanie ne realizovano i ne imeet fallback."
tl = "Warning 230: no implementation for state \"%s\" in function \"%s\", no fall-back. Walang implementation o fallback ang state."
en = "Warning 230: no implementation for state \"%s\" in function \"%s\", no fall-back. A state has no implementation and no fallback."
id = "Warning 230: no implementation for state \"%s\" in function \"%s\", no fall-back. Sebuah state gak punya implementasi dan gak punya fallback."

[explain."231"]
es = "Warning 231: state specification on forward declaration is ignored. Se ignoran las especificaciones de estado de una declaración forward."
ru = "Warning 231: state specification on forward declaration is ignored. Vse spetsifikatsii sostoyanij v takom obyavlenii ignoriruyutsya."
tl = "Warning 231: state specification on forward declaration is ignored. Hindi pinapansin ang mga state specification sa forward declaration."
en = "Warning 231: state specification on forward declaration is ignored. State specifications on a forward declaration are ignored."
id = "Warning 231: state specification on forward declaration is ignored. Penentu state pada forward declaration diabaikan."

[explain."232"]
es = "Warning 232: output file is written, but with compact encoding disabled. PawnMC depende de la codificación compacta para reducir el tamaño del archivo."
ru = "Warning 232: output file is written, but with compact encoding disabled. PawnMC ispolzuet kompaktnuyu kodirovku dlya umensheniya razmera fajla."
tl = "Warning 232: output file is written, but with compact encoding disabled. Umaasa ang PawnMC sa compact encoding para lumiit ang output."
en = "Warning 232: output file is written, but with compact encoding disabled. Compact encoding is disabled, which PawnMC relies on for smaller output."
id = "Warning 232: output file is written, but with compact encoding disabled. Compact encoding dinonaktifkan, padahal PawnMC memakainya agar keluaran lebih kecil."

[explain."233"]
es = "Warning 233: state variable \"%s\" shadows a global variable. La variable de estado oculta una variable global."
ru = "Warning 233: state variable \"%s\" shadows a global variable. Peremennaya sostoyaniya skryvaet globalnuyu peremennuyu."
tl = "Warning 233: state variable \"%s\" shadows a global variable. Itinatago ng state variable ang global variable."
en = "Warning 233: state variable \"%s\" shadows a global variable. A state variable hides a global variable."
id = "Warning 233: state variable \"%s\" shadows a global variable. Variabel state menyembunyikan variabel global."

[explain."234"]
es = "Warning 234: function is deprecated (symbol \"%s\") %s. El símbolo está marcado como obsoleto."
ru = "Warning 234: function is deprecated (symbol \"%s\") %s. Simvol pomechen kak ustarevshij."
tl = "Warning 234: function is deprecated (symbol \"%s\") %s. Deprecated ang symbol na ito."
en = "Warning 234: function is deprecated (symbol \"%s\") %s. The function is marked for removal or replacement; use the alternative named in the warning when one is provided."
id = "Warning 234: function is deprecated (symbol \"%s\") %s. Simbol ditandai usang."

[explain."235"]
es = "Warning 235: public function lacks forward declaration (symbol \"%s\"). El runtime nunca llama a esta función."
ru = "Warning 235: public function lacks forward declaration (symbol \"%s\"). Sreda vypolneniya nikogda ne vyzyvaet etu funktsiyu."
tl = "Warning 235: public function lacks forward declaration (symbol \"%s\"). Hindi kailanman tatawagin ng runtime ang function."
en = "Warning 235: public function lacks forward declaration (symbol \"%s\"). The function is never called by the runtime."
id = "Warning 235: public function lacks forward declaration (symbol \"%s\"). Fungsi gak pernah dipanggil runtime."

[explain."236"]
es = "Warning 236: unknown parameter in substitution (incorrect #define pattern). El patrón \"#define\" no coincide con los parámetros de la macro."
ru = "Warning 236: unknown parameter in substitution (incorrect #define pattern). Shablon \"#define\" ne sootvetstvuet parametram makrosa."
tl = "Warning 236: unknown parameter in substitution (incorrect #define pattern). Hindi tugma ang pattern ng \"#define\" sa mga parameter ng macro."
en = "Warning 236: unknown parameter in substitution (incorrect #define pattern). The \"#define\" pattern does not match the parameters of the macro."
id = "Warning 236: unknown parameter in substitution (incorrect #define pattern). Pola \"#define\" gak cocok dengan parameter makronya."

[explain."237"]
es = "Warning 237: user warning: %s. El script emitió una advertencia mediante \"#pragma warn\" o una llamada de advertencia del usuario."
ru = "Warning 237: user warning: %s. Skript vydal preduprezhdenie cherez \"#pragma warn\" ili vyzov polzovatelskogo preduprezhdeniya."
tl = "Warning 237: user warning: %s. Naglabas ang script ng babala sa pamamagitan ng \"#pragma warn\" o tawag para sa user warning."
en = "Warning 237: user warning: %s. The script emitted a warning through \"#pragma warn\" or a user warning call."
id = "Warning 237: user warning: %s. Skrip memunculkan peringatan lewat \"#pragma warn\" atau panggilan peringatan pengguna."

[explain."238"]
es = "Warning 238: meaningless combination of class specifiers (%s). Los especificadores de clase combinados acá no tienen sentido."
ru = "Warning 238: meaningless combination of class specifiers (%s). Ispolzovannoe sochetanie spetsifikatorov klassa ne imeet smysla."
tl = "Warning 238: meaningless combination of class specifiers (%s). Walang kahulugan ang pinagsamang class specifier dito."
en = "Warning 238: meaningless combination of class specifiers (%s). The class specifiers combined here mean nothing."
id = "Warning 238: meaningless combination of class specifiers (%s). Kombinasi penentu kelas di sini gak bermakna."

[explain."239"]
es = "Warning 239: literal array/string passed to a non-const parameter. Esta expresión no se puede reducir a una constante."
ru = "Warning 239: literal array/string passed to a non-const parameter. Eto vyrazhenie nevozmozhno svesti k konstante."
tl = "Warning 239: literal array/string passed to a non-const parameter. Hindi mare-reduce sa constant ang expression na ito."
en = "Warning 239: literal array/string passed to a non-const parameter. This expression cannot be reduced to a constant."
id = "Warning 239: literal array/string passed to a non-const parameter. Ekspresi ini gak bisa direduksi menjadi konstanta."
