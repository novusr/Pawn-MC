# --- forwards (callbacks) -------------------------------------------
#
# The events the server calls into a script, taken from the amx_FindPublic
# list in the SA-MP 0.3.7 server. The argument list is part of the
# description because it is what the completion popup can show.
#
[forward."a_samp.inc"]
"OnGameModeInit" = { en = "Runs once when the gamemode has loaded, before any player connects", id = "Dipanggil sekali saat gamemode selesai dimuat, sebelum ada pemain yang masuk", es = "Se ejecuta una vez cuando se ha cargado el gamemode, antes de que se conecte cualquier reproductor.", ru = "Запускается один раз при загрузке gamemode, прежде чем какой-либо игрок подключится.", tl = "Tatakbo nang isang beses kapag nag-load ang gamemode, bago kumonekta ang sinumang manlalaro" }
"OnGameModeExit" = { en = "Runs when the gamemode is being shut down", id = "Dipanggil saat gamemode sedang dihentikan", es = "Se ejecuta cuando el gamemode se está apagando", ru = "Запускается, когда gamemode выключается.", tl = "Tumatakbo kapag ang gamemode ay isinara" }
