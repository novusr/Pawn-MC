# Developer Portal (terminal simulator) data - 2026 format
#
# Naming: _developer.toml
# One table per terminal key; the reader asks for a key plus the interface
# language, so a lookup uses the same dotted name the console already uses,
# for example
#   [terminal.docs]  ->  get("terminal.docs", language)
#
# The docs markdown keeps its literal \n sequences; the reader expands them
# into real line breaks. Leaves are id, en, es, ru, tl, with en as the fallback.

[terminal.help]
id = "Perintah yang tersedia:\n  help                 Tampilkan daftar perintah\n  docs                 Buka dokumentasi Developer Portal\n  pawncc <file> [flag] Jalankan pawncc dengan file dan flag yang ditulis\n  switch [versi]       Ganti compiler 3.10.7 / 3.10.11\n  clear                Bersihkan riwayat console (alias: celar)\n  ls                   Daftar file dan folder di workspace\n  whoami               Nama pengguna console\n  time                 Jam saat ini\n  date                 Tanggal dan waktu lengkap\n  which <perintah>     Lokasi program atau perintah bawaan\n  deviceinfo           Informasi perangkat dan ABI\n  version              Versi PawnMC dan compiler\n  github               Tautan repositori\n\nContoh: pawncc gamemodes/mode.pwn -d=3\nKetik docs untuk dokumentasi lengkap."
en = "Available commands:\n  help                 Show the command list\n  docs                 Open the Developer Portal documentation\n  pawncc <file> [flags] Run pawncc with the specified file and flags\n  switch [version]     Switch compiler 3.10.7 / 3.10.11\n  clear                Clear console history (alias: celar)\n  ls                   List files and folders in the workspace\n  whoami               Console user name\n  time                 Current clock time\n  date                 Full date and time\n  which <command>      Location of a program or a built-in command\n  deviceinfo           Device and ABI information\n  version              PawnMC and compiler version\n  github               Repository link\n\nExample: pawncc gamemodes/mode.pwn -d=3\nType docs for full documentation."
