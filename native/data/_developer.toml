# Developer Portal (terminal simulator) data - 2026 format
#
# Naming: _developer.toml
# One table per terminal key; the reader asks for a key plus the interface
# language, so a lookup uses the same dotted name the console already uses,
# for example
#   [terminal.docs]  ->  get("terminal.docs", language)
#
# The docs markdown keeps its literal \n sequences; the reader expands them
# into real line breaks. Leaves are id, en, es, ru, tl, with en as the fallback.

[terminal.help]
id = "Daftar perintah yang bisa kamu pakai:\n  help                 Lihat daftar perintah\n  docs                 Buka dokumentasi Developer Portal\n  pawncc <file> [flag] Jalankan pawncc dengan file dan flag yang kamu masukkan\n  switch [versi]       Ganti compiler ke 3.10.7 / 3.10.11\n  clear                Bersihkan riwayat console (alias: celar)\n  ls                   Lihat file dan folder di workspace\n  whoami               Lihat nama pengguna console\n  time                 Lihat jam sekarang\n  date                 Lihat tanggal dan waktu sekarang\n  which <perintah>     Cari lokasi program atau perintah bawaan\n  deviceinfo           Lihat info perangkat dan ABI\n  version              Lihat versi PawnMC dan compiler\n  github               Buka repositori GitHub\n\nContoh: pawncc gamemodes/mode.pwn -d=3\nKetik docs kalau mau lihat dokumentasi lengkap."
en = "Commands you can use:\n  help                 See the command list\n  docs                 Open the Developer Portal docs\n  pawncc <file> [flags] Run pawncc with the file and flags you provide\n  switch [version]     Switch to compiler 3.10.7 / 3.10.11\n  clear                Clear the console history (alias: celar)\n  ls                   See files and folders in the workspace\n  whoami               See the console username\n  time                 Check the current time\n  date                 Check the current date and time\n  which <command>      Find a program or built-in command\n  deviceinfo           Check device and ABI info\n  version              Check PawnMC and compiler versions\n  github               Open the GitHub repository\n\nExample: pawncc gamemodes/mode.pwn -d=3\nType docs to check out the full documentation."
tl = "Mga command na puwede mong gamitin:\n  help                 Tingnan ang listahan ng mga command\n  docs                 Buksan ang Developer Portal docs\n  pawncc <file> [flags] Patakbuhin ang pawncc gamit ang file at flags na ilalagay mo\n  switch [version]     Lumipat sa compiler 3.10.7 / 3.10.11\n  clear                Linisin ang console history (alias: celar)\n  ls                   Tingnan ang mga file at folder sa workspace\n  whoami               Tingnan ang username ng console\n  time                 Tingnan ang oras ngayon\n  date                 Tingnan ang petsa at oras ngayon\n  which <command>      Hanapin ang lokasyon ng program o built-in na command\n  deviceinfo           Tingnan ang info ng device at ABI\n  version              Tingnan ang bersyon ng PawnMC at compiler\n  github               Buksan ang GitHub repository\n\nHalimbawa: pawncc gamemodes/mode.pwn -d=3\nI-type ang docs para makita ang buong dokumentasyon."
ru = "Komandy, kotorymi mozhno polzovatsya:\n  help                 Pokazat spisok komand\n  docs                 Otkryt dokumentatsiyu Developer Portal\n  pawncc <file> [flags] Zapustit pawncc s ukazannym faylom i flagami\n  switch [version]     Perekluchit compiler na 3.10.7 / 3.10.11\n  clear                Ochistit istoriyu konsoli (alias: celar)\n  ls                   Pokazat fayly i papki v workspace\n  whoami               Pokazat imya polzovatelya konsoli\n  time                 Pokazat tekushchee vremya\n  date                 Pokazat tekushchuyu datu i vremya\n  which <command>      Nayti put k programme ili vstroennoy komande\n  deviceinfo           Pokazat informatsiyu ob ustroystve i ABI\n  version              Pokazat versii PawnMC i compiler\n  github               Otkryt repozitoriy na GitHub\n\nPrimer: pawncc gamemodes/mode.pwn -d=3\nVvedite docs, chtoby posmotret polnuyu dokumentatsiyu."

