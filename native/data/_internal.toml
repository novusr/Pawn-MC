"GetServerVarAsString" = { en = "Reads a server.cfg variable as a string", id = "Membaca variabel server.cfg sebagai string", es = "Lee una variable server.cfg como una cadena", ru = "Schityvaet peremennuyu server.cfg kak stroku.", tl = "Nagbabasa ng server.cfg variable bilang string" }
"GetTickCount" = { en = "Returns the server uptime in milliseconds, wrapping every ~49 days", id = "Mengembalikan uptime server dalam milidetik, berulang setiap ~49 hari", es = "Devuelve el tiempo de actividad del servidor en milisegundos, ajustando cada ~49 días", ru = "Vozvrashchaet vremya bezotkaznoj raboty servera v millisekundakh s intervalom primerno 49 dnej.", tl = "Ibinabalik ang uptime ng server sa millisecond, bumabalot bawat ~49 araw" }
"GetVehiclePoolSize" = { en = "Returns the highest vehicle slot index currently in use", id = "Mengembalikan indeks slot kendaraan tertinggi yang sedang dipakai", es = "Devuelve el índice de espacios de vehículos más alto actualmente en uso", ru = "Vozvrashchaet samyj vysokij indeks slota transportnogo sredstva, kotoryj ispolzuetsya v dannyj moment.", tl = "Ibinabalik ang pinakamataas na index ng slot ng sasakyan na kasalukuyang ginagamit" }
"GetWeather" = { en = "Returns the weather id the world is currently set to", id = "Mengembalikan ID cuaca yang sedang dipakai dunia", es = "Devuelve la identificación del clima en el que el mundo está configurado actualmente.", ru = "Vozvrashchaet identifikator pogody, kotoryj v dannyj moment ustanovlen v mire.", tl = "Ibinabalik ang weather id kung saan kasalukuyang nakatakda ang mundo" }
"GetWorldTime" = { en = "Returns the hour the world clock is currently set to", id = "Mengembalikan jam yang sedang dipakai jam dunia", es = "Devuelve la hora en la que está configurado actualmente el reloj mundial", ru = "Vozvrashchaet chas, na kotoryj v dannyj moment ustanovleno mirovoe vremya.", tl = "Ibinabalik ang oras na kasalukuyang nakatakda ang orasan sa mundo" }
"IsPlayerConnected" = { en = "True when the slot holds a connected player", id = "Benar bila slot berisi pemain yang terhubung", es = "Verdadero cuando la ranura tiene un jugador conectado", ru = "Istinno, kogda v slote nakhoditsya podklyuchennyj igrok", tl = "True kapag ang slot ay may hawak na konektadong player" }
"IsPlayerNPC" = { en = "True when the connected player is an NPC rather than a human", id = "Benar bila pemain tersambung itu NPC, bukan manusia", es = "Verdadero cuando el reproductor conectado es un NPC en lugar de un humano", ru = "Istinno, esli podklyuchennyj igrok yavlyaetsya NPC, a ne chelovekom.", tl = "Totoo kapag ang konektadong player ay isang NPC sa halip na isang tao" }
"IsValidVehicle" = { en = "True when the vehicle slot holds a live vehicle", id = "Benar bila slot kendaraan berisi kendaraan yang masih hidup", es = "Verdadero cuando la ranura del vehículo contiene un vehículo activo", ru = "Istinno, kogda v slote transportnogo sredstva nakhoditsya rabotayushchij avtomobil.", tl = "Totoo kapag ang puwang ng sasakyan ay may hawak na live na sasakyan" }
"KillTimer" = { en = "Stops a timer previously returned by SetTimer or SetTimerEx", id = "Menghentikan timer yang sebelumnya dikembalikan SetTimer atau SetTimerEx", es = "Detiene un temporizador devuelto previamente por SetTimer o SetTimerEx", ru = "Ostanavlivaet tajmer, ranee vozvrashchennyj SetTimer ili SetTimerEx.", tl = "Pinipigilan ang isang timer na dating ibinalik ng SetTimer o SetTimerEx" }
"SetGameModeText" = { en = "Sets the gamemode name clients see while connecting", id = "Mengatur nama gamemode yang dilihat client saat menyambung", es = "Establece el nombre gamemode que ven los clientes al conectarse", ru = "Ustanavlivaet imya gamemode, kotoroe vidyat klienty pri podklyuchenii.", tl = "Itinatakda ang gamemode name client na nakikita habang kumokonekta" }
"SetGravity" = { en = "Sets the world gravity applied to every player", id = "Mengatur gravitasi dunia untuk semua pemain", es = "Establece la gravedad mundial aplicada a cada jugador.", ru = "Ustanavlivaet mirovuyu gravitatsiyu, primenyaemuyu k kazhdomu igroku", tl = "Itinatakda ang gravity ng mundo na inilapat sa bawat manlalaro" }
"SetTeamCount" = { en = "Declares how many teams the gamemode uses, for class selection", id = "Menyatakan jumlah tim yang dipakai gamemode untuk pemilihan kelas", es = "Declara cuántos equipos utiliza el gamemode, para la selección de clase.", ru = "Obyavlyaet, skolko komand ispolzuet gamemode dlya vybora klassa.", tl = "Ipinapahayag kung gaano karaming mga koponan ang ginagamit ng gamemode, para sa pagpili ng klase" }
"SetTimer" = { en = "Starts a timer that calls a function by name every interval milliseconds", id = "Menjalankan timer yang memanggil fungsi berdasarkan nama setiap interval milidetik", es = "Inicia un temporizador que llama a una función por su nombre cada intervalo de milisegundos.", ru = "Zapuskaet tajmer, kotoryj vyzyvaet funktsiyu po imeni kazhdye millisekundy.", tl = "Magsisimula ng timer na tumatawag sa isang function ayon sa pangalan sa bawat pagitan ng millisecond" }
"SetTimerEx" = { en = "Starts a timer that calls a function repeatedly with formatted arguments", id = "Menjalankan timer yang memanggil fungsi berulang dengan argumen terformat", es = "Inicia un temporizador que llama repetidamente a una función con argumentos formateados.", ru = "Zapuskaet tajmer, kotoryj neodnokratno vyzyvaet funktsiyu s formatirovannymi argumentami.", tl = "Nagsisimula ng timer na paulit-ulit na tumatawag sa isang function na may mga naka-format na argumento" }
"SetWeather" = { en = "Sets the world weather id for every player", id = "Mengatur ID cuaca dunia untuk semua pemain", es = "Establece la identificación del clima mundial para cada jugador.", ru = "Ustanavlivaet identifikator pogody v mire dlya kazhdogo igroka.", tl = "Itinatakda ang world weather id para sa bawat manlalaro" }
"SetWorldTime" = { en = "Sets the in-game clock for every player", id = "Mengatur jam dalam-permainan untuk semua pemain", es = "Establece el reloj del juego para cada jugador.", ru = "Ustanavlivaet vnutriigrovye chasy dlya kazhdogo igroka", tl = "Itinatakda ang in-game na orasan para sa bawat manlalaro" }

