"GetPlayerVersion" = { en = "Writes the SA-MP client version string the player is running", id = "Menulis string versi client SA-MP yang dipakai pemain", es = "Escribe la cadena de versión del cliente SA-MP que el reproductor está ejecutando.", ru = "Zapisyvaet stroku versii klienta SA-MP, na kotorom rabotaet pleer.", tl = "Isinulat ang SA-MP client version string na pinapatakbo ng player" }
"GetServerTickCount" = { en = "Returns the server tick counter, the same clock GetTickCount reads", id = "Mengembalikan penghitung tick server, jam yang sama dengan GetTickCount", es = "Devuelve el contador de ticks del servidor, el mismo reloj que lee GetTickCount", ru = "Vozvrashchaet schetchik tikov servera, te zhe chasy, kotorye schityvaet GetTickCount.", tl = "Ibinabalik ang server tick counter, ang parehong orasan na binasa ng GetTickCount" }
"GetServerTickRate" = { en = "Returns how many server ticks were processed in the last second", id = "Mengembalikan jumlah tick server yang diproses pada detik terakhir", es = "Devuelve cuántos ticks del servidor se procesaron en el último segundo", ru = "Vozvrashchaet kolichestvo tikov servera, obrabotannykh za poslednyuyu sekundu.", tl = "Ibinabalik kung gaano karaming mga server ticks ang naproseso sa huling segundo" }
"GetServerVarAsBool" = { en = "Reads a server.cfg variable as a boolean", id = "Membaca variabel server.cfg sebagai boolean", es = "Lee una variable server.cfg como booleana", ru = "Schityvaet peremennuyu server.cfg kak logicheskoe znachenie.", tl = "Nagbabasa ng variable ng server.cfg bilang boolean" }
