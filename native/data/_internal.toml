[native."string.inc"]
"format" = { en = "Formats a string with %d/%s/%f specifiers into the destination buffer and returns its length", id = "Memformat string memakai penanda %d/%s/%f ke buffer tujuan dan mengembalikan panjangnya", es = "Formatea una cadena con especificadores %d/%s/%f en el búfer de destino y devuelve su longitud.", ru = "Formatiruet stroku so spetsifikatorami %d/%s/%f v tselevoj bufer i vozvrashchaet ee dlinu.", tl = "Nagpo-format ng string gamit ang %d/%s/%f na mga specifier sa destination buffer at ibinabalik ang haba nito" }
