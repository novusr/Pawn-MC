# --- forwards (callbacks) -------------------------------------------
#
# The events the server calls into a script, taken from the amx_FindPublic
# list in the SA-MP 0.3.7 server. The argument list is part of the
# description because it is what the completion popup can show.
#
[forward."a_samp.inc"]
"OnGameModeInit" = { en = "Runs once when the gamemode has loaded, before any player connects", id = "Dipanggil sekali saat gamemode selesai dimuat, sebelum ada pemain yang masuk", es = "Se ejecuta una vez cuando se ha cargado el gamemode, antes de que se conecte cualquier reproductor.", ru = "Zapuskaetsya odin raz pri zagruzke gamemode, prezhde chem kakoj-libo igrok podklyuchitsya.", tl = "Tatakbo nang isang beses kapag nag-load ang gamemode, bago kumonekta ang sinumang manlalaro" }
"OnGameModeExit" = { en = "Runs when the gamemode is being shut down", id = "Dipanggil saat gamemode sedang dihentikan", es = "Se ejecuta cuando el gamemode se está apagando", ru = "Zapuskaetsya, kogda gamemode vyklyuchaetsya.", tl = "Tumatakbo kapag ang gamemode ay isinara" }
"OnIncomingConnection" = { en = "(playerid, ip[], port) A connection is arriving, before the player is fully in", id = "(playerid, ip[], port) Sebuah koneksi baru datang, sebelum pemain benar-benar masuk", es = "(playerid, ip[], port) Está llegando una conexión, antes de que el reproductor esté completamente en", ru = "(playerid, ip[], port) Soedinenie ustanavlivaetsya do togo, kak igrok polnostyu vojdet v sistemu.", tl = "(playerid, ip[], port) May darating na koneksyon, bago ganap na makapasok ang player" }
"OnPlayerConnect" = { en = "(playerid) A player has connected and is now in the player pool", id = "(playerid) Pemain sudah terhubung dan kini ada di player pool", es = "(playerid) Un jugador se ha conectado y ahora está en el grupo de jugadores.", ru = "(playerid) Igrok podklyuchilsya i teper nakhoditsya v pule igrokov.", tl = "(playerid) Isang player ang kumonekta at ngayon ay nasa player pool" }
"OnPlayerDisconnect" = { en = "(playerid, reason) A player left; reason 0 quit, 1 kicked, 2 timeout/crash", id = "(playerid, reason) Pemain keluar; reason 0 keluar sendiri, 1 ditendang, 2 timeout/crash", es = "(playerid, motivo) Un jugador se fue; motivo 0 abandono, 1 expulsado, 2 tiempo de espera/caída", ru = "(playerid, prichina) Igrok ushel; prichina 0 vykhoda, 1 kik, 2 tajmaut/sboj", tl = "(playerid, dahilan) Umalis ang isang manlalaro; dahilan 0 huminto, 1 sinipa, 2 timeout/crash" }
"OnPlayerRequestClass" = { en = "(playerid, classid) The client asks to select a spawn class", id = "(playerid, classid) Client meminta pemilihan kelas spawn", es = "(playerid, classid) El cliente solicita seleccionar una clase spawn", ru = "(playerid, classid) Klient prosit vybrat klass spawn", tl = "(playerid, classid) Hinihiling ng kliyente na pumili ng klase ng spawn" }
"OnPlayerRequestSpawn" = { en = "(playerid) Return 0 to keep the player in class selection", id = "(playerid) Kembalikan 0 untuk menahan pemain di pemilihan kelas", es = "(playerid) Devuelve 0 para mantener al jugador en la selección de clase", ru = "(playerid) Vernite 0, chtoby ostavit igroka v vybore klassa.", tl = "(playerid) Ibalik ang 0 upang mapanatili ang player sa pagpili ng klase" }
"OnPlayerSpawn" = { en = "(playerid) The player has spawned with their spawn info", id = "(playerid) Pemain sudah spawn dengan info spawn-nya", es = "(playerid) El jugador ha aparecido con su información spawn.", ru = "(playerid) Igrok poyavilsya so svoej informatsiej spawn.", tl = "(playerid) Ang player ay nag-spawn sa kanilang spawn na impormasyon" }
"OnPlayerDeath" = { en = "(playerid, killerid, reason) A player died; reason is the weapon id", id = "(playerid, killerid, reason) Pemain mati; reason adalah ID senjata", es = "(playerid, killerid, motivo) Un jugador murió; la razón es la identificación del arma", ru = "(playerid, killerid, prichina) Igrok umer; prichina v identifikatore oruzhiya", tl = "(playerid, killerid, reason) Namatay ang isang manlalaro; ang dahilan ay ang armas id" }
"OnPlayerStateChange" = { en = "(playerid, newstate, oldstate) Player state changed, e.g. entering a vehicle", id = "(playerid, newstate, oldstate) State pemain berubah, mis. naik kendaraan", es = "(playerid, newstate, oldstate) El estado del jugador cambió, p.e. entrar a un vehículo", ru = "(playerid, newstate, oldstate) Sostoyanie igroka izmenilos, naprimer. vkhod v transportnoe sredstvo", tl = "(playerid, newstate, oldstate) Binago ang status ng player, hal. pagpasok sa isang sasakyan" }
"OnPlayerEnterVehicle" = { en = "(playerid, vehicleid, ispassenger) The player starts entering a vehicle", id = "(playerid, vehicleid, ispassenger) Pemain mulai menaiki kendaraan", es = "(playerid, Vehicleid, ispassenger) El jugador comienza a entrar en un vehículo.", ru = "(playerid, VehicleID, ispassenger) Igrok nachinaet saditsya v transportnoe sredstvo.", tl = "(playerid, vehicleid, ispassenger) Ang manlalaro ay nagsimulang pumasok sa isang sasakyan" }
"OnPlayerExitVehicle" = { en = "(playerid, vehicleid) The player has left a vehicle", id = "(playerid, vehicleid) Pemain sudah keluar dari kendaraan", es = "(playerid, Vehicleid) El jugador ha abandonado un vehículo.", ru = "(playerid, VehicleID) Igrok pokinul transportnoe sredstvo", tl = "(playerid, vehicleid) Ang manlalaro ay umalis ng sasakyan" }
"OnPlayerText" = { en = "(playerid, text[]) A player sent a chat line; return 0 to hide it", id = "(playerid, text[]) Pemain mengirim chat; kembalikan 0 untuk menyembunyikannya", es = "(playerid, text[]) Un jugador envió una línea de chat; devuelve 0 para ocultarlo", ru = "(playerid, text[]) Igrok otpravil stroku chata; vernite 0, chtoby skryt eto", tl = "(playerid, text[]) Nagpadala ang isang manlalaro ng chat line; ibalik ang 0 upang itago ito" }
"OnPlayerCommandText" = { en = "(playerid, cmdtext[]) A chat line starts with /; return 1 to mark it handled", id = "(playerid, cmdtext[]) Baris chat diawali /; kembalikan 1 bila sudah ditangani", es = "(playerid, cmdtext[]) Una línea de chat comienza con /; devuelve 1 para marcarlo como manejado", ru = "(playerid, cmdtext[]) Stroka chata nachinaetsya s /; vernite 1, chtoby otmetit, chto eto obrabotano", tl = "(playerid, cmdtext[]) Nagsisimula ang linya ng chat sa /; ibalik ang 1 upang markahan ito na pinangangasiwaan" }
"OnPlayerUpdate" = { en = "(playerid) Called whenever the client syncs with the server", id = "(playerid) Dipanggil setiap kali client menyinkronkan data ke server", es = "(playerid) Se llama cada vez que el cliente se sincroniza con el servidor.", ru = "(playerid) Vyzyvaetsya vsyakij raz, kogda klient sinkhroniziruetsya s serverom.", tl = "(playerid) Tinatawag tuwing nagsi-sync ang kliyente sa server" }
"OnPlayerKeyStateChange" = { en = "(playerid, newkeys, oldkeys) The set of held keys changed", id = "(playerid, newkeys, oldkeys) Kombinasi tombol yang ditekan berubah", es = "(playerid, newkeys, oldkeys) El conjunto de claves retenidas cambió", ru = "(playerid, newkeys, oldkeys) Izmenen nabor uderzhivaemykh klyuchej", tl = "(playerid, newkeys, oldkeys) Nagbago ang set ng mga hold na key" }
