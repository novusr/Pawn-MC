"GetPlayerCount" = { en = "Returns how many players are currently connected", id = "Mengembalikan jumlah pemain yang sedang terhubung", es = "Devuelve cuántos jugadores están conectados actualmente", ru = "Vozvrashchaet kolichestvo igrokov, podklyuchennykh v dannyj moment.", tl = "Ibinabalik kung gaano karaming mga manlalaro ang kasalukuyang konektado" }
"GetPlayerIDFromName" = { en = "Finds the player slot whose name matches exactly, or INVALID_PLAYER_ID", id = "Mencari slot pemain dengan nama yang persis sama, atau INVALID_PLAYER_ID", es = "Encuentra la ranura del jugador cuyo nombre coincide exactamente, o INVALID_PLAYER_ID", ru = "Nakhodit slot igroka, imya kotorogo tochno sootvetstvuet, ili INVALID_PLAYER_ID.", tl = "Hinahanap ang slot ng manlalaro na eksaktong tumutugma ang pangalan, o INVALID_PLAYER_ID" }
"GetPlayerIp" = { en = "Writes the player's IP address (without port) into the buffer", id = "Menulis alamat IP pemain (tanpa port) ke buffer", es = "Escribe la dirección IP del reproductor (sin puerto) en el buffer", ru = "Zapisyvaet adres IP pleera (bez porta) v bufer.", tl = "Isinulat ang IP address ng player (walang port) sa buffer" }
