en = "Add human-readable explanations next to warnings, errors, and fatal messages extracted from the compiler log."
tl = "Magdag ng paliwanag sa simpleng salita sa tabi ng bawat warning, error, at fatal na mensahe mula sa compiler log."
ru = "Dobavlyaet ponyatnye poyasneniya ryadom s preduprezhdeniyami, oshibkami i fatalnymi soobshcheniyami, izvlechyonnymi iz zhurnala kompilyatora."
