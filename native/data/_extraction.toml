[settings.general.desc]
id = "Preferensi dasar yang dipakai di seluruh aplikasi: bahasa antarmuka, tema tampilan, dan compiler yang dipakai untuk membangun skrip."
en = "Core preferences applied across the whole app: interface language, colour theme, and which compiler is used to build your scripts."
tl = "Pangunahing kagustuhan para sa buong app: wika ng interface, tema ng kulay, at kung aling compiler ang gagamitin para sa mga script mo."
ru = "Osnovnye parametry, primenyaemye ko vsemu prilozheniyu: yazyk interfejsa, tsvetovaya tema i kompilyator, ispolzuemyj dlya sborki skriptov."
es = "Preferencias basicas que se aplican a toda la app: idioma de la interfaz, tema de color y que compilador se usa para construir tus scripts."

[settings.compiler.version]
id = "Versi Compiler"
en = "Compiler Version"
tl = "Bersyon ng Compiler"
ru = "Versiya kompilyatora"
es = "Version del compilador"

[settings.compiler.version.desc]
id = "Pilih rilis pawncc yang dipakai saat kompilasi. Berpindah versi memuat ulang pustaka compiler, jadi aplikasi perlu dimulai ulang setelah berubah."
en = "Chooses which pawncc release performs the compilation. Switching versions reloads the compiler library, so the app has to restart once the change is applied."
tl = "Pinipili kung aling release ng pawncc ang gagamitin sa kompilasyon. Nagre-reload ang compiler library kapag pinalitan ang bersyon, kaya dapat i-restart ang app kapag nailapat na ang pagbabago."
ru = "Opredelyaet, kakaya versiya pawncc vypolnyaet kompilyatsiyu. Smena versii perezagruzhaet biblioteku kompilyatora, poetomu posle primeneniya izmeneniya prilozhenie nuzhno perezapustit."
es = "Elige que version de pawncc realiza la compilacion. Cambiar de version recarga la libreria del compilador, asi que la app tiene que reiniciarse una vez aplicado el cambio."

