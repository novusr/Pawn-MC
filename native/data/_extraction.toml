# PawnMC localization data - 2026 format
#
# Naming: _extraction.toml
# Every table name is an existing setting name, so a lookup uses the same
# dotted key the UI already passes to the localizer, for example
#   localizer.get("settings.general", language)
# reads the [settings.general] table below.
#
# Leaves are the interface languages: id, en, ru, es.

