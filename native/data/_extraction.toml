tl = "Attempts to fix the root cause of 'cannot read from file: ...' errors caused by differences between Android and Windows filesystem formats."
ru = "Pytaetsya ustranit pervoprichinu oshibok 'cannot read from file: ...', vyzvannykh razlichiyami v formatakh fajlovykh sistem Android i Windows."
es = "Intenta solucionar la causa raíz de los errores 'cannot read from file: ...' provocados por las diferencias entre los formatos de los sistemas de archivos de Android y Windows."

[settings.option.explain]
