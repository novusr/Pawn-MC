tl = "Pinakadetalyadong debugging; awtomatikong naka-off ang optimization."
ru = "Naibolee podrobnaya otladka; optimizatsiya otklyuchaetsya avtomaticheski."
es = "Depuracion mas detallada; la optimizacion se desactiva automaticamente."

[settings.option.optimization]
