tl = "Mga Path ng Include"
ru = "Puti include"
es = "Rutas de include"

[settings.include.paths.desc]
id = "Daftar folder yang ditelusuri compiler saat menyelesaikan #include. Path yang tidak ada lagi akan dibuang otomatis saat aplikasi dibuka."
en = "Folders the compiler searches when resolving #include. Paths that no longer exist are pruned automatically on app start."
tl = "Mga folder na hinahanap ng compiler kapag nire-resolve ang #include. Awtomatikong tinatanggal ang path na wala na kapag binuksan ang app."
ru = "Papki, kotorye kompilyator prosmatrivaet pri razreshenii #include. Nesushchestvuyushchie puti avtomaticheski udalyayutsya pri zapuske prilozheniya."
es = "Carpetas que el compilador revisa al resolver los #include. Las rutas que ya no existen se eliminan solas al iniciar la app."

[settings.updates]
id = "Pembaruan"
en = "Updates"
tl = "Mga Update"
ru = "Obnovleniya"
es = "Actualizaciones"

[settings.updates.desc]
id = "Memeriksa rilis baru di GitHub dan mengunduh paket yang sesuai dengan varian Android PawnMC ke Documents/Pawn-MC. Setelah ZIP diekstrak, pemasangan atau pembaruan dilakukan lewat dialog sistem Android; aplikasi lama tidak dihapus otomatis."
en = "Checks GitHub for a newer release and downloads the Android-flavor package to Documents/Pawn-MC. After extracting the ZIP, installation or updating is handled by Android's system installer; the existing app is never uninstalled automatically."
tl = "Tinitingnan ang GitHub para sa mas bagong release at dina-download ang package na angkop sa Android flavor ng PawnMC papunta sa Documents/Pawn-MC. Pagkatapos i-extract ang ZIP, ang system installer ng Android ang bahala sa pag-install o pag-update; hindi awtomatikong ia-uninstall ang kasalukuyang app."
ru = "Proveryaet GitHub na nalichie novoj versii i zagruzhaet paket dlya sootvetstvuyushchego varianta Android v Documents/Pawn-MC. Posle raspakovki ZIP ustanovkoj ili obnovleniem zanimaetsya sistemnyj ustanovshchik Android; prilozhenie ne udalyaetsya avtomaticheski."
es = "Busca una version nueva en GitHub y descarga el paquete para la variante de Android correspondiente a Documents/Pawn-MC. Tras extraer el ZIP, el instalador del sistema Android se encarga de instalar o actualizar la app; la aplicacion existente nunca se desinstala automaticamente."

