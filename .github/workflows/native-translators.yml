name: Native Translators

# Builds the two arm64 shared objects PocketSAMP cannot run without and publishes
# them as artifacts, so they can be committed to
# thirdparty/PocketSAMP/app/src/main/jniLibs/arm64-v8a/.
#
#   libqemu-i386.so  QEMU user-mode translator. Both guests are 32-bit x86:
#                    samp03svr (closed source) and mariadbd (Debian i386 build).
#                    Without it neither process starts.
#   libproot.so      PRoot. Optional: it provides /dev, /proc and the gamemode
#                    bind mount to the guest. QEMU works without it, so a failed
#                    PRoot build does not fail the job.
#
# Both are ordinary Linux command-line programs. Android only executes shared
# objects from the APK's lib/<abi>/ directory, hence the "lib*.so" names.

on:
  workflow_dispatch:
  # No `paths:` filter.
  #
  # With one, the job only ran when this file itself changed, so any commit that
  # touched only Kotlin or assets left it out of the run list entirely and it looked
  # as if the workflow had been deleted. Building the translators is the only way the
  # runtime can start, so it is worth running on every push to the main line.
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '29.0.14206865'
  API_LEVEL: '26'
  QEMU_VERSION: '7.2.0'
  QEMU_SHA256: ''
  PRoot_COMMIT: 'master'
  TALLOC_VERSION: '2.4.2'
  GLIB_VERSION: '2.80.0'
  LIBICONV_VERSION: '1.17'

jobs:
  qemu:
    name: libqemu-i386.so (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build meson pkg-config python3 python3-venv \
            flex bison libglib2.0-dev git

      - name: Fetch QEMU source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${QEMU_VERSION}" https://gitlab.com/qemu-project/qemu.git qemu
          if [ -n "${QEMU_SHA256}" ]; then
            echo "Pinning to a commit is done with --branch above; SHA256 is unused."
          fi

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # The hosted runner image ships cmdline-tools; install the NDK if missing.
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/clang" --version

      - name: Build glib for arm64
        run: |
          set -euo pipefail
          CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
          mkdir -p /opt/glib-android

          # Bionic only provides iconv from API 28 onward, and this build targets
          # API 26, while glib hard-requires iconv (it runs dependency('iconv'),
          # which is not optional). Build GNU libiconv into the target prefix so
          # glib's meson setup can find iconv_open in -liconv.
          curl -fsSL "https://ftp.gnu.org/gnu/libiconv/libiconv-${LIBICONV_VERSION}.tar.gz" -o libiconv.tgz
          tar xzf libiconv.tgz
          cd "libiconv-${LIBICONV_VERSION}"
          ./configure \
            --host=aarch64-linux-android \
            --prefix=/opt/glib-android \
            --enable-static --disable-shared \
            CC="$CC"
          make -j"$(nproc)"
          make install
          cd ..

          # Meson's dependency('iconv') probes only "builtin" (libc) and
          # "system" (the compiler's default search paths); project
          # c_args/c_link_args are NOT applied to that lookup, so
          # /opt/glib-android stays invisible to it ("tried builtin and system").
          # Copying the header and static archive into the NDK sysroot puts them
          # on the default include/lib path. It also guarantees the final QEMU
          # static link resolves -liconv without extra flags.
          cp /opt/glib-android/include/iconv.h \
            "$TOOLCHAIN/sysroot/usr/include/iconv.h"
          cp /opt/glib-android/lib/libiconv.a \
            "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}/libiconv.a"

          # QEMU 7.2's configure compiles AND links a glib test program using
          # whatever pkg-config reports. With the host's x86_64 glib .pc files,
          # the aarch64 link fails and QEMU reports it as the misleading
          # "sizeof(size_t) doesn't match GLIB_SIZEOF_SIZE_T" error. The only
          # real fix is a glib built for aarch64/Android, then setting
          # PKG_CONFIG_LIBDIR to it in the configure step below.
          #
          # Avoid GLib's stale WrapDB zlib 1.2.11 hash: build a pinned current
          # zlib release for Android and have Meson use this target dependency.
          ZLIB_VERSION=1.3.1
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" -o zlib.tgz
          tar xzf zlib.tgz
          cd "zlib-${ZLIB_VERSION}"
          CC="$CC" ./configure --static --prefix=/opt/glib-android
          make -j"$(nproc)"
          make install
          cd ..
          git clone --depth 1 --branch "${GLIB_VERSION}" https://github.com/GNOME/glib.git glib-src
          printf '%s\n' \
            '[binaries]' \
            "c = '$CC'" \
            "cpp = '$CXX'" \
            "ar = '$TOOLCHAIN/bin/llvm-ar'" \
            "strip = '$TOOLCHAIN/bin/llvm-strip'" \
            "pkg-config = 'pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            '' \
            '[properties]' \
            'needs_exe_wrapper = true' \
            > cross-aarch64-android.ini
          # Cross-file compiler definitions apply to Meson's target machine. Meson
          # otherwise treats the x86_64 runner as the host compiler environment and
          # can try to execute the arm64 sanity-check binary as a native executable.
          printf '%s\n' \
            '[binaries]' \
            "c = 'cc'" \
            "cpp = 'c++'" \
            "ar = 'ar'" \
            "strip = 'strip'" \
            > cross-native.ini
          export PKG_CONFIG_LIBDIR=/opt/glib-android/lib/pkgconfig
          cd glib-src
          meson setup build-android \
            --cross-file ../cross-aarch64-android.ini \
            --native-file ../cross-native.ini \
            --prefix=/opt/glib-android \
            --default-library=static \
            --wrap-mode=forcefallback \
            -Dc_args=-I/opt/glib-android/include \
            -Dc_link_args=-L/opt/glib-android/lib \
            -Dtests=false \
            -Dintrospection=disabled \
            -Dlibmount=disabled \
            -Dselinux=disabled \
            -Dxattr=false \
            -Dman-pages=disabled \
            -Dglib_debug=disabled
          ninja -C build-android
          ninja -C build-android install
          # Every .pc QEMU may ask for (glib, gobject, gthread, gio, gmodule,
          # pcre2, ffi, iconv) must live in this directory.
          ls /opt/glib-android/lib/pkgconfig

      - name: Configure QEMU for aarch64 Linux user-mode
        run: |
          set -euo pipefail
          # QEMU derives every helper from --cross-prefix by appending a plain tool
          # name (ar, ranlib, strip, pkg-config, ...). The NDK only ships the
          # API-qualified driver name, aarch64-linux-android${API_LEVEL}-*, so the
          # prefix must stop at the triple and the API level is passed through
          # ANDROID_API_LEVEL instead. A temporary shim directory then satisfies
          # every name QEMU asks for that the triple alone would not resolve.
          #
          # The shim also lives in the checkout (not only in /tmp) so that later
          # steps, which are separate shells, can reuse it: Meson records the tool
          # paths configure resolved and BOTH the makefile wrapper and ninja call
          # the tools by absolute path, so they must still exist when the build runs.
          #
          # QEMU probes these with `has` (`command -v`), which does NOT see the
          # ARM cross tools: putting $TOOLCHAIN/bin on PATH would also expose the
          # host "gcc"/"cc"/"ar" from the same directory and break the native
          # compiler detection. Hence explicit overrides for the tools configure
          # picks up from the environment.
          CROSS_PREFIX="$TOOLCHAIN/bin/aarch64-linux-android-"
          SHIM_DIR="$PWD/.qemu-cross-bin"
          mkdir -p "$SHIM_DIR"
          API_TOOL="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}"
          link_tool() { ln -sf "$1" "$SHIM_DIR/aarch64-linux-android-$2"; }
          link_tool "${API_TOOL}-clang"   cc
          link_tool "${API_TOOL}-clang++" c++
          link_tool "$TOOLCHAIN/bin/llvm-ar" ar
          link_tool "$TOOLCHAIN/bin/llvm-ranlib"  ranlib
          link_tool "$TOOLCHAIN/bin/llvm-strip"   strip
          link_tool "$TOOLCHAIN/bin/llvm-nm"      nm
          link_tool "$TOOLCHAIN/bin/llvm-objcopy" objcopy
          link_tool "$TOOLCHAIN/bin/llvm-objdump" objdump
          link_tool "$TOOLCHAIN/bin/ld.lld"       ld
          # pkg-config has to answer for the target, not the runner.
          printf '%s\n' '#!/bin/sh' \
            'PKG_CONFIG_LIBDIR=/opt/glib-android/lib/pkgconfig:/opt/glib-android/share/pkgconfig' \
            'PKG_CONFIG_SYSROOT_DIR=' \
            'export PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR' \
            'exec pkg-config "$@"' > "$SHIM_DIR/aarch64-linux-android-pkg-config"
          chmod +x "$SHIM_DIR/aarch64-linux-android-pkg-config"
          export ANDROID_API_LEVEL="$API_LEVEL"
          export SHIM_DIR
          echo "SHIM_DIR=$SHIM_DIR" >> "$GITHUB_ENV"
          # configure's defaults are ${VAR-${cross_prefix}tool}; the override is
          # what makes it reject a missing tool instead of silently building a
          # config that references a nonexistent /bin/aarch64-linux-android-nm
          # later during `ninja`.
          export AR="$SHIM_DIR/aarch64-linux-android-ar"
          export NM="$SHIM_DIR/aarch64-linux-android-nm"
          export RANLIB="$SHIM_DIR/aarch64-linux-android-ranlib"
          export STRIP="$SHIM_DIR/aarch64-linux-android-strip"
          export OBJCOPY="$SHIM_DIR/aarch64-linux-android-objcopy"
          export LD="$SHIM_DIR/aarch64-linux-android-ld"
          export PATH="$SHIM_DIR:$PATH"
          for tool in cc c++ ar ranlib strip nm objcopy objdump ld pkg-config; do
            if ! command -v "aarch64-linux-android-$tool" >/dev/null 2>&1; then
              echo "::error::cross tool aarch64-linux-android-$tool is missing from $SHIM_DIR"
              exit 1
            fi
          done
          ls -1 "$SHIM_DIR"

          # Bionic compatibility layer, force-included into every QEMU TU (-include).
          #
          # QEMU targets glibc, and these are the glibc-only things libqemu's
          # linux-user code uses that Bionic does not provide:
          #
          #   ulong                       Glibc defines it in <sys/types.h>; Bionic does
          #                               not, which breaks linux-user/mmap.c (and would
          #                               break any other TU that reaches it first).
          #   sigorset/sigandset/         Glibc <signal.h> helpers ("_GNU_SOURCE"); the
          #   sigisemptyset               linux-user signal code calls sigorset.
          #
          # Both are re-implemented here over plain byte-wise set operations (a sigset_t
          # is a bitmask and Bionic has no public equivalent) instead of patching QEMU's
          # source. The header is force-included rather than edited into the tree: one
          # file to maintain, and every target sees the same definitions.
          cat > android-compat.h <<'EOF'
          #ifndef QEMU_ANDROID_COMPAT_H
          #define QEMU_ANDROID_COMPAT_H
          /* .S files share these -include flags; keep the C-only content out of them. */
          #ifndef __ASSEMBLER__

          /* No Bionic header defines these two, and QEMU's osdep.h does not either. */
          #include <sys/types.h>
          #include <stdint.h>
          #include <signal.h>
          #include <string.h>

          typedef unsigned char  u_char;
          typedef unsigned short u_short;
          typedef unsigned int   u_int;
          typedef unsigned long  u_long;
          typedef unsigned long  ulong;
          typedef unsigned int   uint;
          typedef unsigned short ushort;

          typedef unsigned char u8;
          typedef unsigned short u16;
          typedef unsigned int u32;
          typedef unsigned long long u64;

          static inline int android_compat_sigorset(sigset_t *dest, const sigset_t *left, const sigset_t *right)
          {
              unsigned char *d = (unsigned char *)dest;
              const unsigned char *l = (const unsigned char *)left;
              const unsigned char *r = (const unsigned char *)right;
              for (size_t i = 0; i < sizeof(sigset_t); ++i) {
                  d[i] = (unsigned char)(l[i] | r[i]);
              }
              return 0;
          }

          static inline int android_compat_sigandset(sigset_t *dest, const sigset_t *left, const sigset_t *right)
          {
              unsigned char *d = (unsigned char *)dest;
              const unsigned char *l = (const unsigned char *)left;
              const unsigned char *r = (const unsigned char *)right;
              for (size_t i = 0; i < sizeof(sigset_t); ++i) {
                  d[i] = (unsigned char)(l[i] & r[i]);
              }
              return 0;
          }

          static inline int android_compat_sigisemptyset(const sigset_t *set)
          {
              const unsigned char *s = (const unsigned char *)set;
              for (size_t i = 0; i < sizeof(sigset_t); ++i) {
                  if (s[i] != 0) {
                      return 0;
                  }
              }
              return 1;
          }

          #define sigorset android_compat_sigorset
          #define sigandset android_compat_sigandset
          #define sigisemptyset android_compat_sigisemptyset

          #endif /* __ASSEMBLER__ */
          #endif /* QEMU_ANDROID_COMPAT_H */
          EOF
          QEMU_ANDROID_EXTRA_CFLAGS="-include $PWD/android-compat.h"
          # Linux-user resolves a few glibc symbols lazily; allow them to stay undefined
          # in the static link instead of failing at build time.
          QEMU_ANDROID_EXTRA_LDFLAGS="-Wl,--allow-shlib-undefined"
          export QEMU_ANDROID_EXTRA_CFLAGS QEMU_ANDROID_EXTRA_LDFLAGS
          echo 'android-compat header:'
          head -5 android-compat.h

          # Meson resolves pkg-config per machine; pin the build machine to the host
          # binary so it is never prefixed with the cross tool name.
          export PKG_CONFIG="$(command -v pkg-config)"
          export PKG_CONFIG_LIBDIR=/opt/glib-android/lib/pkgconfig
          # The target compiler, target OS and GLib sizes must agree: QEMU infers
          # `android` from the aarch64-linux-android- prefix, so the NDK driver is
          # the only compiler that may be used for the target.
          export TARGET_CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          export TARGET_CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
                    mkdir -p compat-include
          cat > compat-include/mqueue.h <<'EOF'
          #ifndef ANDROID_COMPAT_MQUEUE_H
          #define ANDROID_COMPAT_MQUEUE_H
          
          /* Bionic ships neither <mqueue.h> nor the mq_* libc calls, so route
           * QEMU's four libc calls straight to the kernel syscalls. */
          #include <fcntl.h>
          #include <stdarg.h>
          #include <stddef.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <unistd.h>
          
          typedef int mqd_t;
          
          struct mq_attr {
              long mq_flags;
              long mq_maxmsg;
              long mq_msgsize;
              long mq_curmsgs;
          };
          
          static inline mqd_t android_compat_mq_open(const char *name, int oflag, ...)
          {
              mode_t mode = 0;
              struct mq_attr *attr = NULL;
              if (oflag & O_CREAT) {
                  va_list ap;
                  va_start(ap, oflag);
                  mode = va_arg(ap, mode_t);
                  attr = va_arg(ap, struct mq_attr *);
                  va_end(ap);
              }
              return (mqd_t)syscall(__NR_mq_open, name, oflag, mode, attr);
          }
          
          static inline int android_compat_mq_unlink(const char *name)
          {
              return (int)syscall(__NR_mq_unlink, name);
          }
          
          static inline int android_compat_mq_getattr(mqd_t mqdes, struct mq_attr *attr)
          {
              return (int)syscall(__NR_mq_getsetattr, mqdes, NULL, attr);
          }
          
          static inline int android_compat_mq_setattr(mqd_t mqdes, const struct mq_attr *new_attr,
                                                      struct mq_attr *old_attr)
          {
              return (int)syscall(__NR_mq_getsetattr, mqdes, new_attr, old_attr);
          }
          
          #define mq_open android_compat_mq_open
          #define mq_unlink android_compat_mq_unlink
          #define mq_getattr android_compat_mq_getattr
          #define mq_setattr android_compat_mq_setattr
          
          #endif /* ANDROID_COMPAT_MQUEUE_H */
          EOF
          echo "QEMU_ANDROID_EXTRA_CFLAGS=-I$PWD/compat-include -include $PWD/android-compat.h" >> "$GITHUB_ENV"
          cd qemu
          # QEMU 7.2 hand-defines these for glibc >= 2.36; the NDK sysroot's
          # kernel UAPI headers already provide both (identical layout).
          sed -i '/^struct file_clone_range {$/,/^};$/d' linux-user/syscall.c
          sed -i '/^struct sched_attr {$/,/^};$/d' linux-user/syscall.c
          set +e
          # NOTE: no --disable-system / --disable-docs / --disable-tools /
          # --disable-guest-agent here. QEMU 7.2's configure forwards these straight to
          # Meson (`meson_option_parse`), but 7.2's meson_options.txt has no such
          # options, so Meson aborts configure with "ERROR: Unknown options". QEMU
          # derives both from --target-list: `softmmu=no` because the list holds only
          # `*-linux-user`, and docs/tools are covered by the `ninja` targets below.
          ./configure \
            --target-list=i386-linux-user \
            --cross-prefix="$CROSS_PREFIX" \
            --cpu=aarch64 \
            --cc="$TARGET_CC" \
            --cxx="$TARGET_CXX" \
            --host-cc=cc \
            --static \
            --disable-werror \
            --extra-cflags="$QEMU_ANDROID_EXTRA_CFLAGS" \
            --extra-ldflags="$QEMU_ANDROID_EXTRA_LDFLAGS" \
            2>&1 | tee configure.log
          configure_status=${PIPESTATUS[0]}
          if [ -f config-host.mak ]; then
            echo '::group::QEMU configure summary'
            grep -E '^(TARGETS|CONFIG_LINUX|CONFIG_TCG|CONFIG_USER|PKG_CONFIG|CC=|GLIB)' config-host.mak || true
            echo '::endgroup::'
          fi
          if [ "$configure_status" -eq 0 ] && [ ! -f GNUmakefile ]; then
            echo '::error::configure reported success but produced no GNUmakefile.'
            configure_status=1
          fi
          set -e
          if [ "$configure_status" -ne 0 ]; then
            echo '::group::QEMU configure diagnostics'
            if [ -f build/meson-logs/meson-log.txt ]; then
              cat build/meson-logs/meson-log.txt
            fi
            if [ -f build/meson-logs/meson-log.json ]; then
              cat build/meson-logs/meson-log.json
            fi
            echo '--- configure output (tail) ---'
            tail -n 200 configure.log
            echo '::endgroup::'
            exit "$configure_status"
          fi

      - name: Build
        # The configure step above is a step of its own, so its `cd qemu` does not
        # carry over: this step has to enter the QEMU tree too.
        working-directory: qemu
        run: |
          set -euo pipefail
          # Separate step means a fresh shell; the shim dir was exported to
          # $GITHUB_ENV by the configure step so it resolves here too.
          export PATH="$SHIM_DIR:$PATH"
          if [ ! -d "$SHIM_DIR" ]; then
            echo "::error::cross tool shim $SHIM_DIR is gone; configure did not run first."
            exit 1
          fi
          # Do not call `make -C build`: for QEMU 7.2 a correctly configured tree
          # has no build/ subdirectory at all (configure generates the makefile
          # next to itself unless it was run from the source root), so pointing
          # make at it only ever produced "build: No such file or directory".
          # Build in the tree QEMU's configure already set up, exactly as the QEMU
          # documentation does (`./configure ... && make`).
          if [ ! -f GNUmakefile ] && [ ! -f Makefile ]; then
            echo "::error::No QEMU makefile in the working directory; the configure step did not run in qemu/."
            ls -la
            exit 1
          fi
          # Only the linux-user emulator. The plain `all` target also builds doc/ and
          # the tools, which the Android cross build has no use for (and, without the
          # removed --disable-docs/--disable-tools flags, would fail on).
          set +e
          make -j"$(nproc)" qemu-i386 2>&1 | tee ../qemu-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo '::group::QEMU build diagnostics'
            tail -n 300 ../qemu-build.log || true
            echo '::endgroup::'
            exit "$build_status"
          fi
          test -x build/qemu-i386 || {
            echo "::error::qemu-i386 was not produced."
            exit 1
          }
      - name: Stage as an Android shared object
        run: |
          set -euo pipefail
          mkdir -p out/arm64-v8a
          BIN=$(find qemu -type f -name "qemu-i386" -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::qemu-i386 was not produced by the build."
            exit 1
          fi
          cp "$BIN" out/arm64-v8a/libqemu-i386.so
          chmod 755 out/arm64-v8a/libqemu-i386.so
          "$TOOLCHAIN/bin/llvm-readelf" -h out/arm64-v8a/libqemu-i386.so | head -20
          # An aarch64 static ELF is required; a dynamically linked host build is
          # unusable on Android.
          if "$TOOLCHAIN/bin/llvm-readelf" -l out/arm64-v8a/libqemu-i386.so | grep -q INTERP; then
            echo "::error::qemu-i386 is dynamically linked; rebuild with --static."
            exit 1
          fi
          echo "static: ok"
          ls -lh out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-i386-arm64
          path: out/arm64-v8a/libqemu-i386.so
          retention-days: 30

  proot:
    name: libproot.so (arm64)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # GNUmakefile hard-requires talloc through pkg-config; without libtalloc-dev
          # the build stops at "talloc development files not found".
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates \
            libtalloc-dev libssl-dev qemu-user-static

      - name: Fetch PRoot source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PRoot_COMMIT" https://github.com/proot-me/proot.git proot

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build talloc for arm64
        run: |
          set -euo pipefail
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          # libtalloc-dev from apt supplies x86_64 headers and a host .pc file. PRoot
          # compiles with the NDK against the Android sysroot, so talloc.h was not found
          # and the host archive could not be linked into a static aarch64 binary.
          #
          # Do not clone the Samba repository: lib/talloc there has no configure or
          # autogen.sh, it is a waf component of the larger tree, and its talloc-2.4.2
          # tag is annotated rather than a commit. The released standalone tarball is
          # the supported way to build it; it ships a generated configure script.
          curl -fsSL "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" -o talloc.tgz
          tar xzf talloc.tgz
          cd "talloc-${TALLOC_VERSION}"
          # waf cannot execute the target binaries, so every test that must be
          # run goes through buildtools/wafsamba/samba_cross.py:
          #   - the question is looked up in the cross-answers file by exact
          #     string match ("question: answer");
          #   - a missing answer is appended as "UNKNOWN" and, once the run
          #     finishes, configure aborts with "Cross answers file ... is
          #     incomplete".
          # Seeding every question by hand cannot work: fixing one batch only
          # lets waf proceed to the next batch of run checks (the previous
          # failure at HAVE_SECURE_MKSTEMP was a seeded answer being applied
          # correctly; the abort came from later questions). Instead,
          # --cross-execute=qemu-aarch64-static lets waf run each test binary
          # under qemu-user and record genuine answers for bionic.
          #
          # Only the checks qemu gets wrong stay seeded. qemu-user passes the
          # host uname through, so the machine type would come back as x86_64;
          # getconf LFS_CFLAGS is probed through the host getconf, not the
          # target. aarch64 is LP64, so an empty LFS_CFLAGS is the truth.
          #
          # Answer format matters (cross_answer parser): bare OK/NO/YES/FAIL
          # map to exit codes, but any other value MUST be a quoted string;
          # a bare word ("linux") or an empty value hits
          # "Bad answer format '...'" and aborts configure immediately.
          printf '%s\n' \
            'Checking uname sysname type: "Linux"' \
            'Checking uname machine type: "aarch64"' \
            'Checking uname release type: "6.1.0"' \
            'Checking uname version type: "1"' \
            'Checking getconf LFS_CFLAGS: ""' \
            > ../talloc-cross-answers.txt
          export CFLAGS="-fPIC -D_FILE_OFFSET_BITS=64"
          export LDFLAGS="-static -L$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}"
          export LINK_CC="$CC"
          # Avoid Waf's default -shared version script, which names glibc-only
          # linker boundary symbols (_end, __bss_start, _edata) unavailable on Android.
          export SHLD="$CC"
          export SHLD_FLAGS="-static"
          # --enable-talloc-compat1 is a boolean waf switch and takes no value; passing
          # "=no" aborts with "option does not take a value". Omitting it is correct.
          ./configure \
            --host=aarch64-linux-android \
            --prefix=/opt/talloc-android \
            --disable-python \
            --cross-compile \
            --cross-execute=qemu-aarch64-static \
            --cross-answers=../talloc-cross-answers.txt \
            CC="$CC" || { \
              echo '::error::talloc configure failed; last 120 lines of config.log:'
              tail -n 120 bin/config.log 2>/dev/null || true
              exit 1
            }
          # The default Waf target runs host tests and links a shared library,
          # which fails on Android's linker/version-script differences. Build only
          # the talloc library target, then stage its generated static archive.
          # Samba's waf hard-requires PYTHONHASHSEED=1 (buildtools/wafsamba/wscript).
          # The ./configure and make wrappers set it; this step calls waf directly
          # for --targets=talloc, so set it the same way here.
          PYTHONHASHSEED=1 ./buildtools/bin/waf build --targets=talloc
          install -D -m 644 bin/default/libtalloc.a /opt/talloc-android/libtalloc.a
          install -D -m 644 talloc.h /opt/talloc-android/include/talloc.h
          install -D -m 644 bin/default/talloc.pc /opt/talloc-android/lib/pkgconfig/talloc.pc
          ls /opt/talloc-android/include /opt/talloc-android/lib

      - name: Build
        run: |
          set -euo pipefail
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          echo "CC=$CC" >> "$GITHUB_ENV"
          # Point the compiler and pkg-config at the cross-built talloc, not the host
          # package: a host header would compile but link the wrong object format.
          export PKG_CONFIG_PATH=/opt/talloc-android/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=/opt/talloc-android/lib/pkgconfig
          cd proot/src
          make -j"$(nproc)" \
            CC="$CC" \
            LD="$TOOLCHAIN/bin/ld.lld" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            PREFIX=/ \
            CFLAGS="-I/opt/talloc-android/include -D_FILE_OFFSET_BITS=64" \
            LDFLAGS="-static -s -L/opt/talloc-android/lib -L$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}" \
            PROOT_NO_SECCOMP=1

      - name: Stage as an Android shared object
        run: |
          set -euo pipefail
          mkdir -p out/arm64-v8a
          cp proot/src/proot out/arm64-v8a/libproot.so
          chmod 755 out/arm64-v8a/libproot.so
          ls -lh out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libproot-arm64
          path: out/arm64-v8a/libproot.so
          retention-days: 30
