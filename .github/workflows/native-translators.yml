name: Native Translators

# Builds the two arm64 shared objects PocketSAMP cannot run without and publishes
# them as artifacts, so they can be committed to
# thirdparty/PocketSAMP/app/src/main/jniLibs/arm64-v8a/.
#
#   libqemu-i386.so  QEMU user-mode translator. Both guests are 32-bit x86:
#                    samp03svr (closed source) and mariadbd (Debian i386 build).
#                    Without it neither process starts.
#   libproot.so      PRoot. Optional: it provides /dev, /proc and the gamemode
#                    bind mount to the guest. QEMU works without it, so a failed
#                    PRoot build does not fail the job.
#
# Both are ordinary Linux command-line programs. Android only executes shared
# objects from the APK's lib/<abi>/ directory, hence the "lib*.so" names.

on:
  workflow_dispatch:
  # No `paths:` filter.
  #
  # With one, the job only ran when this file itself changed, so any commit that
  # touched only Kotlin or assets left it out of the run list entirely and it looked
  # as if the workflow had been deleted. Building the translators is the only way the
  # runtime can start, so it is worth running on every push to the main line.
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '29.0.14206865'
  API_LEVEL: '26'
  QEMU_VERSION: '7.2.0'
  QEMU_SHA256: ''
  PRoot_COMMIT: 'master'
  TALLOC_VERSION: '2.4.2'
  GLIB_VERSION: '2.80.0'

jobs:
  qemu:
    name: libqemu-i386.so (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-venv \
            flex bison libglib2.0-dev git

      - name: Fetch QEMU source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${QEMU_VERSION}" https://gitlab.com/qemu-project/qemu.git qemu
          if [ -n "${QEMU_SHA256}" ]; then
            echo "Pinning to a commit is done with --branch above; SHA256 is unused."
          fi

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # The hosted runner image ships cmdline-tools; install the NDK if missing.
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/clang" --version
      - name: Build glib for arm64
        run: |
          set -euo pipefail
          # QEMU's configure compares its idea of sizeof(size_t) with the value glib
          # reports. Host glib says 8 (x86_64) and an Android build says 4 for a 32-bit
          # target or 8 for arm64, and pkg-config picked the host .pc files:
          #   ERROR: sizeof(size_t) doesn't match GLIB_SIZEOF_SIZE_T.
          # The fix is a glib built for the same target, then pointing
          # PKG_CONFIG_LIBDIR at its .pc files instead of the host's.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config python3-pip python3-venv libffi-dev libpcre2-dev
          # A pinned, recent meson in a venv: Ubuntu's 1.3.2 is old enough that some GLib
          # checks fail, and pip on PATH would otherwise shadow the apt copy
          # unpredictably. Both build steps below use this one.
          python3 -m venv /opt/meson-venv
          # glib's meson.build:2422 requires the "packaging" module at configure time:
          #   ERROR: python is missing modules: packaging
          # It is a meson dependency, not a build tool, so it goes into the same venv.
          /opt/meson-venv/bin/pip install --quiet "meson>=1.3,<2" packaging
          # $GITHUB_PATH only affects *subsequent* steps, so the venv is also exported
          # for this one. Without the second line the run failed here with
          #   meson: command not found
          echo "/opt/meson-venv/bin" >> "$GITHUB_PATH"
          export PATH="/opt/meson-venv/bin:$PATH"
          meson --version
          # Annotated tags make `--branch` emit "refs/tags/X is not a commit" and check
          # out the peeled commit, which is fine but noisy. `git clone --branch` also
          # cannot reach an annotated tag on a shallow mirror in some git versions, so
          # the tag is fetched explicitly and checked out by name.
          git init -q glib-src
          cd glib-src
          git remote add origin https://gitlab.gnome.org/GNOME/glib.git
          git fetch -q --depth 1 origin "refs/tags/${GLIB_VERSION}:refs/tags/${GLIB_VERSION}"
          git checkout -q "refs/tags/${GLIB_VERSION}"
          cd ..
          # A meson cross file needs a real file; it is written with printf rather than a
          # here-document because a column-0 "EOF" ends the YAML literal block for
          # `run:`, which invalidates the whole workflow.
          #
          # pkgconfig points at the NDK sysroot so the cross build never resolves a host
          # .pc file, and needs_exe_wrapper tells meson not to try running target logic.
          printf '%s\n' \
            '[binaries]' \
            "c = '$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang'" \
            "ar = '$TOOLCHAIN/bin/llvm-ar'" \
            "strip = '$TOOLCHAIN/bin/llvm-strip'" \
            "pkgconfig = 'pkg-config'" \
            '[properties]' \
            'needs_exe_wrapper = true' \
            '[host_machine]' \
            "system = 'linux'" \
            "kernel = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" > glib-android.ini
          export PKG_CONFIG_LIBDIR="$TOOLCHAIN/sysroot/usr/lib/pkgconfig:$TOOLCHAIN/sysroot/usr/share/pkgconfig"
          # iconv needs two separate fixes and only the second was in place.
          #
          # 1. Link: bionic keeps iconv_open in libc, not libiconv, so
          #    cc.find_library('iconv') fails and meson aborts. A linker script that
          #    maps -liconv to libc satisfies the probe.
          #
          # 2. Compile: bionic's <iconv.h> only declares iconv_open/iconv/iconv_close
          #    when LIBICONV_PLUG is NOT defined - the header expects a libiconv
          #    installation. Without the define, gconvert.c fails with "call to
          #    undeclared function 'iconv_open'". Defining it makes the header expose
          #    the prototypes, which is exactly the configuration glib needs.
          printf 'INPUT(-lc)\n' > "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}/libiconv.a"
          export CFLAGS="-DLIBICONV_PLUG"
          export CXXFLAGS="-DLIBICONV_PLUG"
          cat glib-android.ini
          meson setup glib-build glib-src \
            --cross-file glib-android.ini \
            -Dprefix=/opt/glib-android \
            -Ddefault_library=static \
            -Dtests=false -Ddtrace=false -Dman-pages=disabled \
            -Dlibmount=disabled -Dselinux=disabled \
            -Dglib_debug=disabled -Dbuildtype=release \
            > meson-setup.log 2>&1 || { \
              # Feature probes that fail are normal (bionic lacks getservbyname_r and
              # _aligned_malloc), but they print a full compiler transcript each. The
              # log is kept and only shown when setup actually fails.
              echo '::error::meson setup failed; tail of log:'
              tail -n 80 meson-setup.log
              exit 1
            }
          # Surface the meaningful summary instead of every probe transcript.
          grep -E 'Dependency|Message|Program|C compiler' meson-setup.log | tail -n 40 || true
          meson compile -C glib-build
          meson install -C glib-build
          ls /opt/glib-android/lib/pkgconfig/

      - name: Configure QEMU for aarch64 Linux user-mode
        run: |
          set -euo pipefail
          CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
          # --cross-prefix is deliberately NOT passed: QEMU appends "pkg-config" to it
          # and looks for llvm-pkg-config, which the NDK does not ship (`ERROR:
          # pkg-config binary '.../llvm-pkg-config' not found`). pkg-config itself must
          # stay the host binary, because the libraries it reports (glib, pixman) are
          # built for the host during configure.
          # --static is the only usable mode: Android executes these from lib/<abi>/,
          # and a command-line program has no Java-side loadLibrary to resolve deps.
          cd qemu
          # PKG_CONFIG_LIBDIR (not PKG_CONFIG_PATH) replaces the search list instead of
          # appending to it, which is what the error message asks for: without it the
          # host .pc files are still found first and the size_t check keeps failing.
          export PKG_CONFIG_LIBDIR=/opt/glib-android/lib/pkgconfig
          ./configure \
            --target-list=i386-linux-user \
            --static \
            --disable-system \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-werror \
            --disable-pixman \
            --cc="$CC" --host-cc="$CC" --cxx="$CXX" \
            --extra-cflags="-I/opt/glib-android/include/glib-2.0 -I/opt/glib-android/lib/glib-2.0/include" \
            --extra-ldflags="-L/opt/glib-android/lib"

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Stage as an Android shared object
        run: |
          set -euo pipefail
          mkdir -p out/arm64-v8a
          BIN=$(find . -type f -name 'qemu-i386' -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::qemu-i386 was not produced by the build."
            exit 1
          fi
          cp "$BIN" out/arm64-v8a/libqemu-i386.so
          chmod 755 out/arm64-v8a/libqemu-i386.so
          "$TOOLCHAIN/bin/llvm-readelf" -h out/arm64-v8a/libqemu-i386.so | head -20
          # An aarch64 static ELF is required; a dynamically linked host build is
          # unusable on Android.
          if "$TOOLCHAIN/bin/llvm-readelf" -l out/arm64-v8a/libqemu-i386.so | grep -q INTERP; then
            echo "::error::qemu-i386 is dynamically linked; rebuild with --static."
            exit 1
          fi
          echo "static: ok"
          ls -lh out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-i386-arm64
          path: out/arm64-v8a/libqemu-i386.so
          retention-days: 30

  proot:
    name: libproot.so (arm64)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # GNUmakefile hard-requires talloc through pkg-config; without libtalloc-dev
          # the build stops at "talloc development files not found".
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates \
            libtalloc-dev libssl-dev

      - name: Fetch PRoot source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PRoot_COMMIT" https://github.com/proot-me/proot.git proot

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build talloc for arm64
        run: |
          set -euo pipefail
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          # libtalloc-dev from apt supplies x86_64 headers and a host .pc file. PRoot
          # compiles with the NDK against the Android sysroot, so talloc.h was not found
          # and the host archive could not be linked into a static aarch64 binary.
          #
          # Do not clone the Samba repository: lib/talloc there has no configure or
          # autogen.sh, it is a waf component of the larger tree, and its talloc-2.4.2
          # tag is annotated rather than a commit. The released standalone tarball is
          # the supported way to build it; it ships a generated configure script.
          curl -fsSL "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" -o talloc.tgz
          tar xzf talloc.tgz
          cd "talloc-${TALLOC_VERSION}"
          # Samba refuses to configure without 64-bit off_t:
          #   Samba requires large file support, but not available on this platform:
          #   sizeof(off_t) < 8
          # Bionic leaves off_t at 32 bits unless asked otherwise, and the target has no
          # getconf, so waf cannot detect LFS on its own. _FILE_OFFSET_BITS=64 is the
          # documented switch and bionic honours it for the file APIs talloc uses.
          #
          # The run of UNKNOWN answers (uname, rpath, getconf) is a separate symptom:
          # waf tried to execute the target binary. --cross-answers supplies those
          # values instead of probing.
          # waf aborts on the first probe it cannot answer, so every check the log
          # reported as "not found" needs an explicit answer. They are answered from what
          # bionic actually provides instead of being left to a guessed default.
          printf '%s\n' \
            'Checking uname sysname type: linux' \
            'Checking uname machine type: aarch64' \
            'Checking uname release type: 6.1.0' \
            'Checking uname version type: 1' \
            'Checking getconf LFS_CFLAGS: ' \
            'Checking for large file support without additional flags: OK' \
            'Checking for -D_FILE_OFFSET_BITS=64: OK' \
            'Checking for -D_LARGE_FILES: NO' \
            'Checking for rpath library support: NO' \
            'Checking for -Wl,--version-script support: NO' \
            'Checking for working strptime: NO' \
            'Checking C prototype for gettimeofday: OK' \
            'Checking for C99 vsnprintf: OK' \
            'Checking for HAVE_SHARED_MMAP: OK' \
            'Checking for HAVE_MREMAP: NO' \
            'Checking for HAVE_INCOHERENT_MMAP: NO' \
            'Checking for HAVE_SECURE_MKSTEMP: NO' \
            > ../talloc-cross-answers.txt
          export CFLAGS="-fPIC -D_FILE_OFFSET_BITS=64"
          export LDFLAGS="-static -L$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}"
          # --enable-talloc-compat1 is a boolean waf switch and takes no value; passing
          # "=no" aborts with "option does not take a value". Omitting it is correct.
          ./configure \
            --host=aarch64-linux-android \
            --prefix=/opt/talloc-android \
            --disable-python \
            --cross-compile \
            --cross-answers=../talloc-cross-answers.txt \
            CC="$CC" || { \
              echo '::error::talloc configure failed; last 120 lines of config.log:'
              tail -n 120 bin/config.log 2>/dev/null || true
              exit 1
            }
          make -j"$(nproc)"
          make install
          ls /opt/talloc-android/include /opt/talloc-android/lib
      - name: Build
        run: |
          set -euo pipefail
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          echo "CC=$CC" >> "$GITHUB_ENV"
          # Point the compiler and pkg-config at the cross-built talloc, not the host
          # package: a host header would compile but link the wrong object format.
          export PKG_CONFIG_PATH=/opt/talloc-android/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=/opt/talloc-android/lib/pkgconfig
          cd proot/src
          make -j"$(nproc)" \
            CC="$CC" \
            LD="$TOOLCHAIN/bin/ld.lld" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            PREFIX=/ \
            CFLAGS="-I/opt/talloc-android/include -D_FILE_OFFSET_BITS=64" \
            LDFLAGS="-static -s -L/opt/talloc-android/lib -L$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/${API_LEVEL}" \
            PROOT_NO_SECCOMP=1

      - name: Stage as an Android shared object
        run: |
          set -euo pipefail
          mkdir -p out/arm64-v8a
          cp proot/src/proot out/arm64-v8a/libproot.so
          chmod 755 out/arm64-v8a/libproot.so
          ls -lh out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libproot-arm64
          path: out/arm64-v8a/libproot.so
          retention-days: 30
