name: MariaDB i386 Bundle

# Assembles the MariaDB bundle that PocketSAMP runs through QEMU.
#
# Why i386: the SA-MP server is already i386, the shared rootfs (`rootfs_i386`)
# already carries a real glibc, and the bundled translator (`qemu-i386`) runs 32-bit
# x86. A native arm64 MariaDB would need a bespoke Android/bionic build, which in
# practice does not link (MariaDB needs nsswitch, getpwent and glibc dlopen).
#
# Why Debian and not Ubuntu: Ubuntu 24.04 (noble) builds MariaDB for amd64, arm64,
# armhf, ppc64el, riscv64 and s390x only — there is no i386 package, which is why
# `mariadb-server-core:10.11` resolved to nothing. Debian still ships i386 for
# bookworm (10.11), trixie and sid (11.8), so the .deb files are fetched straight
# from the Debian index instead of through apt.
#
# Result: `mariadb_i386.tar.gz` laid out exactly as MariaDbEngine expects:
#   bin/mariadbd
#   bin/mariadb-install-db
#   lib/...
#   share/mariadb/...

on:
  # Manual run is the normal path: pick the Debian suite and download the artifact.
  # The push trigger makes the job visible in Actions alongside lint/build whenever
  # the workflow or the engine that consumes it changes.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian suite to take i386 packages from'
        required: false
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - trixie
          - sid
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/mariadb-i386-bundle.yml'
      - 'thirdparty/PocketSAMP/app/src/main/java/com/pocketsamp/server/engine/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mariadb-i386-bundle.yml'
      - 'thirdparty/PocketSAMP/app/src/main/java/com/pocketsamp/server/engine/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Assemble mariadb_i386.tar.gz
    runs-on: ubuntu-24.04
    env:
      # Used by push/PR runs, where there is no user input.
      SUITE: ${{ github.event.inputs.suite || 'bookworm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve package URLs from the Debian index
        run: |
          set -euo pipefail
          echo "Suite: $SUITE"
          mkdir -p debs meta

          # Debian's index is served xz-compressed; `xz -dk` keeps the original and
          # writes `Packages`. Fall back to gunzip-style `.gz` if a mirror only has that.
          BASE="https://deb.debian.org/debian/dists/$SUITE/main/binary-i386"
          if curl -fsSL "$BASE/Packages.xz" -o meta/Packages.xz; then
            xz -dk -f meta/Packages.xz
          else
            curl -fsSL "$BASE/Packages.gz" | gunzip > meta/Packages
          fi
          echo "index entries: $(grep -c '^Package: ' meta/Packages || true)"
          echo "mariadb entries: $(grep -c '^Package: mariadb' meta/Packages || true)"

          # Flat index. Parsed line by line instead of with RS="": with a custom
          # record separator, `$0` keeps the blank line that follows a record, so a
          # `^Package: x$` anchor never matches and every lookup silently fails
          # (which is exactly what happened on the previous run).
          #
          # States: looking for `Package: <wanted>`, then the first `Filename:` after it.
          filename_for() {
            awk -v pkg="$1" '
              { sub(/\r$/, "") }
              /^Package: / {
                matching = (substr($0, 10) == pkg)
                next
              }
              matching && /^Filename: / {
                print substr($0, 11)
                exit
              }
            ' meta/Packages
          }

          : > meta/urls.txt
          for pkg in mariadb-server-core mariadb-client-core mariadb-common; do
            f=$(filename_for "$pkg" || true)
            if [ -z "${f:-}" ]; then
              echo "::warning::package $pkg not found in $SUITE/main/binary-i386"
              continue
            fi
            echo "https://deb.debian.org/debian/${f#./}" >> meta/urls.txt
            echo "resolved $pkg"
          done
          cat meta/urls.txt

          if [ ! -s meta/urls.txt ]; then
            echo "::error::No MariaDB i386 packages in suite '$SUITE'. Try trixie or sid."
            exit 1
          fi

          # Copy the shared libraries the daemon needs. The i386 rootfs only provides
          # libc, libstdc++, libgcc_s and libz, so every other dependency must travel
          # with the bundle or mariadbd dies at startup with "error while loading
          # shared libraries". Fetch them by name from the same Debian suite.
          # Libraries mariadbd links against that the rootfs does not ship.
          # The mapping from soname to package is small and stable, so it is spelled out
          # rather than resolved through the Contents index.
          EXTRA_PKGS="libssl3 libpcre2-8-0 libaio1 libnuma1 liburing2 libsystemd0 libcrypt1"
          for pkg in $EXTRA_PKGS; do
            f=$(filename_for "$pkg" || true)
            if [ -z "${f:-}" ]; then
              echo "::warning::dependency package $pkg not in $SUITE/main/binary-i386"
              continue
            fi
            echo "https://deb.debian.org/debian/${f#./}" >> meta/urls.txt
            echo "resolved dependency $pkg"
          done

          ( cd debs && xargs -n1 -a ../meta/urls.txt curl -fsSLO )
          ls -la debs

      - name: Unpack packages
        run: |
          set -euo pipefail
          mkdir -p out
          for f in debs/*.deb; do
            [ -e "$f" ] || continue
            dpkg-deb -x "$f" out
          done
          echo "--- daemon candidates ---"
          find out -type f \( -name mariadbd -o -name mysqld \) -print
          echo "--- shared libraries ---"
          find out -type d -name 'i386-linux-gnu' -print

      - name: Assemble bundle layout
        run: |
          set -euo pipefail
          BUNDLE=bundle
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/bin" "$BUNDLE/lib" "$BUNDLE/share/mariadb"

          DAEMON=$(find out -type f \( -name mariadbd -o -name mysqld \) | head -n1)
          if [ -z "$DAEMON" ]; then
            echo "::error::No mariadbd found in the fetched packages"
            exit 1
          fi
          INSTALL_DB=$(find out -type f \( -name mariadb-install-db -o -name mysql_install_db \) | head -n1)

          cp "$DAEMON" "$BUNDLE/bin/mariadbd"          if [ -n "$INSTALL_DB" ]; then
            cp "$INSTALL_DB" "$BUNDLE/bin/mariadb-install-db"
          else
            echo "::warning::mariadb-install-db missing; the engine falls back to mariadbd --initialize-insecure"
          fi

          # Ship the libraries extracted from every dependency package. `cp -a` keeps
          # the soname symlinks (libssl.so.3 -> libssl.so.3.x) that the loader needs.
          for libdir in $(find out -type d -name 'i386-linux-gnu'); do
            cp -a "$libdir"/. "$BUNDLE/lib/" 2>/dev/null || true
          done
          # Debian also drops some sonames directly in /usr/lib; take those too.
          ( find out/usr/lib out/lib -maxdepth 1 \( -type f -o -type l \) 2>/dev/null || true ) | \
            while read -r f; do cp -a "$f" "$BUNDLE/lib/" 2>/dev/null || true; done

          echo "--- bundle libraries ---"
          ls -la "$BUNDLE/lib" | head -40

          # Error messages (--lc-messages-dir).
          if [ -d out/usr/share/mysql ]; then
            mkdir -p "$BUNDLE/share/mariadb"
            cp -a out/usr/share/mysql/. "$BUNDLE/share/mariadb/"
          elif [ -d out/usr/share/mariadb ]; then
            mkdir -p "$BUNDLE/share/mariadb"
            cp -a out/usr/share/mariadb/. "$BUNDLE/share/mariadb/"
          else
            echo "::warning::no share/mysql or share/mariadb found; error messages will fall back to codes"
          fi

          echo "--- bundle ---"
          find "$BUNDLE" -maxdepth 2 | sort | head -40
          file "$BUNDLE/bin/mariadbd"

          # The engine launches this through qemu-i386, which only accepts 32-bit
          # x86. Fail here rather than on the device.
          if ! file "$BUNDLE/bin/mariadbd" | grep -q 'ELF 32-bit LSB.*Intel 80386'; then
            echo "::error::mariadbd is not an i386 ELF; refusing to publish a bundle the translator cannot run."
            exit 1
          fi

          chmod +x "$BUNDLE/bin/"* 2>/dev/null || true

      - name: Package and checksum
        run: |
          set -euo pipefail
          tar -C bundle -czf mariadb_i386.tar.gz bin lib share
          sha256sum mariadb_i386.tar.gz | tee mariadb_i386.tar.gz.sha256
          ls -lh mariadb_i386.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mariadb_i386-bundle-${{ env.SUITE }}
          path: |
            mariadb_i386.tar.gz
            mariadb_i386.tar.gz.sha256
          retention-days: 30
