name: Build PocketSAMP APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Task Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketSAMP-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to High-Speed Mirrors
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "PocketSAMP-v1.0.0-signed.apk"

            # 1. Litterbox (Catbox) - Direct Fast Download (No Captcha, No Queue)
            echo "Uploading APK to Litterbox..."
            LITTER_URL=$(curl -s --max-time 30 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@PocketSAMP-v1.0.0-signed.apk" https://litterbox.catbox.moe/resources/internals/api.php)
            echo "Litterbox output: $LITTER_URL"
            if [[ "$LITTER_URL" =~ ^https?:// ]]; then
              echo "================================================="
              echo "🚀 DIRECT DOWNLOAD LINK (LITTERBOX): $LITTER_URL"
              echo "================================================="
              echo "### ⚡ Direct Fast Download (Litterbox)" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Download PocketSAMP APK Direct ($LITTER_URL)]($LITTER_URL)**" >> $GITHUB_STEP_SUMMARY
            fi

            # 2. TmpFiles Upload (Fast, Direct, No Queue)
            echo "Uploading APK to TmpFiles..."
            TMP_RESP=$(curl -s --max-time 45 -F "file=@PocketSAMP-v1.0.0-signed.apk" https://tmpfiles.org/api/v1/upload)
            TMP_URL=$(echo "$TMP_RESP" | jq -r '.data.url // empty')
            if [ -n "$TMP_URL" ]; then
              echo "🚀 TMPFILES DOWNLOAD LINK: $TMP_URL"
              echo "### ⚡ TmpFiles Direct Mirror" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Download via TmpFiles ($TMP_URL)]($TMP_URL)**" >> $GITHUB_STEP_SUMMARY
            fi

            # 2. GoFile Upload (with 60s timeout to prevent hanging)
            echo "Uploading APK to GoFile..."
            SERVER=$(curl -s --max-time 15 https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
            RESPONSE=$(curl -s --max-time 60 -F "file=@PocketSAMP-v1.0.0-signed.apk" "https://${SERVER}.gofile.io/contents/uploadfile")
            DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
            if [ -n "$DOWNLOAD_PAGE" ]; then
              echo "================================================="
              echo "🚀 GOFILE HIGH-SPEED DOWNLOAD LINK: $DOWNLOAD_PAGE"
              echo "================================================="
              echo "### 🚀 GoFile High-Speed Direct Link" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Download PocketSAMP APK ($DOWNLOAD_PAGE)]($DOWNLOAD_PAGE)**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
